    if(setRes.data){
      setRes.data.forEach(s=>{
        if(s.key==='palette' && s.value) palette=s.value;
        if(s.key==='client_types' && s.value) clientTypes=s.value;
        if(s.key==='digests' && s.value) digests=s.value;
        if(s.key==='custom_views' && s.value) customViews=s.value;
        if(s.key==='tax_jobs' && s.value) taxJobs=s.value;
        if(s.key==='role_perms' && s.value){
          Object.keys(s.value).forEach(rid=>{ if(rid==='admin'||!ROLES[rid])return; Object.assign(ROLES[rid].perms, s.value[rid]); });
        }
        if(s.key==='tax_return_types' && s.value && s.value.length) taxReturnTypes=s.value;
        if(s.key==='tax_statuses' && s.value && s.value.length) taxStatuses=s.value;
        if(s.key==='client_statuses' && s.value && s.value.length) clientStatuses=s.value;
        if(s.key==='entity_files' && s.value) entityFiles=s.value;
        if(s.key==='nid' && s.value) nid=+s.value;
      });
    }
    dbReady = true;
    console.log('DB loaded — members:'+members.length+' tasks:'+tasks.length);
    return true;
  } catch(e){ console.error('dbLoad error',e); return false; }
}

function startRealtimeSync(){
  const client=getSB();
  if(!client || realtimeStarted)return;
  realtimeStarted=true;
  const tables=['members','clients','projects','tasks','todos','audit_log','app_settings'];
  const ch=client.channel('sas-live-sync');
  tables.forEach(tbl=>{
    ch.on('postgres_changes',{event:'*',schema:'public',table:tbl},()=>scheduleRealtimeReload());
  });
  ch.subscribe(status=>console.log('Realtime sync:',status));
}

async function initApp(){
  // Show loading state
  const lw = document.getElementById('login-wrap');
  lw.style.display='flex';
  lw.innerHTML='<div style="text-align:center;color:var(--text2)"><div style="font-size:22px;font-weight:700;margin-bottom:8px">Signature AS</div><div style="font-size:13px;color:var(--text3)">Loading…</div></div>';

  // Load all data from Supabase
  await dbLoad();
  startRealtimeSync();

  // Prepare login screen UI but keep it hidden until auth fails
  lw.style.display='none';
  lw.innerHTML=`<div class="login-card">
    <div style="font-size:22px;font-weight:700;margin-bottom:4px;letter-spacing:-.5px">Signature AS</div>
    <div style="font-size:13px;color:var(--text2);margin-bottom:24px">Task & project manager</div>
    <button onclick="loginMS()" style="display:flex;align-items:center;gap:10px;padding:11px 16px;border:1px solid var(--border2);border-radius:var(--radius);cursor:pointer;background:var(--bg);font-size:14px;font-weight:500;font-family:var(--font);color:var(--text);width:100%;justify-content:center;margin-bottom:10px">

      Sign in with Microsoft
    </button>
    <div id="login-msg" style="font-size:12px;color:var(--text3);margin-top:10px;text-align:center"></div>
  </div>`;

  // Handle redirect response (mobile login comes back here)
  try {
    const sb2client = await getMsal();
    const redirectResp = await sb2client.handleRedirectPromise();
    if(redirectResp && redirectResp.account){
      const acct = redirectResp.account;
      const email = acct.username;
      const name = acct.name || email;
      const ini = name.split(' ').filter(Boolean).map(w=>w[0]).join('').toUpperCase().slice(0,2);
      // Reload members from DB
      try {
        const sb2 = getSB();
        if(sb2){
          const {data} = await sb2.from('members').select('*');
          if(data && data.length > 0){
            members = data.map(memberFromRow);
          }
        }
      } catch(e){}
      const existingMember = members.find(m=>m.email.toLowerCase()===email.toLowerCase());
      if(existingMember){
        addLog('Microsoft SSO login (mobile)',name+' ('+email+')');
        loginAs(existingMember.id);
        return;
      } else {
        lw.style.display='flex';
        const msg = document.getElementById('login-msg');
        if(msg) msg.innerHTML=`<div style="background:var(--danger-bg);color:var(--danger);padding:10px 14px;border-radius:var(--radius);font-size:13px;margin-top:8px"><strong>Access not granted.</strong><br><em>${email}</em> has not been added to Signature AS.<br><span style="font-size:12px">Contact Edgar Zalinyan to request access.</span></div>`;
        return;
      }
    }
  } catch(e){ console.log('No redirect response'); }

  // Check for saved session by email
  const savedEmail = localStorage.getItem('sasflow_current_email');
  if(savedEmail){
    const savedUser = members.find(m=>m.email.toLowerCase()===savedEmail.toLowerCase());
    if(savedUser){
      loginAs(savedUser.id);
      checkExistingSession(); // refresh MS token in background
      return;
    }
    // Email not in DB anymore - clear saved session
    localStorage.removeItem('sasflow_current_email');
    localStorage.removeItem('sasflow_current_user');
  }
  // Check Microsoft SSO
  const msLoggedIn = await checkExistingSession();
  if(!msLoggedIn) lw.style.display='flex';
}

<script id="sas-v22-ui-prefs-script">
(function(){
  const DEFAULT_NAV_ORDER=['dashboard','tasks','tax','projects','todos','today','recurring','clients','views','log'];
  const NAV_LABELS={dashboard:'Dashboard',tasks:'All tasks',tax:'Tax',projects:'Projects',todos:'To-dos',today:'Today',recurring:'Recurring',clients:'Clients',views:'Saved views',log:'Audit log'};
  const NAV_ICONS={dashboard:'ti-layout-dashboard',tasks:'ti-list',tax:'ti-file-dollar',projects:'ti-folder',todos:'ti-circle-check',today:'ti-calendar',recurring:'ti-refresh',clients:'ti-building',views:'ti-bookmark',log:'ti-clipboard-list'};
  function prefKey(){return 'sasflow_ui_prefs_'+((window.currentUser&&currentUser.id)||'default');}
  function getPrefs(){try{return JSON.parse(localStorage.getItem(prefKey())||'{}')||{};}catch(e){return {};}}
  function setPrefs(p){localStorage.setItem(prefKey(),JSON.stringify(p)); try{ if(typeof dbSaveSetting==='function'&&window.currentUser) dbSaveSetting('ui_prefs_'+currentUser.id,p); }catch(e){} }
  function navView(el){
    const s=(el.getAttribute('onclick')||'').match(/gv\('([^']+)'/); if(s) return s[1];
    if(el.id==='nav-tasks') return 'tasks';
    if(el.id==='nav-log') return 'log';
    return '';
  }
  function viewNavs(){return Array.from(document.querySelectorAll('.sidebar > .nav')).filter(el=>navView(el));}
  function teamStart(){return Array.from(document.querySelectorAll('.sidebar > .sb-sec')).find(x=>(x.textContent||'').trim().toLowerCase()==='team');}
  function applyNavOrder(){
    const sb=document.getElementById('sidebar'); if(!sb) return;
    const team=teamStart(); if(!team) return;
    let order=getPrefs().navOrder||DEFAULT_NAV_ORDER.slice();
    const els={}; viewNavs().forEach(el=>{els[navView(el)]=el;});
    order.concat(DEFAULT_NAV_ORDER).forEach(v=>{ if(els[v]) sb.insertBefore(els[v],team); });
    installCustomizeButton();
  }
  function installCustomizeButton(){
    if(document.getElementById('sas-customize-views')) return;
    const viewsSec=Array.from(document.querySelectorAll('.sidebar > .sb-sec')).find(x=>(x.textContent||'').trim().toLowerCase()==='views');
    if(!viewsSec) return;
    const box=document.createElement('div'); box.id='sas-customize-views'; box.className='sas-customize-views';
    box.innerHTML='<button class="btn btn-sm" onclick="openSidebarCustomize()"><i class="ti ti-adjustments"></i><span class="sb-lbl">Customize views</span></button>';
    viewsSec.parentNode.insertBefore(box, viewsSec.nextSibling);
  }
  window.openSidebarCustomize=function(){
    const prefs=getPrefs(); const order=(prefs.navOrder||DEFAULT_NAV_ORDER.slice()).filter(v=>DEFAULT_NAV_ORDER.includes(v));
    DEFAULT_NAV_ORDER.forEach(v=>{if(!order.includes(v))order.push(v);});
    window._sasTempNavOrder=order.slice();
    const mode=prefs.viewMode||'cards';
    const list=()=>window._sasTempNavOrder.map((v,i)=>`<div class="sas-order-item"><i class="ti ${NAV_ICONS[v]||'ti-circle'}"></i><b>${NAV_LABELS[v]||v}</b><button class="btn btn-xs" onclick="moveSidebarItem(${i},-1)"><i class="ti ti-arrow-up"></i></button><button class="btn btn-xs" onclick="moveSidebarItem(${i},1)"><i class="ti ti-arrow-down"></i></button></div>`).join('');
    showModal(`<div class="mhdr"><h2>Customize sidebar & view</h2><button class="btn btn-ghost btn-sm" onclick="closeModal()"><i class="ti ti-x"></i></button></div><div class="mbody"><div class="fl"><label>Default job view</label><select class="fi" id="sas-view-mode-modal"><option value="cards" ${mode==='cards'?'selected':''}>Comfortable cards</option><option value="table" ${mode==='table'?'selected':''}>Compact table</option></select></div><div class="fl"><label>Sidebar order</label><div style="font-size:12.5px;color:var(--text3);margin-bottom:8px">Move the views up or down. Your order is saved for your login.</div><div id="sas-order-list" class="sas-order-list">${list()}</div></div></div><div class="mftr" style="justify-content:space-between"><button class="btn btn-sm" onclick="resetSidebarOriginal()"><i class="ti ti-restore"></i>Reset to original</button><div><button class="btn btn-sm" onclick="closeModal()">Cancel</button><button class="btn btn-pri btn-sm" onclick="saveSidebarCustomize()"><i class="ti ti-device-floppy"></i>Save</button></div></div>`);
  };
  window.moveSidebarItem=function(i,dir){const a=window._sasTempNavOrder||DEFAULT_NAV_ORDER.slice();const j=i+dir;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];window._sasTempNavOrder=a;closeModal();openSidebarCustomize();};
  window.saveSidebarCustomize=function(){const p=getPrefs();p.navOrder=(window._sasTempNavOrder||DEFAULT_NAV_ORDER.slice()).slice();p.viewMode=document.getElementById('sas-view-mode-modal').value||'cards';setPrefs(p);closeModal();applyNavOrder();applyViewMode();renderView();toast('View preferences saved');};
  window.resetSidebarOriginal=function(){const p=getPrefs();p.navOrder=DEFAULT_NAV_ORDER.slice();p.viewMode='cards';setPrefs(p);closeModal();applyNavOrder();applyViewMode();renderView();toast('Original view restored');};
  function applyViewMode(){
    const mode=(getPrefs().viewMode||'cards');
    document.body.classList.toggle('sas-view-table',mode==='table');
    document.body.classList.toggle('sas-view-cards',mode==='cards');
  }
  function addViewModeControl(){
    const tb=document.querySelector('#main-content .topbar'); if(!tb||document.getElementById('sas-view-mode-control')) return;
    if(!['tasks','projects','todos','tax','clients'].includes(window.currentView)) return;
    const mode=getPrefs().viewMode||'cards';
    const div=document.createElement('div'); div.id='sas-view-mode-control'; div.className='sas-view-toggle';
    div.innerHTML=`<i class="ti ti-layout-list"></i><select onchange="saveQuickViewMode(this.value)"><option value="cards" ${mode==='cards'?'selected':''}>Cards</option><option value="table" ${mode==='table'?'selected':''}>Table</option></select>`;
    tb.appendChild(div);
  }
  window.saveQuickViewMode=function(mode){const p=getPrefs();p.viewMode=mode;p.navOrder=p.navOrder||DEFAULT_NAV_ORDER.slice();setPrefs(p);applyViewMode();renderView();};
  const _renderView=window.renderView;
  if(typeof _renderView==='function'){
    window.renderView=function(){ const r=_renderView.apply(this,arguments); setTimeout(()=>{applyNavOrder();applyViewMode();addViewModeControl();},0); return r; };
  }
  const _loginAs=window.loginAs;
  if(typeof _loginAs==='function'){
    window.loginAs=function(){ const r=_loginAs.apply(this,arguments); setTimeout(()=>{applyNavOrder();applyViewMode();addViewModeControl();},0); return r; };
  }
  setTimeout(()=>{applyNavOrder();applyViewMode();addViewModeControl();},300);
})();
</script>

<script id="sas-v26-table-today-recurring-script">
(function(){
  function esc2(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
  function todayStr(){ return new Date().toISOString().slice(0,10); }
  function nextDue(d,recur){
    if(!d||!recur) return '';
    const dt=new Date(d+'T12:00:00');
    if(isNaN(dt)) return '';
    const r=String(recur).toLowerCase();
    if(r==='daily') dt.setDate(dt.getDate()+1);
    else if(r==='weekly') dt.setDate(dt.getDate()+7);
    else if(r==='semimonthly') dt.setDate(dt.getDate()+15);
    else if(r==='monthly') dt.setMonth(dt.getMonth()+1);
    else if(r==='quarterly') dt.setMonth(dt.getMonth()+3);
    else if(r==='annual'||r==='yearly') dt.setFullYear(dt.getFullYear()+1);
    else return '';
    return dt.toISOString().slice(0,10);
  }
  function createNextTask(t){
    if(!t||!t.recur||t._nextCreated) return;
    const nd=nextDue(t.due||todayStr(),t.recur); if(!nd) return;
    const nt={...t,id:++nid,due:nd,done:false,subtasks:(t.subtasks||[]).map(s=>({...s,id:++nid,done:false,due:nextDue(s.due||t.due||todayStr(),t.recur)||nd}))};
    t._nextCreated=true; tasks.unshift(nt);
    try{dbSaveTask(t);dbSaveTask(nt);dbSaveNid();addLog('Created recurring task',nt.name+' → '+fmtDate(nt.due),'task',nt.id);}catch(e){}
  }
  function createNextTodo(td){
    if(!td||!td.recur||td._nextCreated) return;
    const nd=nextDue(td.due||todayStr(),td.recur); if(!nd) return;
    const nt={...td,id:++nid,due:nd,done:false}; td._nextCreated=true; todos.unshift(nt);
    try{dbSaveTodo(td);dbSaveTodo(nt);dbSaveNid();addLog('Created recurring to-do',nt.name+' → '+fmtDate(nt.due),'todo',nt.id);}catch(e){}
  }
  window.createNextRecurringIfNeeded=function(kind,obj){ if(kind==='task')createNextTask(obj); if(kind==='todo')createNextTodo(obj); };

  const oldTglDone=window.tglDone;

  };

    const td=todos.find(x=>x.id===id); const was=td&&td.done;
    const r=oldTglTodoDone.apply(this,arguments);
    if(td && !was && td.done && td.recur){ createNextTodo(td); renderView(); updateBadges(); toast('Completed. Next recurring to-do created.'); }

      <div class="gr2"><div><label>Due date</label>${dueDateField('ntd-due','')}</div><div><label>Priority</label><div style="display:flex;gap:5px"><button class="ro" onclick="selPrio2(this,'ntd-prio','low')">Low</button><button class="ro on" onclick="selPrio2(this,'ntd-prio','normal')">Normal</button><button class="ro" onclick="selPrio2(this,'ntd-prio','high')">High</button></div><input type="hidden" id="ntd-prio" value="normal"></div></div>
      <div class="fl"><label>Recurring</label><div style="display:flex;flex-wrap:wrap;gap:5px">${['','daily','weekly','monthly','quarterly','annual'].map(r=>`<button class="ro ${!r?'on':''}" onclick="selRo(this,'ntd-recur','${r}')">${r||'One-time'}</button>`).join('')}</div><input type="hidden" id="ntd-recur" value=""></div>

    <div class="fl"><label>Notes</label><textarea class="fi" id="ntd-notes" rows="2"></textarea></div>
      ${renderTempFilesSection('new-todo','To-do attachments')}
    </div>
    <div class="mftr"><button class="btn btn-sm" onclick="closeModal()">Cancel</button><button class="btn btn-pri btn-sm" onclick="saveNewTodo()"><i class="ti ti-check"></i>Add to-do</button></div>`);
  };
  window.saveNewTodo=function(){
    const name=document.getElementById('ntd-name').value.trim(); if(!name)return;
    const assignee=document.getElementById('ntd-assign').value; const clientId=document.getElementById('ntd-cli').value;
    if(!validateAssignment(assignee,clientId))return;
    const todoId=++nid;
    const td={id:todoId,name,assignee,client:clientId,due:document.getElementById('ntd-due').value,priority:document.getElementById('ntd-prio').value,notes:document.getElementById('ntd-notes').value,recur:document.getElementById('ntd-recur').value,period:document.getElementById('ntd-period')?.value||'',done:false};

  window.renderTodos=function(mc){
    const list=todos.filter(x=>canSeeTodo(x));
    const q=(window._todoQ||'').toLowerCase();
    const filtered=q?list.filter(x=>(x.name||'').toLowerCase().includes(q)||(getCli(x.client)||{}).name?.toLowerCase().includes(q)):list;

  // Today uses the dynamic current date and includes to-dos reliably.
  const oldGetVisTasks=window.getVisTasks;
  window.getVisTasks=function(){
    let arr=[...tasks,...todos.map(td=>({...td,_isTodo:true,project:'',subtasks:[]}))];

    if(fCli) arr=arr.filter(x=>x.client===fCli||(getProj(x.project).client===fCli));
    if(fProj){ if(fProj==='__todo') arr=arr.filter(x=>x._isTodo); else arr=arr.filter(x=>x.project===fProj); }
    if(fStat==='open') arr=arr.filter(x=>!isTaskDone(x)); if(fStat==='done') arr=arr.filter(x=>isTaskDone(x));
    if(fQ){const q=fQ.toLowerCase();arr=arr.filter(x=>(x.name||'').toLowerCase().includes(q)||(x.subtasks&&x.subtasks.some(s=>(s.name||'').toLowerCase().includes(q))));}
    if(sortC==='project')arr.sort((a,b)=>sortD*(getProj(a.project).name.localeCompare(getProj(b.project).name)));
    else if(sortC==='task')arr.sort((a,b)=>sortD*(a.name||'').localeCompare(b.name||''));
    else if(sortC==='due')arr.sort((a,b)=>sortD*((a.due||'9999')>(b.due||'9999')?1:-1));
    else if(sortC==='assignee')arr.sort((a,b)=>sortD*getMem(a.assignee).name.localeCompare(getMem(b.assignee).name));
    return arr;
  };

  function openQuickAdd(){
    const cid=(window.detailType==='client'&&window.detailId)?window.detailId:'';
    const clientLine=cid?`<div style="font-size:12px;color:var(--text3);margin-bottom:10px">For client: <b>${esc2(getCli(cid)?.name||'')}</b></div>`:'';
    showModal(`<div class="mhdr"><h2>Add new item</h2><button class="btn btn-ghost btn-sm" onclick="closeModal()"><i class="ti ti-x"></i></button></div><div class="mbody">${clientLine}<div class="sas-quick-grid"><button class="sas-quick-card" onclick="closeModal();openNewTask('', '${cid}')"><i class="ti ti-list-check"></i><b>Task</b><div style="font-size:12px;color:var(--text3)">Create a standalone task</div></button><button class="sas-quick-card" onclick="closeModal();openNewTodo('${cid}')"><i class="ti ti-circle-check"></i><b>To-do</b><div style="font-size:12px;color:var(--text3)">Create a quick to-do</div></button><button class="sas-quick-card" onclick="closeModal();openNewProject('${cid}')"><i class="ti ti-folder-plus"></i><b>Project</b><div style="font-size:12px;color:var(--text3)">Create a project</div></button>${perm('manage_clients')?`<button class="sas-quick-card" onclick="closeModal();openNewClient()"><i class="ti ti-building-plus"></i><b>Client</b><div style="font-size:12px;color:var(--text3)">Add a client</div></button>`:''}</div></div>`);
  }
  window.openQuickAdd=openQuickAdd;

  function addGlobalAddButton(){
    const tb=document.querySelector('#main-content .topbar'); if(!tb||document.getElementById('sas-global-add-btn')) return;

  function addClientContextButton(){
    if(!(window.detailType==='client'&&window.detailId)) return;
    const tb=document.querySelector('#main-content .topbar'); if(!tb||document.getElementById('sas-client-context-add')) return;
    const tab=window._cliTab||'overview';
    let label='Add item', fn=`openQuickAdd()`;
    if(tab==='todos'){label='Add to-do';fn=`openNewTodo('${window.detailId}')`;}
    if(tab==='projects'){label='Add project';fn=`openNewProject('${window.detailId}')`;}
    if(tab==='tasks'){label='Add task';fn=`openNewTask('', '${window.detailId}')`;}
    const b=document.createElement('button'); b.id='sas-client-context-add'; b.className='btn btn-sm'; b.innerHTML='<i class="ti ti-plus"></i> '+label; b.onclick=function(){window[fn.split('(')[0]] && eval(fn)}; tb.appendChild(b);
  }

  const prevRender=window.renderView;
  window.renderView=function(){ const r=prevRender.apply(this,arguments); setTimeout(()=>{addGlobalAddButton();addClientContextButton();},0); return r; };
  setTimeout(()=>{addGlobalAddButton();addClientContextButton();},400);
})();
</script>

`}).join('')||'<div style="padding:14px;color:var(--text3)">No subtasks</div>'}</div>`:''}${tab==='files'&&perm('view_files')?renderFilesSection('task-'+id,perm('upload_files')):''}</div>
    <div class="mftr"><button class="btn btn-sm" onclick="closeModal()">Close</button>${perm('edit_task')?`<button class="btn btn-pri btn-sm" onclick="closeModal();openEditTask(${id})"><i class="ti ti-edit"></i>Edit</button>`:''}</div>`);
  };

  window.openTodo=function(id){
    const td=todos.find(x=>x.id===id); if(!td) return;
    const cli=getCli(td.client); const m=getMem(td.assignee); const mcx=mc2(m.palId); const late=isLate(td.due,td.done); let tab=window._todoViewTab||'details';
    showModal(`<div class="mhdr"><div style="min-width:0;flex:1"><div class="sas-detail-title">${esc(td.name)}</div><div class="sas-detail-subtitle"><span class="tag" style="background:var(--bg2);color:var(--text2)">To-do</span>${td.done?`<span class="tag" style="background:var(--success-bg);color:var(--success)">Completed</span>`:`<span class="tag" style="background:var(--info-bg);color:var(--info)">Open</span>`}</div></div><button class="btn btn-ghost btn-sm" onclick="closeModal()"><i class="ti ti-x"></i></button></div>
    <div style="display:flex;gap:2px;border-bottom:1px solid var(--border);padding:0 20px"><div class="tab ${tab==='details'?'active':''}" onclick="window._todoViewTab='details';closeModal();openTodo(${id})">Details</div>${perm('view_files')?`<div class="tab ${tab==='files'?'active':''}" onclick="window._todoViewTab='files';closeModal();openTodo(${id})">Files (${getFiles('todo-'+id).length})</div>`:''}</div>
    <div class="mbody">${tab==='details'?`<div class="sas-info-grid"><div class="sas-info-card"><div class="sas-info-label">To-do name</div><div class="sas-info-value">${esc(td.name)}</div></div><div class="sas-info-card"><div class="sas-info-label">Client</div><div class="sas-info-value">${cli?esc(cli.name):'—'}</div></div><div class="sas-info-card"><div class="sas-info-label">Assignee</div><div class="sas-info-value"><span class="av" style="width:24px;height:24px;background:${mcx.bg};color:${mcx.tc};font-size:9px">${m.initials}</span>${esc(m.name)}</div></div><div class="sas-info-card"><div class="sas-info-label">Deadline / Due date</div><div class="sas-info-value" style="color:${late?'var(--danger)':'#111827'}">${fmtDate(td.due)} ${relDate(td.due)?`<span class="rel-date">${relDate(td.due)}</span>`:''}</div></div><div class="sas-info-card"><div class="sas-info-label">Priority</div><div class="sas-info-value">${td.priority||'normal'}</div></div><div class="sas-info-card"><div class="sas-info-label">Status</div><div class="sas-info-value">${td.done?'Completed':'Open'}</div></div></div><div class="sas-notes-card"><div class="sas-info-label">Notes</div><div style="white-space:pre-wrap;color:var(--text2)">${esc(td.notes||'—')}</div></div>`:''}${tab==='files'&&perm('view_files')?renderFilesSection('todo-'+id,perm('upload_files')):''}</div>
    <div class="mftr"><button class="btn btn-sm" onclick="closeModal()">Close</button><button class="btn btn-pri btn-sm" onclick="closeModal();openEditTodo(${id})"><i class="ti ti-edit"></i>Edit</button></div>`);
  };

  const previousRenderView=window.renderView;
  window.renderView=function(){ const r=previousRenderView.apply(this,arguments); setTimeout(afterRender,0); return r; };
  setTimeout(()=>{ currentView=viewFromHash(); setActiveNav(currentView); afterRender(); },500);
})();
</script>

    .sas-note-panel{border:1px solid var(--border);border-radius:14px;background:#fff;padding:14px;margin-top:14px;}
    .sas-note-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;gap:8px;}
    .sas-note-title{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:#64748b;}
    .sas-note-row{display:flex;gap:9px;padding:9px 0;border-top:1px solid var(--border);}
    .sas-note-row:first-of-type{border-top:0;}
    .sas-note-body{font-size:14px;color:#1f2937;white-space:pre-wrap;line-height:1.45;}
    .sas-note-meta{font-size:11.5px;color:#94a3b8;margin-bottom:3px;}
    .sas-mention{font-weight:800;color:#1d4ed8;background:#dbeafe;border-radius:999px;padding:1px 6px;margin-right:4px;}
    .sas-notif-card{border:1px solid var(--border);border-radius:14px;background:#fff;padding:13px 15px;margin:8px 18px;display:flex;gap:10px;align-items:flex-start;}
    .sas-notif-card.unread{border-color:#bfdbfe;background:#eff6ff;}
    .sas-unread-badge{font-size:11px;background:#dc2626;color:#fff;border-radius:999px;padding:1px 6px;font-weight:800;margin-left:auto;}
  `;
  document.head.appendChild(style);

  function esc2(x){ return (window.esc?esc(x):String(x||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))); }
  function nowStamp(){ return new Date().toISOString(); }
  function fmtStamp(ts){ try{ const d=new Date(ts); return d.toLocaleString([], {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'}); }catch(e){ return ts||''; } }
  const NOTE_KEY='sasflow_mentions_notes_v1';
  function loadNotes(){ try{return JSON.parse(localStorage.getItem(NOTE_KEY)||'[]')}catch(e){return[]} }
  function saveNotes(arr){ localStorage.setItem(NOTE_KEY,JSON.stringify(arr)); }
  window.sasGetNotes=function(type,id){ return loadNotes().filter(n=>n.entityType===type && String(n.entityId)===String(id)).sort((a,b)=>String(b.ts).localeCompare(String(a.ts))); };
  function unreadForUser(){ if(!currentUser) return []; return loadNotes().filter(n=>(n.mentions||[]).includes(currentUser.id) && !(n.readBy||[]).includes(currentUser.id)); }
  window.sasAddNote=function(type,id){
    const body=(document.getElementById('sas-note-body-'+type+'-'+id)||{}).value||'';
    const mention=(document.getElementById('sas-note-mention-'+type+'-'+id)||{}).value||'';
    if(!body.trim()){toast('Please write a note or question');return;}
    const arr=loadNotes();
    const note={id:'n'+Date.now(),entityType:type,entityId:id,author:currentUser.id,body:body.trim(),mentions:mention?[mention]:[],ts:nowStamp(),readBy:[currentUser.id]};

    addLog('Added note/question',`${type} ${id}${mention?' → @'+getMem(mention).name:''}`,type,id);
    toast(mention?'Note added and user tagged':'Note added');
    if(type==='task') openTask(+id); else openTodo(+id);
  };
  window.sasMarkNoteRead=function(noteId){
    const arr=loadNotes(); const n=arr.find(x=>x.id===noteId); if(n&&currentUser){ n.readBy=[...(new Set([...(n.readBy||[]),currentUser.id]))]; saveNotes(arr); renderView(); }
  };
  window.sasMarkAllRead=function(){ const arr=loadNotes(); arr.forEach(n=>{ if((n.mentions||[]).includes(currentUser.id)){ n.readBy=[...(new Set([...(n.readBy||[]),currentUser.id]))]; }}); saveNotes(arr); renderView(); toast('Notifications marked read'); };
  window.renderNotesPanel=function(type,id){

      <div style="margin-top:10px">${notes.length?notes.map(n=>{const a=getMem(n.author);const c=mc2(a.palId);const mens=(n.mentions||[]).map(mid=>`<span class="sas-mention">@${esc2(getMem(mid).name)}</span>`).join('');return `<div class="sas-note-row"><div class="av" style="width:28px;height:28px;background:${c.bg};color:${c.tc};font-size:10px">${a.initials}</div><div style="flex:1"><div class="sas-note-meta"><strong>${esc2(a.name)}</strong> · ${fmtStamp(n.ts)}</div><div class="sas-note-body">${mens}${esc2(n.body)}</div></div></div>`}).join(''):'<div style="font-size:13px;color:#94a3b8;padding:8px 0">No questions or notes yet.</div>'}</div>
    </div>`;
  };

  function ensureNotificationsNav(){
    if(document.getElementById('nav-notifications')) return;
    const views=[...document.querySelectorAll('.sidebar .nav')].find(n=>(n.getAttribute('onclick')||'').includes("'views'"));
    const div=document.createElement('div'); div.className='nav'; div.id='nav-notifications'; div.title='Notifications';
    div.onclick=function(){ ov('notifications'); mobileAfterNav&&mobileAfterNav(); };
    div.innerHTML='<i class="ti ti-bell"></i><span class="sb-lbl">Notifications</span><span class="sas-unread-badge" id="sas-notif-badge" style="display:none">0</span>';
    if(views&&views.parentNode) views.parentNode.insertBefore(div, views.nextSibling); else document.querySelector('.sidebar')?.appendChild(div);
  }
  function updateNotifBadge(){ const b=document.getElementById('sas-notif-badge'); if(!b)return; const c=unreadForUser().length; b.textContent=c; b.style.display=c?'':'none'; }

  window.renderNotifications=function(mc){
    const all=loadNotes().filter(n=>(n.mentions||[]).includes(currentUser.id)).sort((a,b)=>String(b.ts).localeCompare(String(a.ts)));
    mc.innerHTML=`<div class="topbar"><div class="tbtitle">Notifications</div><button class="btn btn-sm" onclick="sasMarkAllRead()"><i class="ti ti-checks"></i>Mark all read</button></div>
    <div class="content" style="padding-top:8px">${all.length?all.map(n=>{const unread=!(n.readBy||[]).includes(currentUser.id);const a=getMem(n.author);const c=mc2(a.palId);const entity=n.entityType==='task'?tasks.find(t=>String(t.id)===String(n.entityId)):todos.find(t=>String(t.id)===String(n.entityId));return `<div class="sas-notif-card ${unread?'unread':''}"><div class="av" style="width:30px;height:30px;background:${c.bg};color:${c.tc};font-size:10px">${a.initials}</div><div style="flex:1;min-width:0"><div style="font-weight:800;color:#0f172a">${esc2(a.name)} tagged you on ${n.entityType}: ${esc2(entity?entity.name:'Deleted item')}</div><div class="sas-note-meta">${fmtStamp(n.ts)}</div><div class="sas-note-body">${esc2(n.body)}</div></div><button class="btn btn-sm" onclick="sasMarkNoteRead('${n.id}');${entity?`open${n.entityType==='task'?'Task':'Todo'}(${n.entityId})`:''}">Open</button></div>`}).join(''):'<div style="text-align:center;padding:40px;color:var(--text3);font-size:14px">No notifications</div>'}</div>`;
  };

o-value">${t.project?esc2(proj.name):'—'}</div></div><div class="sas-info-card"><div class="sas-info-label">Status</div><div class="sas-info-value">${done?'Completed':'Open'}</div></div></div><div class="sas-notes-card"><div class="sas-info-label">Notes</div><div style="white-space:pre-wrap;color:var(--text2)">${esc2(t.notes||'—')}</div></div>${renderNotesPanel('task',id)}`:''}${tab==='subtasks'?`<div style="border:1px solid var(--border);border-radius:var(--radius);overflow:hidden">${(t.subtasks||[]).map(s=>{const sm=getMem(s.assignee);const smc=mc2(sm.palId);return `<div style="display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border)"><div class="chk ${s.done?'done':''}">${s.done?'<i class="ti ti-check"></i>':''}</div><div style="flex:1"><div style="font-weight:700;${s.done?'text-decoration:line-through;color:var(--text3)':''}">${esc2(s.name)}</div><div style="font-size:12px;color:var(--text3)">${fmtDate(s.due)}</div></div><div class="av" style="width:22px;height:22px;background:${smc.bg};color:${smc.tc};font-size:9px">${sm.initials}</div></div>`}).join('')||'<div style="padding:14px;color:var(--text3)">No subtasks</div>'}</div>`:''}${tab==='files'&&perm('view_files')?renderFilesSection('task-'+id,perm('upload_files')):''}</div><div class="mftr"><button class="btn btn-sm" onclick="closeModal()">Close</button>${perm('edit_task')?`<button class="btn btn-pri btn-sm" onclick="closeModal();openEditTask(${id})"><i class="ti ti-edit"></i>Edit</button>`:''}</div>`);
  };

  const prevOpenTodo=window.openTodo;
  window.openTodo=function(id){
    const td=todos.find(x=>x.id===id); if(!td) return prevOpenTodo&&prevOpenTodo(id);
    const cli=getCli(td.client); const m=getMem(td.assignee); const mcx=mc2(m.palId); const late=isLate(td.due,td.done); let tab=window._todoViewTab||'details';
    const periodLbl=(td.period&&td.recur&&typeof periodLabel==='function')?periodLabel(td.period,td.recur):'';

    showModal(`<div class="mhdr"><div style="min-width:0;flex:1"><div class="sas-detail-title">${esc2(td.name)}</div><div class="sas-detail-subtitle"><span class="tag" style="background:var(--bg2);color:var(--text2)">To-do</span>${td.recur?`<span class="tag" style="background:var(--bg2);color:var(--text2)"><i class="ti ti-refresh" style="font-size:10px"></i> ${td.recur}</span>`:''}${td.done?`<span class="tag" style="background:var(--success-bg);color:var(--success)">Completed</span>`:`<span class="tag" style="background:var(--info-bg);color:var(--info)">Open</span>`}</div></div><button class="btn btn-ghost btn-sm" onclick="closeModal()"><i class="ti ti-x"></i></button></div><div style="display:flex;gap:2px;border-bottom:1px solid var(--border);padding:0 20px"><div class="tab ${tab==='details'?'active':''}" onclick="window._todoViewTab='details';closeModal();openTodo(${id})">Details</div>${perm('view_files')?`<div class="tab ${tab==='files'?'active':''}" onclick="window._todoViewTab='files';closeModal();openTodo(${id})">Files (${getFiles('todo-'+id).length})</div>`:''}</div><div class="mbody">${tab==='details'?`
      <div class="sas-info-grid">
        <div class="sas-info-card"><div class="sas-info-label">Client</div><div class="sas-info-value">${cli?esc2(cli.name):'—'}</div></div>
        <div class="sas-info-card"><div class="sas-info-label">Assignee</div><div class="sas-info-value"><span class="av" style="width:24px;height:24px;background:${mcx.bg};color:${mcx.tc};font-size:9px">${m.initials}</span>${esc2(m.name)}</div></div>
        <div class="sas-info-card" style="grid-column:1/-1"><div style="display:flex;gap:24px;flex-wrap:wrap"><div><div class="sas-info-label">Due date</div><div class="sas-info-value" style="color:${late?'var(--danger)':'#111827'};white-space:normal">${fmtDate(td.due)||'—'} ${relDate(td.due)?`<span class="rel-date">${relDate(td.due)}</span>`:''}</div></div>${periodLbl?`<div><div class="sas-info-label">Period</div><div class="sas-info-value" style="white-space:normal"><span class="sas-period-badge"><i class="ti ti-calendar-week"></i>${esc2(periodLbl)}</span>${nextPeriodLbl?` <span style="font-size:11px;color:var(--text3);font-weight:400">→ next: ${esc2(nextPeriodLbl)}</span>`:''}</div></div>`:''}</div></div>
        <div class="sas-info-card" style="grid-column:1/-1"><div style="display:flex;gap:24px;flex-wrap:wrap"><div><div class="sas-info-label">Status</div><div class="sas-info-value">${td.done?'Completed':'Open'}</div></div><div><div class="sas-info-label">Priority</div><div class="sas-info-value">${td.priority||'normal'}</div></div></div></div>
      </div>

      ${renderNotesPanel('todo',id)}`:''}${tab==='files'&&perm('view_files')?renderFilesSection('todo-'+id,perm('upload_files')):''}</div><div class="mftr"><button class="btn btn-sm" onclick="closeModal()">Close</button><button class="btn btn-pri btn-sm" onclick="closeModal();openEditTodo(${id})"><i class="ti ti-edit"></i>Edit</button></div>`);
  };

  const prevRenderView=window.renderView;

    ensureNotificationsNav();

    const r=prevRenderView.apply(this,arguments); setTimeout(()=>{ensureNotificationsNav(); updateNotifBadge();},0); return r;

<script id="sas-v29-notifications-permissions-fix">
(function(){
  /* v29: shared tagged-notes notifications + separate client permissions */
  const NOTE_KEY='sasflow_mentions_notes_v1';
  let sasCloudNotesLoaded=false;
  let sasCloudNotesBusy=false;

  function safeParse(v,fallback){
    try{ return typeof v==='string'?JSON.parse(v):(v||fallback); }catch(e){ return fallback; }
  }
  function getLocalNotes(){ return safeParse(localStorage.getItem(NOTE_KEY)||'[]',[]); }
  function setLocalNotes(arr){ localStorage.setItem(NOTE_KEY, JSON.stringify(arr||[])); }
  function mergeNotes(a,b){
    const map={};
    [...(a||[]),...(b||[])].forEach(n=>{
      if(!n||!n.id)return;
      const existing=map[n.id]||{};
      map[n.id]={...existing,...n,readBy:[...new Set([...(existing.readBy||[]),...(n.readBy||[])])]};
    });
    return Object.values(map).sort((x,y)=>String(y.ts||'').localeCompare(String(x.ts||'')));
  }
  async function fetchCloudNotes(){
    const client=(typeof getSB==='function')?getSB():null;
    if(!client||!dbReady) return getLocalNotes();
    try{
      const {data,error}=await client.from('app_settings').select('value').eq('key',NOTE_KEY).maybeSingle();
      if(error) throw error;
      const remote=safeParse(data&&data.value?data.value:[],[]);
      const merged=mergeNotes(getLocalNotes(),remote);
      setLocalNotes(merged);
      sasCloudNotesLoaded=true;
      return merged;
    }catch(e){ console.warn('Could not load shared notifications',e); return getLocalNotes(); }
  }
  async function saveCloudNotes(arr){
    const client=(typeof getSB==='function')?getSB():null;
    setLocalNotes(arr||[]);
    if(!client||!dbReady) return;
    try{
      await client.from('app_settings').upsert({key:NOTE_KEY,value:arr||[],updated_at:new Date().toISOString()},{onConflict:'key'});
    }catch(e){ console.warn('Could not save shared notifications',e); }
  }
  async function syncNotesAndRefresh(){
    if(sasCloudNotesBusy) return;
    sasCloudNotesBusy=true;
    const before=localStorage.getItem(NOTE_KEY)||'';
    await fetchCloudNotes();
    const after=localStorage.getItem(NOTE_KEY)||'';
    sasCloudNotesBusy=false;
    if(before!==after){
      try{ if(typeof updateBadges==='function') updateBadges(); }catch(e){}
      try{ if(typeof renderView==='function' && (currentView==='dashboard'||currentView==='notifications')) renderView(); }catch(e){}
    }
  }
  function nowStamp(){ const d=new Date(); return d.toISOString(); }
  function fmtUserName(id){ try{return getMem(id).name||id;}catch(e){return id;} }
  function unreadCountForCurrentUser(){
    if(!currentUser) return 0;
    return getLocalNotes().filter(n=>(n.mentions||[]).includes(currentUser.id)&&!(n.readBy||[]).includes(currentUser.id)).length;
  }

  window.sasSyncNotesFromCloud=syncNotesAndRefresh;

  window.sasAddNote=async function(type,id){
    const bodyEl=document.getElementById('sas-note-body-'+type+'-'+id);
    const mentionEl=document.getElementById('sas-note-mention-'+type+'-'+id);
    const body=(bodyEl&&bodyEl.value||'').trim();
    const mention=mentionEl&&mentionEl.value||'';
    if(!body){toast('Please write a note or question');return;}
    const remote=await fetchCloudNotes();
    const note={id:'n'+Date.now(),entityType:type,entityId:String(id),author:currentUser.id,body,mentions:mention?[mention]:[],ts:nowStamp(),readBy:[currentUser.id]};
    const merged=mergeNotes(remote,[note]);
    await saveCloudNotes(merged);
    try{ addLog('Added note/question',`${type} ${id}${mention?' → @'+fmtUserName(mention):''}`,type,id); }catch(e){}
    toast(mention?'Note added and notification sent':'Note added');
    try{ closeModal(); type==='task'?openTask(+id):type==='project'?openProjDetail(id):openTodo(+id); }catch(e){ renderView(); }
  };

  window.sasMarkNoteRead=async function(id){
    const arr=mergeNotes(await fetchCloudNotes(),[]);
    arr.forEach(n=>{ if(n.id===id && currentUser){ n.readBy=[...new Set([...(n.readBy||[]),currentUser.id])]; }});
    await saveCloudNotes(arr);
    try{ renderView(); }catch(e){}
  };
  window.sasMarkAllRead=async function(){
    const arr=mergeNotes(await fetchCloudNotes(),[]);
    arr.forEach(n=>{ if(currentUser && (n.mentions||[]).includes(currentUser.id)){ n.readBy=[...new Set([...(n.readBy||[]),currentUser.id])]; }});
    await saveCloudNotes(arr);
    try{ renderView(); }catch(e){}
    toast('Notifications marked read');
  };

  // Make the notification badge reflect shared cloud notes even if another user tagged you from another browser.
  setTimeout(syncNotesAndRefresh,1500);
  setInterval(syncNotesAndRefresh,7000);

  // Separate client permissions. These DO NOT control whether a user can select a client on a task/to-do.
  try{
    ['admin','manager'].forEach(r=>{ if(ROLES[r]){ ROLES[r].perms.add_client=true; ROLES[r].perms.edit_client=true; ROLES[r].perms.delete_client=true; }});
    ['staff','viewer'].forEach(r=>{ if(ROLES[r]){ ROLES[r].perms.add_client=!!ROLES[r].perms.manage_clients; ROLES[r].perms.edit_client=!!ROLES[r].perms.manage_clients; ROLES[r].perms.delete_client=!!ROLES[r].perms.manage_clients; }});
    PERM_LABELS.add_client='Add clients';
    PERM_LABELS.edit_client='Edit clients';
    PERM_LABELS.delete_client='Delete clients';
  }catch(e){ console.warn('Could not add client permissions',e); }

  const oldCanManageClients=window.sasCanManageClients||function(){try{return perm('manage_clients');}catch(e){return false;}};
  window.sasCanAddClient=function(){return !!(perm('add_client')||perm('manage_clients'));};
  window.sasCanEditClient=function(){return !!(perm('edit_client')||perm('manage_clients'));};
  window.sasCanDeleteClient=function(){return !!(perm('delete_client')||perm('manage_clients'));};

  const prevRenderClients=window.renderClients;
  window.renderClients=function(mc){
    const canAdd=sasCanAddClient(), canEdit=sasCanEditClient(), canDelete=sasCanDeleteClient();
    mc.innerHTML=`<div class="topbar"><div class="tbtitle">Clients</div><div style="display:flex;gap:6px">
      ${canEdit?`<button class="btn btn-sm" onclick="openManageCT()"><i class="ti ti-tag"></i>Types</button>`:''}
      ${canAdd?`<button class="btn btn-pri btn-sm" onclick="openNewClient()"><i class="ti ti-plus"></i>Add client</button>`:''}
    </div></div>
    <div class="content" style="padding:14px 18px">
    ${visCli().map((c,ci)=>{
      const cProjs=projects.filter(p=>p.client===c.id);
      const cTasks=tasks.filter(t=>t.client===c.id||cProjs.some(p=>p.id===t.project));
      const open=cTasks.filter(t=>!isTaskDone(t)).length;
      const ini=c.name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
      const palIds=['blue','teal','amber','pink','purple'];
      const cp=getPal(palIds[ci%5]);
      const relClis=(c.relatedClients||[]).map(rid=>{const rc=getCli(rid);return rc?`<span class="tag" style="background:var(--bg2);color:var(--text2)">${rc.name}</span>`:''}).join(' ');
      return`<div class="card"><div class="card-hdr">
        <div class="av" style="width:36px;height:36px;background:${cp.bg};color:${cp.tc};font-size:13px;font-weight:700">${ini}</div>
        <div style="flex:1;cursor:pointer" onclick="openDetail('client','${c.id}');window._cliTab='overview'"><div style="font-size:14px;font-weight:700">${c.name}</div><div style="font-size:12px;color:var(--text2)">${c.type} · ${c.contact||''} · ${open} open tasks</div>${relClis?`<div style="margin-top:3px">${relClis}</div>`:''}</div>
        <div style="display:flex;gap:4px">
          ${canAdd?`<button class="btn btn-ghost btn-xs" onclick="cpyCli('${c.id}')" title="Copy client"><i class="ti ti-copy"></i></button>`:''}
          <button class="btn btn-ghost btn-xs" onclick="openDetail('client','${c.id}');window._cliTab='overview'" title="Open client"><i class="ti ti-arrow-right"></i></button>
          ${canEdit?`<button class="btn btn-ghost btn-xs" onclick="openEditClient('${c.id}')" title="Edit client"><i class="ti ti-edit"></i></button>`:''}
          ${canDelete&&c.id!=='c4'?`<button class="btn btn-ghost btn-xs btn-danger" onclick="rmCli('${c.id}')" title="Delete client"><i class="ti ti-trash"></i></button>`:''}
        </div>
      </div></div>`;
    }).join('')}
    </div>`;
  };

  const prevOpenNewClient=window.openNewClient;
  window.openNewClient=function(){ if(!sasCanAddClient()){toast('You do not have permission to add clients');return;} return prevOpenNewClient.apply(this,arguments); };
  const prevOpenEditClient=window.openEditClient;
  window.openEditClient=function(id){ if(!sasCanEditClient()){toast('You do not have permission to edit clients');return;} return prevOpenEditClient.apply(this,arguments); };
  const prevRmCli=window.rmCli;
  window.rmCli=function(id){ if(!sasCanDeleteClient()){toast('You do not have permission to delete clients');return;} return prevRmCli.apply(this,arguments); };
  const prevCpyCli=window.cpyCli;
  window.cpyCli=function(id){ if(!sasCanAddClient()){toast('You do not have permission to add clients');return;} return prevCpyCli.apply(this,arguments); };

  const prevQuick=window.openAddMenu;
  if(prevQuick){
    window.openAddMenu=function(){
      const canClient=sasCanAddClient();
      // Use the existing menu when possible, but hide Client card if user cannot add clients.
      const r=prevQuick.apply(this,arguments);
      setTimeout(()=>{ if(!canClient){ document.querySelectorAll('.sas-quick-card').forEach(btn=>{ if((btn.textContent||'').trim().startsWith('Client')) btn.style.display='none'; }); } },0);
      return r;
    };
  }

  const prevRenderView=window.renderView;
  window.renderView=function(){
    const r=prevRenderView.apply(this,arguments);
    setTimeout(()=>{
      // Visual fallback: notification badge count from current local shared notes.
      const b=document.getElementById('sas-notif-badge');
      if(b){ const c=unreadCountForCurrentUser(); b.textContent=c; b.style.display=c?'':'none'; }
    },0);
    return r;

})();

<script id="sas-v30-clear-notifications-script">
(function(){
  function escV30(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
  function fmtStampV30(ts){try{const d=new Date(ts);return d.toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});}catch(e){return ts||'';}}
  const NOTE_KEY='sasflow_mentions_notes_v1';
  function loadNotesV30(){try{return JSON.parse(localStorage.getItem(NOTE_KEY)||'[]');}catch(e){return[];}}
  function saveNotesV30(arr){localStorage.setItem(NOTE_KEY,JSON.stringify(arr));}
  function mentionedMe(n){return currentUser && (n.mentions||[]).includes(currentUser.id);}
  function isDismissed(n){return currentUser && (n.dismissedBy||[]).includes(currentUser.id);}
  function isRead(n){return currentUser && (n.readBy||[]).includes(currentUser.id);}
  function markReadOnly(noteId){
    const arr=loadNotesV30(); const n=arr.find(x=>String(x.id)===String(noteId));
    if(n&&currentUser){n.readBy=[...new Set([...(n.readBy||[]),currentUser.id])]; saveNotesV30(arr);}
  }
  function dismissNote(noteId){
    const arr=loadNotesV30(); const n=arr.find(x=>String(x.id)===String(noteId));
    if(n&&currentUser){
      n.readBy=[...new Set([...(n.readBy||[]),currentUser.id])];
      n.dismissedBy=[...new Set([...(n.dismissedBy||[]),currentUser.id])];
      saveNotesV30(arr);
    }
  }
  function refreshBadge(){
    const b=document.getElementById('sas-notif-badge');
    if(!b||!currentUser)return;
    const c=loadNotesV30().filter(n=>mentionedMe(n)&&!isRead(n)&&!isDismissed(n)).length;
    b.textContent=c; b.style.display=c?'':'none';
  }
  window.sasMarkNoteRead=function(noteId){ dismissNote(noteId); refreshBadge(); renderView(); };
  window.sasDismissNotification=function(noteId){ dismissNote(noteId); refreshBadge(); renderView(); toast('Notification cleared'); };
  window.sasClearReadNotifications=function(){
    const arr=loadNotesV30(); let count=0;
    arr.forEach(n=>{ if(mentionedMe(n)&&isRead(n)&&!isDismissed(n)){ n.dismissedBy=[...new Set([...(n.dismissedBy||[]),currentUser.id])]; count++; }});
    saveNotesV30(arr); refreshBadge(); renderView(); toast(count?('Cleared '+count+' read notification(s)'):'No read notifications to clear');
  };
  window.sasMarkAllRead=function(){
    const arr=loadNotesV30(); let count=0;
    arr.forEach(n=>{ if(mentionedMe(n)&&!isDismissed(n)){ n.readBy=[...new Set([...(n.readBy||[]),currentUser.id])]; n.dismissedBy=[...new Set([...(n.dismissedBy||[]),currentUser.id])]; count++; }});
    saveNotesV30(arr); refreshBadge(); renderView(); toast(count?'Notifications cleared':'No notifications to clear');
  };
  window.renderNotifications=function(mc){
    const all=loadNotesV30().filter(n=>mentionedMe(n)&&!isDismissed(n)).sort((a,b)=>String(b.ts).localeCompare(String(a.ts)));
    mc.innerHTML=`<div class="topbar"><div class="tbtitle">Notifications</div><button class="btn btn-sm" onclick="sasClearReadNotifications()"><i class="ti ti-eraser"></i>Clear read</button><button class="btn btn-sm" onclick="sasMarkAllRead()"><i class="ti ti-checks"></i>Clear all</button></div>
    <div class="content" style="padding-top:8px">${all.length?all.map(n=>{const unread=!isRead(n);const a=getMem(n.author);const c=mc2(a.palId);const entity=n.entityType==='task'?tasks.find(t=>String(t.id)===String(n.entityId)):n.entityType==='project'?projects.find(p=>String(p.id)===String(n.entityId)):todos.find(t=>String(t.id)===String(n.entityId));const openCall=entity?(n.entityType==='task'?`openTask(${n.entityId})`:n.entityType==='project'?`openProjDetail('${n.entityId}')`:`openTodo(${n.entityId})`):'';return `<div class="sas-notif-card ${unread?'unread':'read'}"><div class="av" style="width:30px;height:30px;background:${c.bg};color:${c.tc};font-size:10px">${a.initials}</div><div style="flex:1;min-width:0"><div style="font-weight:800;color:#0f172a">${escV30(a.name)} tagged you on ${n.entityType}: ${escV30(entity?entity.name:'Deleted item')}</div><div class="sas-note-meta">${fmtStampV30(n.ts)}${unread?' · Unread':' · Read'}</div><div class="sas-note-body">${escV30(n.body)}</div></div><div class="sas-notif-actions">${entity?`<button class="btn btn-sm" onclick="markReadOnly&&markReadOnly('${n.id}');${openCall}">Open</button>`:''}<button class="btn btn-sm" onclick="sasDismissNotification('${n.id}')">Clear</button></div></div>`}).join(''):'<div style="text-align:center;padding:40px;color:var(--text3);font-size:14px">No notifications</div>'}</div>`;
  };
  const oldRenderView=window.renderView;
  if(typeof oldRenderView==='function'){
    window.renderView=function(){const r=oldRenderView.apply(this,arguments);setTimeout(refreshBadge,0);return r;};
  }
  window.markReadOnly=markReadOnly;
  setTimeout(refreshBadge,200);
})();
</script>

<script id="sas-v31-notes-edit-delete-script">
(function(){
  const NOTE_KEY='sasflow_mentions_notes_v1';
  window._sasEditingNoteId = window._sasEditingNoteId || '';

  function esc31(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
  function fmt31(ts){try{const d=new Date(ts);return d.toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});}catch(e){return ts||'';}}
  function load31(){try{return JSON.parse(localStorage.getItem(NOTE_KEY)||'[]');}catch(e){return[];}}
  async function save31(arr){
    localStorage.setItem(NOTE_KEY,JSON.stringify(arr||[]));
    try{
      const client=(typeof getSB==='function')?getSB():null;
      if(client && typeof dbReady!=='undefined' && dbReady){
        await client.from('app_settings').upsert({key:NOTE_KEY,value:arr||[],updated_at:new Date().toISOString()},{onConflict:'key'});
      }
    }catch(e){console.warn('Could not save notes to cloud',e);}
  }
  function notesFor(type,id){return load31().filter(n=>n.entityType===type && String(n.entityId)===String(id)).sort((a,b)=>String(b.ts||'').localeCompare(String(a.ts||'')));}
  function canManageNote(n){return currentUser && (n.author===currentUser.id || currentUser.role==='admin');}
  function memberOptions(selected){
    return '<option value="">No mention</option>'+members.filter(m=>!currentUser || m.id!==currentUser.id).map(m=>`<option value="${m.id}"${(selected||[]).includes(m.id)?' selected':''}>@${esc31(m.name)}</option>`).join('');
  }
  function reopenEntity(type,id){
    if(type==='task') openTask(+id); else if(type==='project') openProjDetail(id); else openTodo(+id);
  }

  window.sasStartEditNote=function(noteId,type,id){
    window._sasEditingNoteId=String(noteId);
    reopenEntity(type,id);
  };
  window.sasCancelEditNote=function(type,id){
    window._sasEditingNoteId='';
    reopenEntity(type,id);
  };
  window.sasSaveEditedNote=async function(noteId,type,id){
    const bodyEl=document.getElementById('sas-edit-note-body-'+noteId);
    const mentionEl=document.getElementById('sas-edit-note-mention-'+noteId);
    const body=(bodyEl&&bodyEl.value||'').trim();
    const mention=mentionEl&&mentionEl.value||'';
    if(!body){toast('Note cannot be empty');return;}
    const arr=load31();
    const n=arr.find(x=>String(x.id)===String(noteId));
    if(!n){toast('Note not found');return;}
    if(!canManageNote(n)){toast('You can only edit your own note');return;}
    const oldMentions=n.mentions||[];
    n.body=body;
    n.mentions=mention?[mention]:[];
    n.editedAt=new Date().toISOString();
    n.readBy=[...new Set([...(n.readBy||[]), currentUser.id])];
    // If a new person is tagged after editing, make it unread for that person.
    (n.mentions||[]).forEach(mid=>{ if(!oldMentions.includes(mid)){ n.readBy=(n.readBy||[]).filter(x=>x!==mid); n.dismissedBy=(n.dismissedBy||[]).filter(x=>x!==mid); } });
    await save31(arr);
    window._sasEditingNoteId='';
    try{ addLog('Updated note/question',`${type} ${id}${mention?' → @'+getMem(mention).name:''}`,type,id); }catch(e){}
    toast('Note updated');
    reopenEntity(type,id);
  };
  window.sasDeleteNote=async function(noteId,type,id){
    const arr=load31();
    const n=arr.find(x=>String(x.id)===String(noteId));
    if(!n){toast('Note not found');return;}
    if(!canManageNote(n)){toast('You can only delete your own note');return;}
    if(!confirm('Delete this note/question?')) return;
    const next=arr.filter(x=>String(x.id)!==String(noteId));
    await save31(next);
    try{ addLog('Deleted note/question',`${type} ${id}`,type,id); }catch(e){}
    toast('Note deleted');
    reopenEntity(type,id);
  };

  window.renderNotesPanel=function(type,id){
    const notes=notesFor(type,id);
    const opts=memberOptions([]);
    const hiddenNotice=notes.length>4 ? `<div class="sas-note-count-note">Showing all ${notes.length} notes. Scroll inside this notes area to review older notes.</div>` : '';
    return `<div class="sas-note-panel">
      <div class="sas-note-head"><div><div class="sas-note-title">Questions / Team Notes</div>${hiddenNotice}</div><div style="font-size:12px;color:#94a3b8">Tag a user if you need an answer</div></div>
      <div class="gr2" style="grid-template-columns:1fr 180px;margin-bottom:8px"><textarea class="fi" id="sas-note-body-${type}-${id}" rows="2" placeholder="Write a question or note…"></textarea><select class="fi" id="sas-note-mention-${type}-${id}">${opts}</select></div>
      <button class="btn btn-sm btn-pri" onclick="sasAddNote('${type}','${id}')"><i class="ti ti-message-plus"></i>Add note / question</button>
      <div class="sas-note-list-wrap">
        ${notes.length?notes.map(n=>{
          const a=getMem(n.author); const c=mc2(a.palId); const mens=(n.mentions||[]).map(mid=>`<span class="sas-mention">@${esc31(getMem(mid).name)}</span>`).join(' ');
          const editing=String(window._sasEditingNoteId||'')===String(n.id);
          const actions=canManageNote(n)?`<div class="sas-note-actions"><button class="btn btn-ghost btn-xs" onclick="sasStartEditNote('${n.id}','${type}','${id}')" title="Edit note"><i class="ti ti-edit"></i></button><button class="btn btn-ghost btn-xs btn-danger" onclick="sasDeleteNote('${n.id}','${type}','${id}')" title="Delete note"><i class="ti ti-trash"></i></button></div>`:'';
          return `<div class="sas-note-row ${editing?'sas-note-highlight':''}"><div class="av" style="width:28px;height:28px;background:${c.bg};color:${c.tc};font-size:10px">${a.initials}</div><div style="flex:1;min-width:0"><div class="sas-note-meta"><strong>${esc31(a.name)}</strong> · ${fmt31(n.ts)}${n.editedAt?' · edited':''}</div>${editing?`<div class="sas-note-edit-box"><textarea class="fi" id="sas-edit-note-body-${n.id}" rows="3">${esc31(n.body||'')}</textarea><select class="fi" id="sas-edit-note-mention-${n.id}" style="margin-top:8px">${memberOptions(n.mentions||[])}</select><div class="sas-note-edit-actions"><button class="btn btn-sm" onclick="sasCancelEditNote('${type}','${id}')">Cancel</button><button class="btn btn-sm btn-pri" onclick="sasSaveEditedNote('${n.id}','${type}','${id}')">Save</button></div></div>`:`<div class="sas-note-body">${mens?mens+' ':''}${esc31(n.body||'')}</div>`}</div>${editing?'':actions}</div>`;
        }).join(''):'<div style="font-size:13px;color:#94a3b8;padding:12px 0">No questions or notes yet.</div>'}
      </div>
    </div>`;
  };
})();
</script>

<script id="sas-v32-access-script">
(function(){
  const ACCESS_KEY='sasflow_entity_access_v1';
  function esc32(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
  function loadAccess(){try{return JSON.parse(localStorage.getItem(ACCESS_KEY)||'{}')||{};}catch(e){return{};}}
  function saveAccess(a){localStorage.setItem(ACCESS_KEY,JSON.stringify(a||{}));try{if(typeof dbSaveSetting==='function'&&currentUser)dbSaveSetting(ACCESS_KEY,a||{});}catch(e){}}
  function key(type,id){return type+':'+id;}
  function directAllowed(type,id){const a=loadAccess();return a[key(type,id)]||[];}
  function hasDirect(type,id,mid){return directAllowed(type,id).includes(mid);}
  function setDirect(type,id,ids){const a=loadAccess();a[key(type,id)]=Array.from(new Set(ids||[])).filter(Boolean);saveAccess(a);}
  function admin(){return currentUser&&currentUser.role==='admin';}
  function grantClientToMember(mid,cid){const m=members.find(x=>x.id===mid);if(!m||m.role==='admin'||!cid)return;const a=normalizeAccess(m.access||defaultAccess(),m.role||'staff');if(a.clients!=='all'){if(!Array.isArray(a.clients))a.clients=[];if(!a.clients.includes(cid))a.clients.push(cid);}m.access=a;try{dbSaveMember(m);}catch(e){}}
  function revokeClientFromMember(mid,cid){const m=members.find(x=>x.id===mid);if(!m||m.role==='admin'||!cid)return;const a=normalizeAccess(m.access||defaultAccess(),m.role||'staff');if(Array.isArray(a.clients))a.clients=a.clients.filter(x=>x!==cid);m.access=a;try{dbSaveMember(m);}catch(e){}}
  function grantProjectToMember(mid,pid){const m=members.find(x=>x.id===mid);const p=projects.find(x=>x.id===pid);if(!m||m.role==='admin'||!pid)return;const a=normalizeAccess(m.access||defaultAccess(),m.role||'staff');if(a.projects!=='all'){if(!Array.isArray(a.projects))a.projects=[];if(!a.projects.includes(pid))a.projects.push(pid);}m.access=a;try{dbSaveMember(m);}catch(e){} if(p&&p.client)grantClientToMember(mid,p.client);}
  function revokeProjectFromMember(mid,pid){const m=members.find(x=>x.id===mid);if(!m||m.role==='admin'||!pid)return;const a=normalizeAccess(m.access||defaultAccess(),m.role||'staff');if(Array.isArray(a.projects))a.projects=a.projects.filter(x=>x!==pid);m.access=a;try{dbSaveMember(m);}catch(e){}}
  function userHasAccess(type,id,mid){
    if((members.find(m=>m.id===mid)||{}).role==='admin')return true;
    if(hasDirect(type,id,mid))return true;
    if(type==='client')return typeof memberCanAccessClient==='function' && memberCanAccessClient(mid,id);
    if(type==='project'){
      const saved=currentUser; currentUser=members.find(m=>m.id===mid)||saved; let ok=false; try{ok=typeof canSeeProj==='function'&&canSeeProj(id);}catch(e){} currentUser=saved; return ok;
    }
    if(type==='task'){
      const t=tasks.find(x=>String(x.id)===String(id)); if(!t)return false; const saved=currentUser; currentUser=members.find(m=>m.id===mid)||saved; let ok=false; try{ok=typeof canSeeTask==='function'&&canSeeTask(t);}catch(e){} currentUser=saved; return ok||hasDirect('task',id,mid);
    }
    if(type==='todo'){
      const td=todos.find(x=>String(x.id)===String(id)); if(!td)return false; const saved=currentUser; currentUser=members.find(m=>m.id===mid)||saved; let ok=false; try{ok=typeof canSeeTodo==='function'&&canSeeTodo(td);}catch(e){} currentUser=saved; return ok||hasDirect('todo',id,mid);
    }
    return false;
  }
  function labelFor(type){return {client:'Client page',project:'Project',task:'Task',todo:'To-do'}[type]||'Item';}
  function accessPanel(type,id){
    if(!admin())return '';
    const rows=members.map(m=>{const c=mc2(m.palId);const checked=userHasAccess(type,id,m.id);const locked=m.role==='admin';let why=locked?'Admin full access':(checked?'Has access':'No access');return `<label class="sas-access-user"><input type="checkbox" value="${m.id}" ${checked?'checked':''} ${locked?'disabled':''}><div class="av" style="width:26px;height:26px;background:${c.bg};color:${c.tc};font-size:10px">${esc32(m.initials)}</div><div style="min-width:0"><div class="sas-access-user-name">${esc32(m.name)}</div><div class="sas-access-user-note">${why}</div></div></label>`}).join('');
    return `<div class="sas-access-panel" data-access-type="${type}" data-access-id="${id}"><div class="sas-access-head"><div><div class="sas-access-title"><i class="ti ti-shield-lock"></i> Access to this ${labelFor(type)}</div><div class="sas-access-sub">Admin view: see who can access this item and add/remove access here.</div></div></div><div class="sas-access-grid">${rows}</div><div class="sas-access-readonly">Removing access here does not delete the item. For tasks and to-dos, direct access is separate from assignee/client access.</div><div class="sas-access-actions"><button class="btn btn-sm" onclick="renderView()">Cancel</button><button class="btn btn-sm btn-pri" onclick="sasSaveEntityAccess('${type}','${id}')"><i class="ti ti-device-floppy"></i>Save access</button></div></div>`;
  }
  window.sasSaveEntityAccess=function(type,id){
    if(!admin())return;
    const panel=document.querySelector(`.sas-access-panel[data-access-type="${type}"][data-access-id="${id}"]`); if(!panel)return;
    const selected=Array.from(panel.querySelectorAll('input[type=checkbox]:checked')).map(x=>x.value);
    const nonAdmins=members.filter(m=>m.role!=='admin').map(m=>m.id);
    if(type==='client'){
      nonAdmins.forEach(mid=> selected.includes(mid)?grantClientToMember(mid,id):revokeClientFromMember(mid,id));
      setDirect(type,id,selected.filter(mid=>(members.find(m=>m.id===mid)||{}).role!=='admin'));
    }else if(type==='project'){
      nonAdmins.forEach(mid=> selected.includes(mid)?grantProjectToMember(mid,id):revokeProjectFromMember(mid,id));
      setDirect(type,id,selected.filter(mid=>(members.find(m=>m.id===mid)||{}).role!=='admin'));
    }else{
      setDirect(type,id,selected.filter(mid=>(members.find(m=>m.id===mid)||{}).role!=='admin'));
    }
    try{addLog('Updated access',`${labelFor(type)} ${id}: ${selected.length} user(s)`,type,id);}catch(e){}
    toast('Access updated'); renderView();
  };
  function insertInModal(type,id){setTimeout(()=>{if(!admin())return;const body=document.querySelector('#modal-root .modal .mbody');if(body&&!body.querySelector('.sas-access-panel'))body.insertAdjacentHTML('beforeend',accessPanel(type,String(id)));},0);}
  const oldOpenTask=window.openTask; if(typeof oldOpenTask==='function') window.openTask=function(id){const r=oldOpenTask.apply(this,arguments);insertInModal('task',id);return r;};
  const oldOpenTodo=window.openTodo; if(typeof oldOpenTodo==='function') window.openTodo=function(id){const r=oldOpenTodo.apply(this,arguments);insertInModal('todo',id);return r;};
  const oldOpenProjDetail=window.openProjDetail; if(typeof oldOpenProjDetail==='function') window.openProjDetail=function(id){const r=oldOpenProjDetail.apply(this,arguments);insertInModal('project',id);return r;};
  const oldRenderClientDetail=window.renderClientDetail; if(typeof oldRenderClientDetail==='function') window.renderClientDetail=function(mc){const r=oldRenderClientDetail.apply(this,arguments);if(admin()&&window._cliTab==='access'){setTimeout(()=>{const content=mc&&mc.querySelector?mc.querySelector('.content'):document.querySelector('#main-content .content');if(content&&!content.querySelector('.sas-access-panel'))content.insertAdjacentHTML('afterbegin',accessPanel('client',detailId));},0);}return r;};
  // Make direct task/to-do overrides visible to assignees/users across filtering.
  const oldCanSeeTask=window.canSeeTask; if(typeof oldCanSeeTask==='function') window.canSeeTask=function(t){return oldCanSeeTask.apply(this,arguments)||!!(currentUser&&hasDirect('task',t.id,currentUser.id));};
  const oldCanSeeTodo=window.canSeeTodo; if(typeof oldCanSeeTodo==='function') window.canSeeTodo=function(td){return oldCanSeeTodo.apply(this,arguments)||!!(currentUser&&hasDirect('todo',td.id,currentUser.id));};
})();
</script>

<script id="sas-v33-access-sync-script">
(function(){
  const ACCESS_KEY='sasflow_entity_access_v1';
  function safeJSON(v,fb){try{return typeof v==='string'?JSON.parse(v):(v??fb);}catch(e){return fb;}}
  function accessObj(){return safeJSON(localStorage.getItem(ACCESS_KEY),{})||{};}
  function accessKey(type,id){return type+':'+String(id);}
  function accessHas(type,id,mid){const a=accessObj();const arr=a[accessKey(type,id)]||[];return !!(mid&&arr.includes(mid));}
  async function loadSharedAccess(){
    try{
      const client=(typeof getSB==='function')?getSB():null; if(!client)return;
      const {data}=await client.from('app_settings').select('value').eq('key',ACCESS_KEY).maybeSingle();
      if(data&&data.value){localStorage.setItem(ACCESS_KEY,JSON.stringify(data.value));}
    }catch(e){console.warn('Could not load shared entity access',e);}
  }
  const oldDbLoad=window.dbLoad;
  if(typeof oldDbLoad==='function'){
    window.dbLoad=async function(){const ok=await oldDbLoad.apply(this,arguments);await loadSharedAccess();return ok;};
  }
  window.sasReloadEntityAccess=loadSharedAccess;

  /* Make direct access work for every user after a normal Refresh/browser refresh. */
  const oldCanSeeTask=window.canSeeTask;
  if(typeof oldCanSeeTask==='function'){
    window.canSeeTask=function(t){
      if(currentUser&&accessHas('task',t&&t.id,currentUser.id))return true;
      return oldCanSeeTask.apply(this,arguments);
    };
  }
  const oldCanSeeTodo=window.canSeeTodo;
  if(typeof oldCanSeeTodo==='function'){
    window.canSeeTodo=function(td){
      if(currentUser&&accessHas('todo',td&&td.id,currentUser.id))return true;
      return oldCanSeeTodo.apply(this,arguments);
    };
  }
  const oldCanSeeProj=window.canSeeProj;
  if(typeof oldCanSeeProj==='function'){
    window.canSeeProj=function(id){
      if(currentUser&&accessHas('project',id,currentUser.id))return true;
      return oldCanSeeProj.apply(this,arguments);
    };
  }

  /* Also show the access panel in edit modals, not only view/detail modals. */
  function addPanel(type,id){
    setTimeout(()=>{
      if(!(currentUser&&currentUser.role==='admin'))return;
      const body=document.querySelector('#modal-root .modal .mbody');
      if(body && !body.querySelector('.sas-access-panel') && typeof document.querySelector('.sas-access-panel')==='object'){
        const tmp=document.createElement('div');

        const membersList=(window.members||members||[]);
        const a=accessObj(); const selected=a[accessKey(type,id)]||[];
        const rows=membersList.map(m=>{
          const checked=(m.role==='admin')||selected.includes(m.id)||((type==='task'&&String((tasks.find(t=>String(t.id)===String(id))||{}).assignee)===String(m.id)))||((type==='todo'&&String((todos.find(t=>String(t.id)===String(id))||{}).assignee)===String(m.id)))||((type==='project'&&String((projects.find(p=>String(p.id)===String(id))||{}).assignee)===String(m.id)));
          const c=(typeof mc2==='function'?mc2(m.palId):{bg:'#eef2ff',tc:'#1e3a8a'});
          return `<label class="sas-access-user"><input type="checkbox" value="${m.id}" ${checked?'checked':''} ${m.role==='admin'?'disabled':''}><div class="av" style="width:26px;height:26px;background:${c.bg};color:${c.tc};font-size:10px">${String(m.initials||'').replace(/[&<>"]/g,'')}</div><div><div class="sas-access-user-name">${String(m.name||'').replace(/[&<>"]/g,'')}</div><div class="sas-access-user-note">${m.role==='admin'?'Admin full access':checked?'Has access':'No access'}</div></div></label>`;
        }).join('');
        body.insertAdjacentHTML('beforeend',`<div class="sas-access-panel" data-access-type="${type}" data-access-id="${id}"><div class="sas-access-head"><div><div class="sas-access-title"><i class="ti ti-shield-lock"></i> Access</div><div class="sas-access-sub">Admin can add/remove who can see this item.</div></div></div><div class="sas-access-grid">${rows}</div><div class="sas-access-actions"><button class="btn btn-sm btn-pri" onclick="sasSaveEntityAccess('${type}','${id}')"><i class="ti ti-device-floppy"></i>Save access</button></div></div>`);
      }
    },0);
  }
  const oldOpenEditTask=window.openEditTask; if(typeof oldOpenEditTask==='function')window.openEditTask=function(id){const r=oldOpenEditTask.apply(this,arguments);addPanel('task',id);return r;};
  const oldOpenEditTodo=window.openEditTodo; if(typeof oldOpenEditTodo==='function')window.openEditTodo=function(id){const r=oldOpenEditTodo.apply(this,arguments);addPanel('todo',id);return r;};
  const oldOpenEditProject=window.openEditProject; if(typeof oldOpenEditProject==='function')window.openEditProject=function(id){const r=oldOpenEditProject.apply(this,arguments);addPanel('project',id);return r;};
})();

<script id="sas-v34-direct-access-fix">
(function(){
  const ACCESS_KEY = 'sasflow_entity_access_v1';
  const g = window;
  function safeParse(v, fb){ try { return typeof v === 'string' ? JSON.parse(v) : (v ?? fb); } catch(e){ return fb; } }
  function getCache(){ return safeParse(localStorage.getItem(ACCESS_KEY), {}) || {}; }
  function setCache(obj){
    const val = obj || {};
    g._sasEntityAccessCache = val;
    localStorage.setItem(ACCESS_KEY, JSON.stringify(val));
  }
  function akey(type,id){ return String(type) + ':' + String(id); }
  function idsFor(type,id){
    const a = g._sasEntityAccessCache || getCache();
    const arr = a[akey(type,id)] || [];
    return Array.isArray(arr) ? arr.map(String) : [];
  }
  function hasDirectAccess(type,id,memberId){
    if(!memberId || id===undefined || id===null) return false;
    return idsFor(type,id).includes(String(memberId));
  }
  async function loadSharedAccess(){
    try{
      const client = (typeof getSB === 'function') ? getSB() : null;
      if(!client) return getCache();
      const {data,error} = await client.from('app_settings').select('value').eq('key', ACCESS_KEY).maybeSingle();
      if(error) throw error;
      if(data && data.value){ setCache(data.value); return data.value; }
    }catch(e){ console.warn('Access load failed:', e); }
    const cached = getCache();
    g._sasEntityAccessCache = cached;
    return cached;
  }

    };

  }

      console.error('Access save failed:', e);
      if(typeof toast === 'function') toast('Access did not save. Check Supabase app_settings permissions.');
    }
  };

<script id="sas-v35-client-only-access-and-backups">
(function(){
  const BACKUP_KEY='sasflow_excel_backup_last_v1';
  const AUTO_KEY='sasflow_excel_backup_auto_v1';
  const ACCESS_KEY='sasflow_entity_access_v1';
  function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
  function cleanName(n){return String(n||'Sheet').replace(/[\\/?*\[\]:]/g,' ').slice(0,31)||'Sheet';}
  function removeNonClientAccessPanels(){
    document.querySelectorAll('.sas-access-panel').forEach(p=>{
      const t=p.getAttribute('data-access-type');

    });
  }
  window.sasRemoveNonClientAccessPanels=removeNonClientAccessPanels;

  /* Only keep the admin client access panel. Hide/remove task, to-do, and project access controls. */
  ['openTask','openTodo','openEditTask','openEditTodo','openEditProject','openProjDetail','renderView'].forEach(fn=>{
    if(typeof window[fn]==='function' && !window[fn]._sasV35NoAccess){
      const old=window[fn];
      window[fn]=function(){ const r=old.apply(this,arguments); setTimeout(removeNonClientAccessPanels,0); setTimeout(removeNonClientAccessPanels,80); return r; };
      window[fn]._sasV35NoAccess=true;
    }
  });
  const oldSaveAccess=window.sasSaveEntityAccess;
  window.sasSaveEntityAccess=function(type,id){
    if(type!=='client'){ removeNonClientAccessPanels(); if(typeof toast==='function')toast('Direct access is managed only from the Client page.'); return; }
    return oldSaveAccess ? oldSaveAccess.apply(this,arguments) : undefined;
  };

  function val(v){
    if(Array.isArray(v)) return v.map(x=>typeof x==='object'?JSON.stringify(x):x).join('; ');
    if(v && typeof v==='object') return JSON.stringify(v);
    return v ?? '';
  }
  function rowsToSheet(name, rows){
    rows=rows||[];
    const keys=Array.from(new Set(rows.flatMap(r=>Object.keys(r||{}))));
    if(!keys.length) keys.push('No data');
    let xml=`<Worksheet ss:Name="${esc(cleanName(name))}"><Table>`;
    xml += '<Row>'+keys.map(k=>`<Cell><Data ss:Type="String">${esc(k)}</Data></Cell>`).join('')+'</Row>';
    rows.forEach(r=>{xml += '<Row>'+keys.map(k=>`<Cell><Data ss:Type="String">${esc(val((r||{})[k]))}</Data></Cell>`).join('')+'</Row>';});
    xml += '</Table></Worksheet>';
    return xml;
  }
  function getNotes(){try{return JSON.parse(localStorage.getItem('sasflow_mentions_notes_v1')||'[]')||[];}catch(e){return []}}
  function getFilesMap(){try{return (typeof entityFiles!=='undefined'?entityFiles:JSON.parse(localStorage.getItem('entity_files')||'{}'))||{};}catch(e){return {}}}
  function buildBackupData(){
    const allTasks=(typeof tasks!=='undefined'?tasks:[])||[];
    const taskRows=allTasks.map(t=>({...t,subtasks:undefined,subtask_count:(t.subtasks||[]).length,client_name:(typeof getCli==='function'&&getCli(t.client||((typeof getProj==='function'&&getProj(t.project).client)||''))||{}).name||'',project_name:(typeof getProj==='function'&&getProj(t.project)||{}).name||'',assignee_name:(typeof getMem==='function'&&getMem(t.assignee)||{}).name||''}));
    const subRows=allTasks.flatMap(t=>(t.subtasks||[]).map(s=>({parent_task_id:t.id,parent_task_name:t.name,...s,assignee_name:(typeof getMem==='function'&&getMem(s.assignee)||{}).name||''})));
    const todoRows=((typeof todos!=='undefined'?todos:[])||[]).map(td=>({...td,client_name:(typeof getCli==='function'&&getCli(td.client)||{}).name||'',assignee_name:(typeof getMem==='function'&&getMem(td.assignee)||{}).name||''}));
    const projectRows=((typeof projects!=='undefined'?projects:[])||[]).map(p=>({...p,client_name:(typeof getCli==='function'&&getCli(p.client)||{}).name||'',assignee_name:(typeof getMem==='function'&&getMem(p.assignee)||{}).name||''}));
    const clientRows=((typeof clients!=='undefined'?clients:[])||[]).map(c=>({...c,contacts:undefined,relatedClients:undefined,contact_count:(c.contacts||[]).length,related_client_ids:(c.relatedClients||[]).join(', ')}));
    const contactRows=((typeof clients!=='undefined'?clients:[])||[]).flatMap(c=>(c.contacts||[]).map(ct=>({client_id:c.id,client_name:c.name,...ct})));
    const accessObj=(()=>{try{return JSON.parse(localStorage.getItem(ACCESS_KEY)||'{}')||{};}catch(e){return {};}})();
    const accessRows=Object.entries(accessObj).map(([entity_key,user_ids])=>({entity_key,user_ids:(user_ids||[]).join(', '),user_names:(user_ids||[]).map(id=>(typeof getMem==='function'&&getMem(id)||{}).name||id).join(', ')}));
    const fileRows=Object.entries(getFilesMap()).flatMap(([entity_key,files])=>(files||[]).map(f=>({entity_key,...f,data:f.data?'[embedded base64/file data omitted from Excel list]':''})));
    return {
      Summary:[{backup_created_at:new Date().toISOString(),created_by:(typeof currentUser!=='undefined'&&currentUser?currentUser.name:''),members:((typeof members!=='undefined'?members:[])||[]).length,clients:clientRows.length,contacts:contactRows.length,projects:projectRows.length,tasks:taskRows.length,subtasks:subRows.length,todos:todoRows.length,tax_jobs:((typeof taxJobs!=='undefined'?taxJobs:[])||[]).length,notes:getNotes().length,files:fileRows.length}],
      Members:((typeof members!=='undefined'?members:[])||[]),
      Clients:clientRows,
      Contacts:contactRows,
      Projects:projectRows,
      Tasks:taskRows,
      Subtasks:subRows,
      Todos:todoRows,
      Tax_Jobs:((typeof taxJobs!=='undefined'?taxJobs:[])||[]),
      Team_Notes:getNotes(),
      Files:fileRows,
      Access:accessRows,
      Audit_Log:((typeof auditLog!=='undefined'?auditLog:[])||[])
    };
  }
  function buildWorkbook(){
    const data=buildBackupData();
    return `<?xml version="1.0"?><?mso-application progid="Excel.Sheet"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet" xmlns:html="http://www.w3.org/TR/REC-html40">${Object.entries(data).map(([n,r])=>rowsToSheet(n,r)).join('')}</Workbook>`;
  }
  function backupFilename(){return 'signature_as_backup_'+new Date().toISOString().slice(0,19).replace(/[-:T]/g,'')+'.xls';}
  window.sasCreateExcelBackup=function(download=true){

    try{localStorage.setItem(BACKUP_KEY,JSON.stringify(record));}catch(e){console.warn('Could not store local backup copy',e);}

      const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=record.filename; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);

  };

  };
  function autoEnabled(){return localStorage.getItem(AUTO_KEY)==='true';}
  function setAuto(v){localStorage.setItem(AUTO_KEY,v?'true':'false');}
  window.sasOpenBackupModal=function(){
    const r=JSON.parse(localStorage.getItem(BACKUP_KEY)||'null');
    const checked=autoEnabled()?'checked':'';
    showModal(`<div class="mhdr"><h2>Excel backups</h2><button class="btn btn-ghost btn-sm" onclick="closeModal()"><i class="ti ti-x"></i></button></div><div class="mbody"><div class="sas-backup-card"><div style="font-weight:800;margin-bottom:4px">Manual backup</div><div class="sas-backup-muted">Creates one Excel workbook with separate sheets for members, clients, contacts, projects, tasks, subtasks, to-dos, tax jobs, team notes, files list, access, and audit log.</div><button class="btn btn-pri btn-sm" style="margin-top:10px" onclick="sasCreateExcelBackup(true)"><i class="ti ti-file-spreadsheet"></i>Create Excel backup</button></div><div class="sas-backup-card"><div style="font-weight:800;margin-bottom:4px">Automatic local backup</div><label style="display:flex;align-items:center;gap:8px;margin:8px 0"><input type="checkbox" ${checked} onchange="localStorage.setItem('${AUTO_KEY}',this.checked?'true':'false'); toast(this.checked?'Automatic local backup on':'Automatic local backup off')"> Create/refresh a local backup once per day when the app is open</label><div class="sas-backup-muted">Because browsers block automatic downloads, this stores the latest backup inside this browser. Use “Download latest backup” to save the file.</div><button class="btn btn-sm" style="margin-top:10px" onclick="sasDownloadLastBackup()"><i class="ti ti-download"></i>Download latest backup</button><div class="sas-backup-muted" style="margin-top:8px">Latest: ${r&&r.created_at?esc(r.created_at):'No backup yet'}</div></div></div><div class="mftr"><button class="btn btn-sm" onclick="closeModal()">Close</button></div>`);
  };
  function maybeAutoBackup(){
    if(!autoEnabled())return;
    const r=(()=>{try{return JSON.parse(localStorage.getItem(BACKUP_KEY)||'null');}catch(e){return null;}})();
    const last=r&&r.created_at?new Date(r.created_at).getTime():0;
    if(!last || Date.now()-last>24*60*60*1000){ try{ window.sasCreateExcelBackup(false); }catch(e){console.warn('Auto backup failed',e);} }
  }
  function addBackupButton(){
    const tb=document.querySelector('.topbar'); if(!tb || tb.querySelector('.sas-backup-btn'))return;
    if(!(typeof currentUser!=='undefined'&&currentUser&&currentUser.role==='admin'))return;
    const b=document.createElement('button'); b.className='btn btn-sm sas-backup-btn'; b.innerHTML='<i class="ti ti-file-spreadsheet"></i> Backup'; b.onclick=window.sasOpenBackupModal; tb.appendChild(b);
  }

    window.renderView._sasV35Backup=true;

})();
</script>

  function projectIsVisibleInAllTasks(p){

    if(fQ){

  function visibleProjectTasks(pid){
    let arr=tasks.filter(t=>t.project===pid && (isAdmin()||canSeeTask(t)));
    if(currentView==='today') arr=arr.filter(t=>t.due===TODAY||(t.subtasks&&t.subtasks.some(s=>s.due===TODAY)));
