    if(fCli) arr=arr.filter(t=>t.client===fCli||(getProj(t.project).client===fCli));
    if(fQ){const q=String(fQ).toLowerCase();arr=arr.filter(t=>(t.name||'').toLowerCase().includes(q)||(t.subtasks&&t.subtasks.some(s=>(s.name||'').toLowerCase().includes(q))));}
    if(fStat==='open') arr=arr.filter(t=>!isTaskDone(t));

    if(sortC==='task') arr.sort((a,b)=>sortD*a.name.localeCompare(b.name));
    else if(sortC==='due') arr.sort((a,b)=>sortD*((a.due||'9999')>(b.due||'9999')?1:-1));

  function projectRowHTML(p){

    const pt=tasks.filter(t=>t.project===p.id && (isAdmin()||canSeeTask(t)));
    const openCnt=pt.filter(t=>!isTaskDone(t)).length; const done=projDone(p.id); const late=isLate(p.due,done);

    return `<div class="trow gcols sas-project-row ${done?'dim':''}" onclick="openProjDetail('${safeEsc(p.id)}')">

      <div class="racts" onclick="event.stopPropagation()"><label class="sas-select-action" title="Select project for bulk actions"><input type="checkbox" class="selbox" ${isSelected('project',p.id)?'checked':''} onclick="toggleJobSel(event,'project','${safeEsc(p.id)}')">Select</label><button class="btn btn-ghost btn-xs" onclick="openProjDetail('${safeEsc(p.id)}')" title="Open project"><i class="ti ti-history"></i></button>${perm('create_project')?`<button class="btn btn-ghost btn-xs" onclick="openEditProject('${safeEsc(p.id)}')" title="Edit project"><i class="ti ti-edit"></i></button><button class="btn btn-ghost btn-xs btn-danger" onclick="delProj('${safeEsc(p.id)}')" title="Delete project"><i class="ti ti-trash"></i></button>`:''}</div>
    </div>`;
  }
  function renderGroupedAllTasks(mc){
    const titles={tasks:'All tasks',today:'Due today',recurring:'Recurring'};
    const memOptsHTML=memOpts(fMem);
    const projOptsHTML='<option value="__todo"'+(fProj==='__todo'?' selected':'')+'>To-dos</option>'+projOpts(fProj);
    const cliOptsHTML=clientOpts(fCli,'All clients').replace('<option value="">All clients</option>','');
    let projectList=visProj().filter(projectIsVisibleInAllTasks);
    if(sortC==='project') projectList.sort((a,b)=>sortD*a.name.localeCompare(b.name));
    else if(sortC==='due') projectList.sort((a,b)=>sortD*((a.due||'9999')>(b.due||'9999')?1:-1));
    else projectList.sort((a,b)=>a.name.localeCompare(b.name));

    let standalone=tasks.filter(t=>!t.project && (isAdmin()||canSeeTask(t)));

    if(fProj) standalone=[];
    if(fQ){const q=String(fQ).toLowerCase();standalone=standalone.filter(t=>(t.name||'').toLowerCase().includes(q)||(t.subtasks&&t.subtasks.some(s=>(s.name||'').toLowerCase().includes(q))));}

    function sortItems(arr){
      if(sortC==='task') arr.sort((a,b)=>sortD*a.name.localeCompare(b.name));
      else if(sortC==='due') arr.sort((a,b)=>sortD*((a.due||'9999')>(b.due||'9999')?1:-1));

<script id="sas-v44-project-recurring-delete-fixes">
(function(){
  function escV44(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
  const RECUR_OPTIONS=[['','One-time'],['daily','Daily'],['weekly','Weekly'],['biweekly','Biweekly'],['semimonthly','Semimonthly'],['monthly','Monthly'],['quarterly','Quarterly'],['annual','Annual']];
  const RECUR_LABEL={daily:'Daily',weekly:'Weekly',biweekly:'Biweekly',semimonthly:'Semimonthly',monthly:'Monthly',quarterly:'Qtrly',annual:'Annual',yearly:'Annual'};
  function iso(d){return d && !Number.isNaN(+d) ? d.toISOString().slice(0,10) : '';}
  function nextDueV44(d,recur){
    if(!d||!recur) return '';
    const due=new Date(d+'T12:00:00'); if(Number.isNaN(+due)) return '';
    const next=new Date(due); const r=String(recur).toLowerCase();
    if(r==='daily') next.setDate(next.getDate()+1);
    else if(r==='weekly') next.setDate(next.getDate()+7);
    else if(r==='biweekly') next.setDate(next.getDate()+14);
    else if(r==='semimonthly') next.setDate(next.getDate()+15);
    else if(r==='monthly') next.setMonth(next.getMonth()+1);
    else if(r==='quarterly') next.setMonth(next.getMonth()+3);
    else if(r==='annual'||r==='yearly') next.setFullYear(next.getFullYear()+1);
    else return '';
    return iso(next);
  }
  function maxTaskDueForProject(pid){
    const dues=(tasks||[]).filter(t=>t.project===pid&&t.due).map(t=>t.due).sort();
    return dues.length?dues[dues.length-1]:'';
  }
  function syncRecurringProjectDueDates(){

    .sas-v44-completed-toggle{width:calc(100% - 36px);margin:10px 18px 6px;border:0;background:#f8fafc;border-radius:10px;padding:10px 13px;font-size:13px;font-weight:800;color:#334155;display:flex;align-items:center;gap:8px;cursor:pointer;text-align:left;}

    const tab=window._projDTab||'tasks'; const open=pt.filter(t=>!isTaskDone(t)); const done=pt.filter(t=>isTaskDone(t));

      <div style="display:flex;gap:5px"><button class="btn btn-ghost btn-sm" onclick="closeModal();openEditProject('${escV44(proj.id)}')"><i class="ti ti-edit"></i></button><button class="btn btn-ghost btn-sm" onclick="closeModal()"><i class="ti ti-x"></i></button></div>
    </div>
    <div style="display:flex;gap:2px;border-bottom:1px solid var(--border);padding:0 20px">
      <div class="tab ${tab==='tasks'?'active':''}" onclick="window._projDTab='tasks';closeModal();openProjDetail('${escV44(pid)}')">Tasks (${pt.length})</div>
      ${isAdmin()?`<div class="tab ${tab==='history'?'active':''}" onclick="window._projDTab='history';closeModal();openProjDetail('${escV44(pid)}')">History (${logs.length})</div>`:''}
      <div class="tab ${tab==='files'?'active':''}" onclick="window._projDTab='files';closeModal();openProjDetail('${escV44(pid)}')">Files (${getFiles('proj-'+pid).length})</div>
    </div>
    <div class="mbody">
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
        <span class="tag" style="background:${pcol.bg};color:${pcol.tc}">${escV44(proj.name)}</span>
        ${proj.recur?`<span class="tag" style="background:var(--info-bg);color:var(--info)"><i class="ti ti-refresh" style="font-size:10px"></i> ${RECUR_LABEL[proj.recur]||escV44(proj.recur)}</span>`:''}
        ${allDone?'<span class="tag" style="background:var(--success-bg);color:var(--success)">Complete</span>':''}

      ${isAdmin()&&tab==='history'?renderHistoryList(logs):''}

    </div>`);
    const modal=document.querySelector('#modal-root .modal'); if(modal) modal.classList.add('sas-project-modal');
  };

  function addRecurringButtons(){
    ['nt-recur','et-recur','ntd-recur','etd-recur','np-recur','ep-recur'].forEach(id=>{
      const input=document.getElementById(id); if(!input) return;
      if(input.tagName==='SELECT'){
        const current=input.value;
        ['biweekly','semimonthly'].forEach(v=>{ if(!input.querySelector(`option[value="${v}"]`)){ const o=document.createElement('option'); o.value=v; o.textContent=RECUR_LABEL[v]; input.appendChild(o); }});
        input.value=current;
        return;

      const holder=input.previousElementSibling; if(!holder || holder.dataset.v44Recurring==='1') return;
      holder.dataset.v44Recurring='1';
      holder.innerHTML=RECUR_OPTIONS.map(([v,l])=>`<button class="ro ${input.value===v || (!input.value&&!v)?'on':''}" onclick="selRo(this,'${id}','${v}')">${l}</button>`).join('');
    });
  }
  const oldShowModal=window.showModal;
  if(typeof oldShowModal==='function') window.showModal=function(html){ const r=oldShowModal.apply(this,arguments); setTimeout(addRecurringButtons,0); return r; };
  ['openNewTask','openEditTask','openNewTodo','openEditTodo','openNewProject','openEditProject'].forEach(fn=>{
    const old=window[fn]; if(typeof old==='function') window[fn]=function(){ const r=old.apply(this,arguments); setTimeout(addRecurringButtons,0); return r; };
  });

  function createNextTaskV44(t){
    if(!t||!t.recur||t._v44NextCreated) return false;
    const nd=nextDueV44(t.due||TODAY,t.recur); if(!nd) return false;
    const nt={...t,id:++nid,due:nd,done:false,_nextCreated:false,_v44NextCreated:false,
      subtasks:(t.subtasks||[]).map(s=>({...s,id:++nid,done:false,due:nextDueV44(s.due||t.due||TODAY,t.recur)||nd}))};
    t._v44NextCreated=true;
    tasks.unshift(nt);
    try{dbSaveTask(t);dbSaveTask(nt);dbSaveNid();addLog('Created recurring task',nt.name+' → '+fmtDate(nt.due),'task',nt.id);}catch(e){}
    return true;
  }
  function createNextTodoV44(td){
    if(!td||!td.recur||td._v44NextCreated) return false;
    const nd=nextDueV44(td.due||TODAY,td.recur); if(!nd) return false;
    const nt={...td,id:++nid,due:nd,done:false,_nextCreated:false,_v44NextCreated:false};
    td._v44NextCreated=true;
    todos.unshift(nt);
    try{dbSaveTodo(td);dbSaveTodo(nt);dbSaveNid();addLog('Created recurring to-do',nt.name+' → '+fmtDate(nt.due),'todo',nt.id);}catch(e){}
    return true;
  }
  const oldTglDone=window.tglDone;
  window.tglDone=function(e,id){
    const t=(tasks||[]).find(x=>x.id===id); const was=t?isTaskDone(t):false;
    const r=oldTglDone?oldTglDone.apply(this,arguments):undefined;
    if(t && !was && isTaskDone(t) && t.recur){ if(createNextTaskV44(t)){renderView();updateBadges();toast('Completed. Next recurring task created.');} }
    return r;
  };
  const oldTglTodoDone=window.tglTodoDone;
  window.tglTodoDone=function(e,id){
    const td=(todos||[]).find(x=>x.id===id); const was=td?td.done:false;
    const r=oldTglTodoDone?oldTglTodoDone.apply(this,arguments):undefined;
    if(td && !was && td.done && td.recur){ if(createNextTodoV44(td)){renderView();updateBadges();toast('Completed. Next recurring to-do created.');} }
    return r;
  };
  const oldSpawn=window.spawnRecurring;
  window.spawnRecurring=function(){
    if(oldSpawn) oldSpawn.apply(this,arguments);
    (tasks||[]).slice().forEach(t=>{ if(t.recur && isTaskDone(t)) createNextTaskV44(t); });
    (todos||[]).slice().forEach(td=>{ if(td.recur && td.done) createNextTodoV44(td); });
    (projects||[]).slice().forEach(p=>{
      if(!p.recur||!p.due) return;
      const nd=nextDueV44(p.due,p.recur); if(!nd) return;
      if(nd<=TODAY && !projects.some(x=>x.name===p.name&&x.due===nd)){
        const newId='p'+Date.now()+Math.floor(Math.random()*1000);
        projects.push({...p,id:newId,due:nd});
        try{dbSaveProject(projects[projects.length-1]);addLog('Auto-generated project',p.name+' ('+p.recur+')','project',newId);}catch(e){}
      }
    });
    syncRecurringProjectDueDates();
  };

  function injectProjectDeleteButtons(){
    if(currentView!=='projects' && currentView!=='tasks' && currentView!=='today' && currentView!=='recurring') return;
    document.querySelectorAll('button[onclick^="openEditProject("]').forEach(btn=>{
      const m=(btn.getAttribute('onclick')||'').match(/openEditProject\(['"]([^'"]+)['"]\)/); if(!m) return;
      const pid=m[1]; const parent=btn.parentElement; if(!parent || parent.querySelector(`[data-v44-del-project="${CSS.escape(pid)}"]`)) return;
      const b=document.createElement('button');
      b.className='btn btn-ghost btn-xs btn-danger'; b.setAttribute('data-v44-del-project',pid); b.title='Delete project';
      b.innerHTML='<i class="ti ti-trash"></i>'; b.onclick=function(ev){ev.stopPropagation(); delProj(pid);};
      parent.appendChild(b);
    });
  }
  const oldRenderView=window.renderView;
  if(typeof oldRenderView==='function') window.renderView=function(){ syncRecurringProjectDueDates(); const r=oldRenderView.apply(this,arguments); setTimeout(()=>{addRecurringButtons();injectProjectDeleteButtons();},0); return r; };
  setTimeout(()=>{syncRecurringProjectDueDates();addRecurringButtons();injectProjectDeleteButtons();},200);
})();
</script>


<!-- ══════════════════════════════════════════
     v45 recurring task/subtask fix: one next copy only
══════════════════════════════════════════ -->
<script id="sas-v45-recurring-task-subtask-fix">
(function(){
  function todayV45(){return (typeof TODAY!=='undefined'&&TODAY)?TODAY:new Date().toISOString().slice(0,10);}
  function dateObjV45(d){const x=new Date((d||todayV45())+'T12:00:00');return Number.isNaN(+x)?new Date(todayV45()+'T12:00:00'):x;}
  function isoV45(d){return d.toISOString().slice(0,10);}
  function nextDueV45(d,recur){
    if(!recur) return '';
    const x=dateObjV45(d); const r=String(recur).toLowerCase();
    if(r==='daily') x.setDate(x.getDate()+1);
    else if(r==='weekly') x.setDate(x.getDate()+7);
    else if(r==='biweekly') x.setDate(x.getDate()+14);
    else if(r==='semimonthly') x.setDate(x.getDate()+15);
    else if(r==='monthly') x.setMonth(x.getMonth()+1);
    else if(r==='quarterly') x.setMonth(x.getMonth()+3);
    else if(r==='annual'||r==='yearly') x.setFullYear(x.getFullYear()+1);
    else return '';
    return isoV45(x);
  }
  function shiftSubDueV45(subDue,oldTaskDue,newTaskDue,recur){
    if(!subDue) return newTaskDue;
    const shifted=nextDueV45(subDue,recur);
    return shifted||newTaskDue;
  }
  function taskSigV45(t,due){
    return [t.name||'',t.project||'',t.client||'',t.assignee||'',due||t.due||'',t.recur||''].join('||');
  }
  function sameSubShapeV45(a,b){
    const as=(a.subtasks||[]), bs=(b.subtasks||[]);
    if(as.length!==bs.length) return false;
    for(let i=0;i<as.length;i++){
      if((as[i].name||'')!==(bs[i].name||'')) return false;
    }
    return true;
  }
  function nextTaskAlreadyExistsV45(source,nextDue){
    const sig=taskSigV45(source,nextDue);
    return (tasks||[]).some(x=>x!==source && taskSigV45(x,x.due)===sig && sameSubShapeV45(source,x));
  }
  function markRecurringCreatedV45(t,nextDue){
    t._nextCreated=true;
    t._v44NextCreated=true;
    t._v45NextCreated=true;
    t._v45NextDue=nextDue||'';
  }
  window.sasCreateNextTaskV45=function(t,reason){
    if(!t||!t.recur||!isTaskDone(t)) return false;
    const nd=nextDueV45(t.due||todayV45(),t.recur); if(!nd) return false;
    if(t._v45NextCreated && t._v45NextDue===nd) return false;
    if(nextTaskAlreadyExistsV45(t,nd)){ markRecurringCreatedV45(t,nd); try{dbSaveTask(t);}catch(e){} return false; }
    const nt={
      id:++nid,
      name:t.name,
      project:t.project||'',
      client:t.client||'',
      assignee:t.assignee||'',
      due:nd,
      done:false,
      recur:t.recur||'',
      notes:t.notes||'',
      subtasks:(t.subtasks||[]).map(s=>({
        ...s,
        id:++nid,
        done:false,
        due:shiftSubDueV45(s.due,t.due,nd,t.recur)
      }))
    };
    markRecurringCreatedV45(t,nd);
    (tasks||[]).unshift(nt);
    try{dbSaveTask(t);dbSaveTask(nt);dbSaveNid();addLog('Created recurring task',(reason?reason+': ':'')+nt.name+' → '+fmtDate(nt.due),'task',nt.id);}catch(e){}
    return true;
  };
  window.sasCreateNextTodoV45=function(td,reason){
    if(!td||!td.recur||!td.done) return false;
    const nd=nextDueV45(td.due||todayV45(),td.recur); if(!nd) return false;
    if(td._v45NextCreated && td._v45NextDue===nd) return false;
    if((todos||[]).some(x=>x!==td && (x.name||'')===(td.name||'') && (x.assignee||'')===(td.assignee||'') && (x.client||'')===(td.client||'') && (x.due||'')===nd && (x.recur||'')===(td.recur||''))){
      td._nextCreated=true;td._v44NextCreated=true;td._v45NextCreated=true;td._v45NextDue=nd;try{dbSaveTodo(td);}catch(e){}return false;
    }
    const nextPeriod=(td.period&&td.recur&&typeof calcNextPeriodEnd==='function')?calcNextPeriodEnd(td.period,td.recur):'';
    const nt={...td,id:++nid,due:nd,done:false,period:nextPeriod,_nextCreated:false,_v44NextCreated:false,_v45NextCreated:false,_v45NextDue:''};
    td._nextCreated=true;td._v44NextCreated=true;td._v45NextCreated=true;td._v45NextDue=nd;
    (todos||[]).unshift(nt);
    try{dbSaveTodo(td);dbSaveTodo(nt);dbSaveNid();addLog('Created recurring to-do',(reason?reason+': ':'')+nt.name+' → '+fmtDate(nt.due),'todo',nt.id);}catch(e){}
    return true;
  };

  // Replace older wrapped handlers completely, so v26/v44 wrappers cannot create duplicate recurring copies.
  window.tglDone=function(e,id){
    if(e&&e.stopPropagation)e.stopPropagation();
    const t=(tasks||[]).find(x=>x.id===id); if(!t)return;
    const was=isTaskDone(t);
    if(t.subtasks&&t.subtasks.length){
      const all=t.subtasks.every(s=>s.done);
      t.subtasks.forEach(s=>s.done=!all);
      t.done=!all;
    }else{
      t.done=!t.done;
    }
    const now=isTaskDone(t);
    addLog(now?'Completed task':'Reopened task',t.name,'task',t.id);
    if(!now){ t._nextCreated=false;t._v44NextCreated=false;t._v45NextCreated=false;t._v45NextDue=''; }
    try{dbSaveTask(t);}catch(err){}
    let made=false;
    if(!was && now && t.recur) made=window.sasCreateNextTaskV45(t,'Completed');
    renderView();updateBadges();
    if(made) toast('Completed. Next recurring task created with subtasks.');
  };

  window.tglSubDone=function(e,tid,sid){
    if(e&&e.stopPropagation)e.stopPropagation();
    const t=(tasks||[]).find(x=>x.id===tid); if(!t)return;
    const was=isTaskDone(t);
    const s=(t.subtasks||[]).find(x=>x.id===sid); if(!s)return;
    s.done=!s.done;
    addLog(s.done?'Completed subtask':'Reopened subtask',s.name,'subtask',s.id,tid);
    if((t.subtasks||[]).length && t.subtasks.every(x=>x.done) && !t.done){
      t.done=true;
      addLog('Auto-completed task',t.name,'task',t.id);
    }
    if(!isTaskDone(t)){ t.done=false;t._nextCreated=false;t._v44NextCreated=false;t._v45NextCreated=false;t._v45NextDue=''; }
    try{dbSaveTask(t);}catch(err){}
    let made=false;
    if(!was && isTaskDone(t) && t.recur) made=window.sasCreateNextTaskV45(t,'All subtasks completed');
    renderView();updateBadges();
    if(made) toast('All subtasks completed. Next recurring task created with subtasks.');
  };

  window.tglTodoDone=function(e,id){
    if(e&&e.stopPropagation)e.stopPropagation();
    const td=(todos||[]).find(x=>x.id===id); if(!td)return;
    const was=!!td.done;
    td.done=!td.done;
    addLog(td.done?'Completed to-do':'Reopened to-do',td.name,'todo',td.id);
    if(!td.done){td._nextCreated=false;td._v44NextCreated=false;td._v45NextCreated=false;td._v45NextDue='';}
    try{dbSaveTodo(td);}catch(err){}
    let made=false;
    if(!was && td.done && td.recur) made=window.sasCreateNextTodoV45(td,'Completed');
    renderView();updateBadges();
    if(made) toast('Completed. Next recurring to-do created.');
  };

  // Replace spawnRecurring too, and never reset the completed original back to open.
  window.spawnRecurring=function(){
    (tasks||[]).slice().forEach(t=>{ if(t.recur && isTaskDone(t)) window.sasCreateNextTaskV45(t,'Scheduled'); });
    (todos||[]).slice().forEach(td=>{ if(td.recur && td.done) window.sasCreateNextTodoV45(td,'Scheduled'); });
    try{ if(typeof syncRecurringProjectDueDates==='function') syncRecurringProjectDueDates(); }catch(e){}
  };

  // Make old helper route to the safe v45 creator.
  window.createNextRecurringIfNeeded=function(kind,obj){
    if(kind==='task') return window.sasCreateNextTaskV45(obj,'Completed');
    if(kind==='todo') return window.sasCreateNextTodoV45(obj,'Completed');
    return false;
  };
})();
</script>



<!-- ══════════════════════════════════════════
     v46: remove subtask due dates + recurring project task fix
══════════════════════════════════════════ -->
<script id="sas-v46-subtask-no-due-project-recurring-fix">
(function(){
  function todayV46(){return (typeof TODAY!=='undefined'&&TODAY)?TODAY:new Date().toISOString().slice(0,10);} 
  function escV46(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
  function dateV46(d){const x=new Date((d||todayV46())+'T12:00:00');return Number.isNaN(+x)?new Date(todayV46()+'T12:00:00'):x;}
  function isoV46(d){return d.toISOString().slice(0,10);} 
  function effRecurV46(t){const p=(typeof getProj==='function')?getProj(t&&t.project):null;return (t&&t.recur)||(p&&p.recur)||'';}
  function nextDueV46(d,recur){
    if(!recur) return '';
    const x=dateV46(d); const r=String(recur).toLowerCase();
    if(r==='daily') x.setDate(x.getDate()+1);
    else if(r==='weekly') x.setDate(x.getDate()+7);
    else if(r==='biweekly') x.setDate(x.getDate()+14);
    else if(r==='semimonthly') x.setDate(x.getDate()+15);
    else if(r==='monthly') x.setMonth(x.getMonth()+1);
    else if(r==='quarterly') x.setMonth(x.getMonth()+3);
    else if(r==='annual'||r==='yearly') x.setFullYear(x.getFullYear()+1);
    else return '';
    return isoV46(x);
  }
  function projectForTaskV46(t){return (projects||[]).find(p=>p.id===(t&&t.project));}
  function taskDoneV46(t){return typeof isTaskDone==='function'?isTaskDone(t):!!(t&&t.done);}
  function taskSigV46(t,due,recur){return [t.name||'',t.project||'',t.client||'',t.assignee||'',due||t.due||'',recur||effRecurV46(t)||''].join('||');}
  function sameSubShapeV46(a,b){const as=a.subtasks||[],bs=b.subtasks||[];if(as.length!==bs.length)return false;for(let i=0;i<as.length;i++){if((as[i].name||'')!==(bs[i].name||''))return false;}return true;}
  function nextTaskExistsV46(src,nd,recur){const sig=taskSigV46(src,nd,recur);return (tasks||[]).some(x=>x!==src&&taskSigV46(x,x.due,effRecurV46(x))===sig&&sameSubShapeV46(src,x));}
  function clearRecurringFlagsV46(t){if(!t)return;t._nextCreated=false;t._v44NextCreated=false;t._v45NextCreated=false;t._v46NextCreated=false;t._v45NextDue='';t._v46NextDue='';}
  function markRecurringFlagsV46(t,nd){if(!t)return;t._nextCreated=true;t._v44NextCreated=true;t._v45NextCreated=true;t._v46NextCreated=true;t._v45NextDue=nd;t._v46NextDue=nd;}

  function syncProjectDueV46(pid){try{if(typeof syncRecurringProjectDueDates==='function')syncRecurringProjectDueDates();}catch(e){}try{const p=(projects||[]).find(x=>x.id===pid);if(p&&typeof dbSaveProject==='function')dbSaveProject(p);}catch(e){}}

  function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

  function latestProjectDue(pid){const ds=(tasks||[]).filter(t=>t.project===pid&&t.due).map(t=>t.due).sort();return ds.length?ds[ds.length-1]:'';}

  function visibleBase(kind,obj){if(kind==='project')return isAdmin()||canSeeProj(obj.id); if(kind==='todo')return isAdmin()?true:canSeeTodo(obj); return isAdmin()?true:canSeeTask(obj);}
  function baseRowsForMode(mode){

    function qok(x,kind){if(!fQ)return true;const q=String(fQ).toLowerCase();return (x.name||'').toLowerCase().includes(q)||(x.notes||'').toLowerCase().includes(q)||(kind==='task'&&(getProj(x.project).name||'').toLowerCase().includes(q))||(kind==='task'&&(x.subtasks||[]).some(s=>(s.name||'').toLowerCase().includes(q)))||(getCli(kind==='task'?itemClient({...x,_kind:'task'}):(x.client||''))||{}).name?.toLowerCase().includes(q);}
    ps=ps.filter(p=>qok(p,'project')); ts=ts.filter(t=>qok(t,'task')); tds=tds.filter(td=>qok(td,'todo'));
    if(fStat==='open'){ts=ts.filter(t=>!isTaskDone(t));ps=ps.filter(p=>!projDone(p.id)||ts.some(t=>t.project===p.id));tds=tds.filter(td=>!td.done);} else if(fStat==='done'){ts=ts.filter(t=>isTaskDone(t));ps=ps.filter(p=>projDone(p.id)||ts.some(t=>t.project===p.id));tds=tds.filter(td=>td.done);}
    if(sortC==='task'){ps.sort((a,b)=>sortD*a.name.localeCompare(b.name));ts.sort((a,b)=>sortD*a.name.localeCompare(b.name));tds.sort((a,b)=>sortD*a.name.localeCompare(b.name));}
    else if(sortC==='due'){ps.sort((a,b)=>sortD*((a.due||'9999')>(b.due||'9999')?1:-1));ts.sort((a,b)=>sortD*((a.due||'9999')>(b.due||'9999')?1:-1));tds.sort((a,b)=>sortD*((a.due||'9999')>(b.due||'9999')?1:-1));}
    else if(sortC==='assignee'){ps.sort((a,b)=>sortD*getMem(a.assignee).name.localeCompare(getMem(b.assignee).name));ts.sort((a,b)=>sortD*getMem(a.assignee).name.localeCompare(getMem(b.assignee).name));tds.sort((a,b)=>sortD*getMem(a.assignee).name.localeCompare(getMem(b.assignee).name));}
    else {const so=v=>(v!=null&&v!==''?Number(v):Infinity);ps.sort((a,b)=>(so(a.sortOrder)-so(b.sortOrder))||a.name.localeCompare(b.name));ts.sort((a,b)=>(a.project||'').localeCompare(b.project||'')||(so(a.sortOrder)-so(b.sortOrder))||a.name.localeCompare(b.name));tds.sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')||a.name.localeCompare(b.name));}
    return {ps,ts,tds};
  }
  function allSelectable(mode){const r=baseRowsForMode(mode);return [...r.ps.map(x=>({...x,_kind:'project'})),...r.ts.map(x=>({...x,_kind:'task'})),...r.tds.map(x=>({...x,_kind:'todo'}))];}

  function dynamicOpts(field,mode){const r=baseRowsForMode(mode);const all=[...r.ps.map(x=>({...x,_kind:'project'})),...r.ts.map(x=>({...x,_kind:'task'})),...r.tds.map(x=>({...x,_kind:'todo'}))];

  function projectRow(p,childCount){const cli=getCli(p.client);const col=pc(p.palId);const m=getMem(p.assignee||'');const mcx=mc2(m.palId);const done=projDone(p.id);const due=latestProjectDue(p.id)||p.due;const late=isLate(due,done);const exp=isProjExpanded(p.id);return `<div class="trow gcols sas-project-row ${done?'dim':''}" onclick="openProjDetail('${esc(p.id)}')"><button class="exp-btn sas-v48-project-exp" onclick="event.stopPropagation();toggleProjectTasksV48('${esc(p.id)}')" title="${exp?'Collapse':'Expand'} project tasks"><i class="ti ${exp?'ti-chevron-down':'ti-chevron-right'}"></i></button><div class="tname ${done?'done':''}"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.name)}</span>${recurBadge(p.recur)}${childCount?`<span class="sub-ctr">${childCount}</span>`:''}</div><div class="sas-type-cell"><span class="tag" style="background:${col.bg};color:${col.tc};max-width:220px;overflow:hidden;text-overflow:ellipsis;display:inline-block">${esc(p.name)}</span></div><div style="font-size:var(--fs-xs);color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${cli?esc(cli.name):'—'}</div><div><div class="tdue ${late?'late':''}">${fmtDate(due)}</div>${relDate(due)?`<div class="rel-date">${relDate(due)}</div>`:''}</div><div>${p.period&&p.recur&&typeof periodLabel==='function'?`<span class="sas-period-badge" style="font-size:11px;background:var(--ledger-lt,#EEF2FB);color:var(--ledger,#202657);border-radius:99px;padding:2px 8px;font-weight:600;display:inline-flex;align-items:center;gap:3px"><i class="ti ti-calendar-week" style="font-size:10px"></i>${periodLabel(p.period,p.recur)}</span>`:''}</div><div>${p.assignee?`<div class="av" style="width:22px;height:22px;background:${mcx.bg};color:${mcx.tc};font-size:9px">${m.initials}</div>`:'—'}</div><div class="racts" onclick="event.stopPropagation()"><label class="sas-select-action"><input type="checkbox" class="selbox" ${isSelected('project',p.id)?'checked':''} onclick="toggleJobSel(event,'project','${esc(p.id)}')">Select</label><button class="btn btn-ghost btn-xs" onclick="openNewTaskForProjectV48('${esc(p.id)}')" title="Add task"><i class="ti ti-plus"></i></button><button class="btn btn-ghost btn-xs" onclick="openProjDetail('${esc(p.id)}')"><i class="ti ti-history"></i></button>${perm('create_project')?`<button class="btn btn-ghost btn-xs" onclick="openEditProject('${esc(p.id)}')"><i class="ti ti-edit"></i></button><button class="btn btn-ghost btn-xs btn-danger" onclick="delProj('${esc(p.id)}')"><i class="ti ti-trash"></i></button>`:''}</div></div>`;}

  const taskRowBase=window.taskRowHTML;
  window.taskRowHTML=function(task,showSubs){let html=taskRowBase?taskRowBase(task,showSubs):'';const r=taskEffectiveRecur(task);if(r&&!html.includes('sas-v48-recur-badge')){html=html.replace(/(<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">[^<]*<\/span>)/,`$1${recurBadge(r)}`);}return html;};
  function completedBlock(key,count,html){if(!count)return'';const open=localStorage.getItem(key)==='true';return `<button class="sas-completed-toggle" onclick="localStorage.setItem('${key}',String(!(localStorage.getItem('${key}')==='true')));renderView()"><i class="ti ${open?'ti-chevron-down':'ti-chevron-right'}"></i>Completed (${count})</button>${open?html:''}`;}

{html||'<div style="text-align:center;padding:40px;color:var(--text3);font-size:13px">No items match filters</div>'}</div>`;

  // Project modal: wider, completed collapsed, task button inside project page.
  window.openNewTaskForProjectV48=function(pid){const p=getProj(pid);window._v48ReturnProject=pid;closeModal();openNewTask(pid,p.client||'');setTimeout(refreshRecurringControls,0);};
  window.openProjDetail=function(pid){syncProjectDues();window._v48CurrentProject=pid;const p=(projects||[]).find(x=>x.id===pid);if(!p)return;const pcol=pc(p.palId);const pt=(tasks||[]).filter(t=>t.project===pid);const logs=logsFor('project',pid,true);const allDone=projDone(pid);const pct=pt.length?Math.round(pt.filter(t=>isTaskDone(t)).length/pt.length*100):0;const tab=window._projDTab||'tasks';const open=pt.filter(t=>!isTaskDone(t));const done=pt.filter(t=>isTaskDone(t));const due=latestProjectDue(pid)||p.due;const _ppl=(p.period&&p.recur&&typeof periodLabel==='function')?periodLabel(p.period,p.recur):'';showModal(`<div class="mhdr"><h2 style="display:flex;align-items:center;gap:8px;min-width:0"><div style="width:12px;height:12px;border-radius:3px;background:${pcol.bg};border:2px solid ${pcol.tc};flex:0 0 auto"></div><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.name)}</span>${recurBadge(p.recur)}</h2><div style="display:flex;gap:5px"><button class="btn btn-pri btn-sm" onclick="openNewTaskForProjectV48('${esc(pid)}')"><i class="ti ti-plus"></i>Add task</button><button class="btn btn-ghost btn-sm" onclick="closeModal();openEditProject('${esc(pid)}')"><i class="ti ti-edit"></i></button><button class="btn btn-ghost btn-sm" onclick="closeModal()"><i class="ti ti-x"></i></button></div></div><div style="display:flex;gap:2px;border-bottom:1px solid var(--border);padding:0 20px"><div class="tab ${tab==='tasks'?'active':''}" onclick="window._projDTab='tasks';closeModal();openProjDetail('${esc(pid)}')">Tasks (${pt.length})</div><div class="tab ${tab==='files'?'active':''}" onclick="window._projDTab='files';closeModal();openProjDetail('${esc(pid)}')">Files (${getFiles('proj-'+pid).length})</div>${isAdmin()?`<div class="tab ${tab==='history'?'active':''}" onclick="window._projDTab='history';closeModal();openProjDetail('${esc(pid)}')">History (${logs.length})</div>`:''}</div><div class="mbody"><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px"><span class="tag" style="background:${pcol.bg};color:${pcol.tc}">${esc(p.name)}</span>${allDone?'<span class="tag" style="background:var(--success-bg);color:var(--success)">Complete</span>':''}<span style="font-size:12px;color:var(--text2)">Due ${fmtDate(due)}${relDate(due)?' · '+relDate(due):''}</span>${p.assignee?`<span style="font-size:12px;color:var(--text2)">Assigned to ${esc(getMem(p.assignee).name)}</span>`:''}${_ppl?`<span class="sas-period-badge"><i class="ti ti-calendar-week"></i>${esc(_ppl)}</span>`:''}<div class="pgbar" style="width:100%;margin-top:4px"><div class="pgfill ${allDone?'done':''}" style="width:${pct}%"></div></div></div>${tab==='tasks'?(open.map(t=>taskRowHTML(t,true)).join('')+completedBlock('sas-v48-project-modal-completed-'+pid,done.length,done.map(t=>taskRowHTML(t,true)).join(''))||'<div class="sas-v44-project-empty">No tasks</div>'):''}${tab==='files'&&perm('view_files')?renderFilesSection('proj-'+pid,perm('upload_files')):''}${isAdmin()&&tab==='history'?renderHistoryList(logs):''}${renderNotesPanel('project',pid)}</div>`);const modal=document.querySelector('#modal-root .modal');if(modal)modal.classList.add('sas-project-modal','sas-v48-project-modal');};

  const originalSaveNewTask=window.saveNewTask;

    for(const s of subs){if(!validateAssignment(s.assignee,effClient))return;}
    const taskId=++nid;const t={id:taskId,name,project:projectId,client:clientId,assignee,due:document.getElementById('nt-due')?.value||'',done:false,recur:document.getElementById('nt-recur')?.value||'',period:document.getElementById('nt-period')?.value||'',notes:document.getElementById('nt-notes')?.value||'',subtasks:subs};
    try{moveTempFiles('new-task','task-'+taskId);}catch(e){} tasks.unshift(t);addLog('Created task',name+(subs.length?' ('+subs.length+' subtasks)':''),'task',t.id);try{stc=0;dbSaveTask(t);dbSaveNid();syncProjectDues();}catch(e){} closeModal();updateBadges();
    if(ret){window._v48ReturnProject='';window._projDTab='tasks';openProjDetail(ret);toast('Task added to project');}else{renderView();toast('Task created');}

    .sas-v48-recur-badge{display:inline-flex;align-items:center;gap:3px;font-size:10px;color:#64748b;background:#f1f5f9;border:1px solid #e2e8f0;border-radius:999px;padding:2px 7px;font-weight:700;white-space:nowrap;flex-shrink:0}.sas-v48-recur-badge i{font-size:10px}.sas-v48-project-children{margin-left:26px;border-left:2px solid #e2e8f0;padding-left:2px}.sas-v48-project-exp{width:28px!important;height:28px!important;min-width:28px!important;padding:0!important}.sas-v48-section-label{margin:16px 18px 6px;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.07em;color:#64748b}.modal.sas-v48-project-modal{width:min(1120px,calc(100vw - 48px))!important;max-height:calc(100vh - 48px)!important}.sas-project-row .tname{font-weight:850}body:not(.mobile-menu-open) .tbl-hd.gcols,body:not(.mobile-menu-open) .trow.gcols{grid-template-columns:32px minmax(300px,1fr) minmax(210px,270px) minmax(130px,175px) 96px 90px 66px 200px!important}`;if(!document.getElementById(css.id))document.head.appendChild(css);
  setTimeout(()=>{syncProjectDues();refreshRecurringControls();try{renderView();}catch(e){}},200);
})();

<!-- ══════════════════════════════════════════
     v50: persistent notifications, tax access, Client ID, multi-select client services

<script id="sas-v50-client-services-tax-notifications">
(function(){
  const META_KEY='sasflow_client_meta_v50';
  const SERVICES_KEY='sasflow_client_services_v50';
  const NOTE_KEY='sasflow_mentions_notes_v1';
  const DEFAULT_SERVICES=['Bookkeeping only','Tax only','Tax + Bookkeeping'];
  function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
  function safeParse(v,fb){try{return typeof v==='string'?JSON.parse(v):(v??fb);}catch(e){return fb;}}
  function uniq(arr){return [...new Set((arr||[]).map(x=>String(x||'').trim()).filter(Boolean))];}
  function normalizeServices(v){
    if(Array.isArray(v)) return uniq(v);
    if(typeof v==='string' && v.includes('|')) return uniq(v.split('|'));
    if(typeof v==='string' && v.includes(',')) return uniq(v.split(','));
    if(typeof v==='string' && v.trim()) return [v.trim()];
    return [];
  }
  function clientServiceNames(c){return normalizeServices(c&&((c.services!=null?c.services:c.service)));}
  function servicesText(c){const s=clientServiceNames(c);return s.length?s.join(', '):'—';}
  function isTaxClient(c){return clientServiceNames(c).some(s=>/tax/i.test(s));}
  function localMeta(){return safeParse(localStorage.getItem(META_KEY)||'{}',{})||{};}
  function saveLocalMeta(meta){localStorage.setItem(META_KEY,JSON.stringify(meta||{}));}
  function getMeta(id){return localMeta()[id]||{};}
  function setMeta(id,updates){const m=localMeta();m[id]={...(m[id]||{}),...(updates||{})};saveLocalMeta(m);return m;}
  async function persistMeta(){try{if(typeof dbSaveSetting==='function')await dbSaveSetting(META_KEY,localMeta());}catch(e){console.warn('Could not save client meta',e);}}
  async function fetchSetting(key,fb){
    const sb=(typeof getSB==='function')?getSB():null;
    if(!sb||!dbReady) return fb;
    try{const {data,error}=await sb.from('app_settings').select('value').eq('key',key).maybeSingle(); if(error)throw error; return data&&data.value!=null?data.value:fb;}catch(e){return fb;}
  }
  function applyClientMeta(meta){
    (clients||[]).forEach(c=>{
      const m=(meta||{})[c.id]||{};
      c.clientCode=m.clientCode||c.clientCode||'';
      c.returnTypes=Array.isArray(m.returnTypes)?m.returnTypes:(m.returnTypes?[m.returnTypes]:(m.form?[m.form]:(Array.isArray(c.returnTypes)?c.returnTypes:[])));
      c.onboardingYear=m.onboardingYear!=null?m.onboardingYear:(c.onboardingYear||'');
      c.status=m.status||c.status||'';
      const s=normalizeServices(m.services!=null?m.services:(c.services!=null?c.services:c.service));
      c.services=s;
      c.service=s.length?s.join(', '):(c.service||'');
    });
  }
  async function loadClientMetaAndServices(){
    let services=safeParse(localStorage.getItem(SERVICES_KEY)||'[]',[]); if(!services.length)services=DEFAULT_SERVICES;
    const remoteServices=await fetchSetting(SERVICES_KEY,services); services=uniq(remoteServices&&remoteServices.length?remoteServices:services); if(!services.length)services=DEFAULT_SERVICES;
    window.clientServices=clientServices=services; localStorage.setItem(SERVICES_KEY,JSON.stringify(services));
    let meta=localMeta(); const remoteMeta=await fetchSetting(META_KEY,meta); meta={...meta,...(remoteMeta||{})}; saveLocalMeta(meta); applyClientMeta(meta);
  }
  const oldDbLoad=window.dbLoad;
  if(typeof oldDbLoad==='function'&&!oldDbLoad._v50){
    window.dbLoad=async function(){const r=await oldDbLoad.apply(this,arguments); await loadClientMetaAndServices(); return r;};
    window.dbLoad._v50=true;
  }
  setTimeout(()=>{loadClientMetaAndServices().then(()=>{try{if(typeof renderView==='function')renderView();}catch(e){}});},900);

  const oldDbSaveClient=window.dbSaveClient;
  window.dbSaveClient=async function(c){
    if(c){
      const services=clientServiceNames(c);
      c.services=services; c.service=services.join(', ');
      const meta=setMeta(c.id,{clientCode:c.clientCode||'',services,returnTypes:Array.isArray(c.returnTypes)?c.returnTypes:[],onboardingYear:c.onboardingYear||'',status:c.status||''});
      try{if(typeof dbSaveSetting==='function')await dbSaveSetting(META_KEY,meta);}catch(e){}
    }
    return oldDbSaveClient?oldDbSaveClient.apply(this,arguments):undefined;
  };

  function clientReturnTypesDropdownHTML(domPrefix,selected,reopenKey){
    selected=Array.isArray(selected)?uniq(selected):[];
    const list=uniq([...(taxReturnTypes||[]),...selected]);
    const label=selected.length?esc(selected.join(', ')):'Select return types';
    return `<div class="fi sas-rt-trigger" id="${domPrefix}-rt-trigger" onclick="toggleRTPanel('${domPrefix}')" style="cursor:pointer;display:flex;align-items:center;justify-content:space-between;user-select:none"><span id="${domPrefix}-rt-trigger-text">${label}</span><i class="ti ti-chevron-down" id="${domPrefix}-rt-chevron"></i></div><div class="sas-services-box" id="${domPrefix}-rt-panel" style="display:none;margin-top:6px"><input class="sas-cb-search" placeholder="Search return types…" oninput="filterCbList(this,'${domPrefix}-rt-panel')">${list.map(s=>`<label class="cb-item sas-service-item"><input type="checkbox" value="${esc(s)}" ${selected.includes(s)?'checked':''} onchange="updateRTTrigger('${domPrefix}')">${esc(s)}</label>`).join('')}</div><button type="button" class="btn btn-ghost btn-sm" style="margin-top:7px" onclick="openManageTaxReturnTypes('${esc(reopenKey)}')"><i class="ti ti-settings"></i>Manage return types</button>`;
  }
  window.toggleRTPanel=function(prefix){
    const panel=document.getElementById(prefix+'-rt-panel'); if(!panel)return;
    const willOpen=panel.style.display==='none';
    panel.style.display=willOpen?'block':'none';
    const chev=document.getElementById(prefix+'-rt-chevron'); if(chev)chev.className=willOpen?'ti ti-chevron-up':'ti ti-chevron-down';
  };
  window.updateRTTrigger=function(prefix){
    const vals=selectedClientReturnTypes(prefix);
    const txt=document.getElementById(prefix+'-rt-trigger-text');
    if(txt)txt.textContent=vals.length?vals.join(', '):'Select return types';
  };
  function selectedClientReturnTypes(domPrefix){return Array.from(document.querySelectorAll('#'+domPrefix+'-rt-panel input:checked')).map(x=>x.value);}
  function servicesCheckboxHTML(prefix,selected){
    selected=normalizeServices(selected);
    const list=uniq(clientServices&&clientServices.length?clientServices:DEFAULT_SERVICES);
    return `<div class="sas-services-box" id="${prefix}-services-box">${list.map(s=>`<label class="cb-item sas-service-item"><input type="checkbox" value="${esc(s)}" ${selected.includes(s)?'checked':''}>${esc(s)}</label>`).join('')}</div><button type="button" class="btn btn-ghost btn-sm" style="margin-top:7px" onclick="openManageClientServicesV50('${prefix}')"><i class="ti ti-settings"></i>Manage services</button>`;
  }
  function selectedServices(prefix){return Array.from(document.querySelectorAll(`#${prefix}-services-box input:checked`)).map(x=>x.value);}
  window.formatClientIdInput=function(el){
    const pos=el.selectionStart;
    const hadHyphenBefore=el.value.slice(0,pos).includes('-');
    let v=el.value.replace(/[^a-zA-Z0-9]/g,'').slice(0,7);
    if(v.length>5) v=v.slice(0,5)+'-'+v.slice(5);
    el.value=v;
    let newPos=pos+(v.includes('-')&&!hadHyphenBefore&&pos>5?1:0);
    try{el.setSelectionRange(newPos,newPos);}catch(e){}
  };
  function clientTypeOptions(sel){return (clientTypes||[]).map(t=>`<option${t===sel?' selected':''}>${esc(t)}</option>`).join('');}
  function clientStatusOptions(sel){let list=[...clientStatuses];if(sel&&!list.includes(sel))list=[sel,...list];return `<option value="">No status</option>`+list.map(t=>`<option${t===sel?' selected':''}>${esc(t)}</option>`).join('');}
  window.openManageClientStatuses=function(prefix){
    showModal(`<div class="mhdr"><h2>Client statuses</h2><button class="btn btn-ghost btn-sm" onclick="closeModal()"><i class="ti ti-x"></i></button></div><div class="mbody"><div id="cst-list">${clientStatuses.map((t,i)=>`<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border)"><input class="fi" value="${esc(t)}" id="cst-${i}" style="flex:1"><button class="btn btn-ghost btn-xs btn-danger" onclick="this.closest('div').remove()"><i class="ti ti-trash"></i></button></div>`).join('')}</div><button class="btn btn-sm" style="margin-top:10px" onclick="addClientStatusLine()"><i class="ti ti-plus"></i>Add status</button></div><div class="mftr"><button class="btn btn-sm" onclick="closeModal()">Cancel</button><button class="btn btn-pri btn-sm" onclick="saveClientStatuses('${esc(prefix||'')}')">Save</button></div>`);
  };
  window.addClientStatusLine=function(){const box=document.getElementById('cst-list');const i='n'+Date.now();box.insertAdjacentHTML('beforeend',`<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border)"><input class="fi" id="cst-${i}" style="flex:1" placeholder="New status"><button class="btn btn-ghost btn-xs btn-danger" onclick="this.closest('div').remove()"><i class="ti ti-trash"></i></button></div>`);};
  window.saveClientStatuses=async function(prefix){
    const vals=[...new Set(Array.from(document.querySelectorAll('#cst-list input')).map(x=>x.value.trim()).filter(Boolean))];
    clientStatuses=vals.length?vals:clientStatuses;
    try{await dbSaveSetting('client_statuses',clientStatuses);}catch(e){console.warn('Could not save client statuses',e);}
    closeModal(); toast('Statuses saved');
    if(prefix==='new')openNewClient(); else if(prefix&&prefix.indexOf('edit:')===0)openEditClient(prefix.slice(5)); else renderView();
  };
  function clientAccessPanelCompat(clientId){return typeof clientAccessHTML==='function'?clientAccessHTML(clientId):'';}

  window.openManageClientServicesV50=function(prefix){
    const list=uniq(clientServices&&clientServices.length?clientServices:DEFAULT_SERVICES);
    showModal(`<div class="mhdr"><h2>Client services</h2><button class="btn btn-ghost btn-sm" onclick="closeModal()"><i class="ti ti-x"></i></button></div><div class="mbody"><div id="svc-list-v50">${list.map((s,i)=>`<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border)"><input class="fi" value="${esc(s)}" id="svc-v50-${i}" style="flex:1"><button class="btn btn-ghost btn-xs btn-danger" onclick="document.getElementById('svc-v50-${i}').value=''"><i class="ti ti-trash"></i></button></div>`).join('')}</div><button class="btn btn-sm" style="margin-top:10px" onclick="addServiceLineV50()"><i class="ti ti-plus"></i>Add service</button></div><div class="mftr"><button class="btn btn-sm" onclick="closeModal()">Cancel</button><button class="btn btn-pri btn-sm" onclick="saveClientServicesV50('${esc(prefix||'')}' )">Save services</button></div>`);
  };
  window.addServiceLineV50=function(){const box=document.getElementById('svc-list-v50');const i=Date.now();box.insertAdjacentHTML('beforeend',`<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border)"><input class="fi" id="svc-v50-${i}" style="flex:1" placeholder="New service"><button class="btn btn-ghost btn-xs btn-danger" onclick="document.getElementById('svc-v50-${i}').value=''"><i class="ti ti-trash"></i></button></div>`);};
  window.saveClientServicesV50=async function(prefix){
    const vals=uniq(Array.from(document.querySelectorAll('#svc-list-v50 input')).map(x=>x.value));
    clientServices=vals.length?vals:DEFAULT_SERVICES; window.clientServices=clientServices;
    localStorage.setItem(SERVICES_KEY,JSON.stringify(clientServices));
    try{await dbSaveSetting(SERVICES_KEY,clientServices);}catch(e){console.warn(e);}
    closeModal(); toast('Services saved');
    if(prefix==='new')openNewClient(); else if(prefix&&prefix.startsWith('edit:'))openEditClient(prefix.slice(5)); else renderView();
  };

  window.openNewClient=function(){
    if(typeof sasCanAddClient==='function' && !sasCanAddClient()){toast('You do not have permission to add clients');return;}
    showModal(`<div class="mhdr"><h2>New client</h2><button class="btn btn-ghost btn-sm" onclick="closeModal()"><i class="ti ti-x"></i></button></div><div class="mbody"><div class="gr2"><div><label class="fl-lbl">Company name <span style="color:var(--stamp)">*</span></label><input class="fi" id="nc-name" autofocus></div><div><label class="fl-lbl">Client ID <span style="color:var(--stamp)">*</span></label><input class="fi" id="nc-client-id" placeholder="12345-67" maxlength="8" oninput="formatClientIdInput(this)"></div></div><div class="gr2"><div><label class="fl-lbl">Type</label><select class="fi" id="nc-type">${clientTypeOptions('Business')}</select></div><div><label class="fl-lbl">Onboarding year</label><input class="fi" id="nc-onb-year" type="number" placeholder="e.g. 2024"></div></div><div class="fl"><label>Status</label><select class="fi" id="nc-status">${clientStatusOptions('')}</select><button type="button" class="btn btn-ghost btn-xs" style="margin-top:5px" onclick="openManageClientStatuses('new')"><i class="ti ti-settings"></i>Manage statuses</button></div><div class="sas-form-section-hdr">Contact</div><div class="gr3"><div><label class="fl-lbl">Primary contact</label><input class="fi" id="nc-contact"></div><div><label class="fl-lbl">Email</label><input class="fi" id="nc-email" type="email"></div><div><label class="fl-lbl">Phone</label><input class="fi" id="nc-phone" type="tel"></div></div><div class="sas-form-section-hdr">Tax &amp; services</div><div class="fl"><label>Return type</label>${clientReturnTypesDropdownHTML('nc',[],'newclient')}</div><div class="fl"><label>Services</label>${servicesCheckboxHTML('nc',[])}</div><div class="sas-form-section-hdr">Notes &amp; relationships</div><div class="fl"><label>Notes</label><textarea class="fi" id="nc-notes" rows="2"></textarea></div>${clientAccessPanelCompat(null)}<div class="fl"><label>Related clients & relationship</label>${typeof relCliHTML==='function'?relCliHTML(null):''}</div></div><div class="mftr"><button class="btn btn-sm" onclick="closeModal()">Cancel</button><button class="btn btn-pri btn-sm" onclick="saveNewClient()"><i class="ti ti-check"></i>Add</button></div>`);
  };
  window.saveNewClient=function(){
    const name=document.getElementById('nc-name').value.trim();

ow._cliTab='overview'"><i class="ti ti-arrow-right"></i></button>${canEdit?`<button class="btn btn-ghost btn-xs" onclick="openEditClient('${esc(c.id)}')"><i class="ti ti-edit"></i></button>`:''}${canDelete&&c.id!=='c4'?`<button class="btn btn-ghost btn-xs btn-danger" onclick="rmCli('${esc(c.id)}')"><i class="ti ti-trash"></i></button>`:''}</div></div></div>`;}).join('')}</div>`;

  /* ── Client bulk import via Excel ── */
  const CLIENT_IMPORT_HEADERS=['Client ID','Client Name','Type','Primary Contact','Email','Phone','Onboarding Year','Status','Return Types','Services','Notes'];
  window.downloadClientImportTemplate=function(){
    if(typeof XLSX==='undefined'){toast('Excel library failed to load — check your connection and reload the page');return;}
    const wb=XLSX.utils.book_new();
    const ws=XLSX.utils.aoa_to_sheet([CLIENT_IMPORT_HEADERS]);
    ws['!cols']=[{wch:14},{wch:26},{wch:16},{wch:20},{wch:24},{wch:16},{wch:14},{wch:16},{wch:22},{wch:26},{wch:30}];
    XLSX.utils.book_append_sheet(wb,ws,'Clients');
    const instr=[
      ['How to use this template'],[''],
      ['1. Fill in one row per client on the "Clients" sheet, below the header row.'],
      ['2. Client ID and Client Name are required. Rows missing either will be skipped on import.'],
      ['2a. Client IDs in the app follow a 12345-67 format (5 characters, hyphen, 2 characters), but the import will accept whatever you enter.'],
      ['3. Return Types and Services accept multiple values — separate with a comma, e.g. "1040, 1120S".'],
      ['4. Any Type, Status, Return Type, or Service you enter that does not already exist will be added automatically.'],
      ['5. Re-uploading this file later will UPDATE any client whose Client ID matches a row here, and add any new Client IDs as new clients.'],
      [''],
      ['Current Type options: '+(clientTypes||[]).join(', ')],
      ['Current Status options: '+(clientStatuses||[]).join(', ')],
      ['Current Return Type options: '+(taxReturnTypes||[]).join(', ')],
      ['Current Service options: '+(clientServices||[]).join(', ')],
    ];
    const ws2=XLSX.utils.aoa_to_sheet(instr);
    ws2['!cols']=[{wch:100}];
    XLSX.utils.book_append_sheet(wb,ws2,'Instructions');
    XLSX.writeFile(wb,'SASFlow_Client_Import_Template.xlsx');
  };
  window.openImportClientsModal=function(){
    if(typeof sasCanAddClient==='function' && !sasCanAddClient()){toast('You do not have permission to add clients');return;}
    window._clientImportRows=null;
    showModal(`<div class="mhdr"><h2>Import clients</h2><button class="btn btn-ghost btn-sm" onclick="closeModal()"><i class="ti ti-x"></i></button></div><div class="mbody"><div style="font-size:13px;color:var(--text2);margin-bottom:12px">Upload a filled-out client spreadsheet. Existing clients (matched by Client ID) will be updated; new Client IDs will be added.</div><button type="button" class="btn btn-sm" onclick="downloadClientImportTemplate()" style="margin-bottom:16px"><i class="ti ti-download"></i>Download template</button><div class="fl"><label>Excel file (.xlsx)</label><input class="fi" type="file" id="ci-file" accept=".xlsx,.xls" onchange="handleClientImportFile(this)"></div><div id="ci-preview" style="margin-top:14px"></div></div><div class="mftr"><button class="btn btn-sm" onclick="closeModal()">Cancel</button><button class="btn btn-pri btn-sm" id="ci-confirm-btn" onclick="confirmClientImport()" disabled><i class="ti ti-upload"></i>Import</button></div>`);
  };
  window.handleClientImportFile=function(input){
    const file=input.files&&input.files[0]; if(!file)return;
    if(typeof XLSX==='undefined'){toast('Excel library failed to load — check your connection and reload the page');return;}
    const reader=new FileReader();
    reader.onload=function(e){
      try{
        const data=new Uint8Array(e.target.result);
        const wb=XLSX.read(data,{type:'array'});
        const sheetName=wb.SheetNames.find(n=>n.trim().toLowerCase()==='clients')||wb.SheetNames[0];
        const sheet=wb.Sheets[sheetName];
        const rows=XLSX.utils.sheet_to_json(sheet,{defval:''});
        const get=(r,k)=>{const key=Object.keys(r).find(x=>x.trim().toLowerCase()===k);return key?String(r[key]).trim():'';};
        const valid=[]; const skipped=[];
        rows.forEach((r,i)=>{
          const clientId=get(r,'client id'); const name=get(r,'client name');
          if(!clientId||!name){skipped.push({row:i+2,reason:!clientId&&!name?'missing Client ID and Client Name':(!clientId?'missing Client ID':'missing Client Name')});return;}
          valid.push({
            clientId,name,
            type:get(r,'type'),
            contact:get(r,'primary contact'),
            email:get(r,'email'),
            phone:get(r,'phone'),
            onboardingYear:get(r,'onboarding year'),
            status:get(r,'status'),
            returnTypes:get(r,'return types').split(',').map(s=>s.trim()).filter(Boolean),
            services:get(r,'services').split(',').map(s=>s.trim()).filter(Boolean),
            notes:get(r,'notes')
          });
        });
        window._clientImportRows=valid;
        const existingIds=new Set(clients.map(c=>c.clientCode).filter(Boolean));
        const willUpdate=valid.filter(v=>existingIds.has(v.clientId)).length;
        const willCreate=valid.length-willUpdate;
        const box=document.getElementById('ci-preview');
        if(box)box.innerHTML=`<div class="card" style="padding:12px 14px;font-size:13px"><b>${valid.length}</b> row(s) ready — <b>${willCreate}</b> new client(s), <b>${willUpdate}</b> existing client(s) will be updated.${skipped.length?`<div style="color:var(--stamp);margin-top:6px">${skipped.length} row(s) skipped: ${esc(skipped.map(s=>`row ${s.row} (${s.reason})`).join('; '))}</div>`:''}</div>`;
        const btn=document.getElementById('ci-confirm-btn'); if(btn)btn.disabled=valid.length===0;
      }catch(err){console.error(err);toast('Could not read that file — make sure it is a valid .xlsx export of the template');}
    };
    reader.readAsArrayBuffer(file);
  };
  window.confirmClientImport=async function(){
    const rows=window._clientImportRows||[];
    if(!rows.length){toast('Nothing to import');return;}
    const btn=document.getElementById('ci-confirm-btn'); if(btn){btn.disabled=true;btn.textContent='Importing…';}
    let created=0,updated=0;
    const newTypes=new Set(clientTypes||[]); const newStatuses=new Set(clientStatuses||[]); const newReturnTypes=new Set(taxReturnTypes||[]); const newServices=new Set(clientServices||[]);
    for(const r of rows){
      let c=clients.find(x=>x.clientCode===r.clientId);
      if(!c){c={id:'c'+Date.now()+Math.floor(Math.random()*1000),clientCode:r.clientId,contacts:[],relatedClients:[]};clients.push(c);created++;}else{updated++;}
      c.name=r.name||c.name;
      if(r.type){c.type=r.type;newTypes.add(r.type);}
      if(r.contact)c.contact=r.contact;
      if(r.email)c.email=r.email;
      if(r.phone)c.phone=r.phone;
      if(r.onboardingYear)c.onboardingYear=r.onboardingYear;
      if(r.status){c.status=r.status;newStatuses.add(r.status);}
      if(r.returnTypes&&r.returnTypes.length){c.returnTypes=r.returnTypes;r.returnTypes.forEach(t=>newReturnTypes.add(t));}
      if(r.services&&r.services.length){c.services=r.services;c.service=r.services.join(', ');r.services.forEach(s=>newServices.add(s));}
      if(r.notes)c.notes=r.notes;
      try{await dbSaveClient(c);}catch(e){console.warn('Import save failed for',r.clientId,e);}
    }
    clientTypes=[...newTypes]; clientStatuses=[...newStatuses]; taxReturnTypes=[...newReturnTypes]; clientServices=[...newServices];
    try{
      await dbSaveSetting('client_types',clientTypes);
      await dbSaveSetting('client_statuses',clientStatuses);
      await dbSaveSetting('tax_return_types',taxReturnTypes);
      await dbSaveSetting(SERVICES_KEY,clientServices);
      localStorage.setItem(SERVICES_KEY,JSON.stringify(clientServices));
    }catch(e){console.warn('Could not save updated option lists',e);}
    addLog('Imported clients',`${created} created, ${updated} updated`);
    window._clientImportRows=null;
    closeModal(); renderView();
    toast(`Import complete: ${created} created, ${updated} updated`);
  };

  /* Persistent notification clearing. Store dismissedBy/readBy in cloud, not only localStorage. */
  async function cloudNotes(){
    let local=safeParse(localStorage.getItem(NOTE_KEY)||'[]',[]);
    const sb=(typeof getSB==='function')?getSB():null;
    if(sb&&dbReady){try{const {data}=await sb.from('app_settings').select('value').eq('key',NOTE_KEY).maybeSingle();const remote=safeParse(data&&data.value?data.value:[],[]);const map={};[...remote,...local].forEach(n=>{if(!n||!n.id)return;const e=map[n.id]||{};map[n.id]={...e,...n,readBy:uniq([...(e.readBy||[]),...(n.readBy||[])]),dismissedBy:uniq([...(e.dismissedBy||[]),...(n.dismissedBy||[])])};});local=Object.values(map);}catch(e){}}
    return local;
  }
  async function saveCloudNotesV50(arr){localStorage.setItem(NOTE_KEY,JSON.stringify(arr||[])); try{await dbSaveSetting(NOTE_KEY,arr||[]);}catch(e){} try{if(typeof updateNotifBadge==='function')updateNotifBadge();}catch(e){} }
  function mentionedMe(n){return currentUser&&(n.mentions||[]).includes(currentUser.id);} function isDismissed(n){return currentUser&&(n.dismissedBy||[]).includes(currentUser.id);} function isRead(n){return currentUser&&(n.readBy||[]).includes(currentUser.id);}
  async function mutateNotes(fn,msg){const arr=await cloudNotes();let count=0;arr.forEach(n=>{if(fn(n))count++;});await saveCloudNotesV50(arr);try{renderView();}catch(e){} if(msg)toast(typeof msg==='function'?msg(count):msg);}
  window.sasDismissNotification=function(noteId){mutateNotes(n=>{if(String(n.id)!==String(noteId)||!currentUser)return false;n.readBy=uniq([...(n.readBy||[]),currentUser.id]);n.dismissedBy=uniq([...(n.dismissedBy||[]),currentUser.id]);return true;},'Notification cleared');};
  window.sasMarkNoteRead=window.sasDismissNotification;
  window.sasClearReadNotifications=function(){mutateNotes(n=>{if(mentionedMe(n)&&isRead(n)&&!isDismissed(n)){n.dismissedBy=uniq([...(n.dismissedBy||[]),currentUser.id]);return true;}return false;},c=>c?`Cleared ${c} read notification(s)`:'No read notifications to clear');};
  window.sasMarkAllRead=function(){mutateNotes(n=>{if(mentionedMe(n)&&!isDismissed(n)){n.readBy=uniq([...(n.readBy||[]),currentUser.id]);n.dismissedBy=uniq([...(n.dismissedBy||[]),currentUser.id]);return true;}return false;},c=>c?'Notifications cleared':'No notifications to clear');};
  const oldSync=window.sasSyncNotesFromCloud;
  if(typeof oldSync==='function')window.sasSyncNotesFromCloud=async function(){const arr=await cloudNotes();await saveCloudNotesV50(arr);};

  const css=document.createElement('style');css.id='sas-v50-style';css.textContent=`.sas-services-box{border:1px solid var(--border2);border-radius:var(--radius);max-height:170px;overflow:auto}.sas-service-item{font-weight:500}.sas-service-item input{width:16px;height:16px}.card .card-hdr div[style*="font-size:12px"]{line-height:1.45}.sas-cb-search{width:100%;box-sizing:border-box;padding:6px 10px;font-size:13px;border:none;border-bottom:1px solid var(--border2);background:var(--bg2);outline:none;position:sticky;top:0;z-index:1}.sas-cb-search::placeholder{color:var(--text3)}`;document.head.appendChild(css);
  window.filterCbList=function(input,panelId){
    const q=(input.value||'').toLowerCase();
    document.querySelectorAll('#'+panelId+' label.cb-item').forEach(lbl=>{
      lbl.style.display=lbl.textContent.toLowerCase().includes(q)?'':'none';
    });
  };
})();

<!-- ============================================================
     RLS TOKEN-EXCHANGE PATCH v4  (SANDBOX TEST BUILD)
     Proven approach: bake the minted per-user JWT into the client's
     global.headers at CREATION time (postgrest can't clobber a creation-time
     Authorization header — verified live). getSB() returns the authed client
     once the token is ready; until then it returns an anon client (fail-closed,
     empty). On login / token-ready we rebuild the client and reload data.
     SANDBOX ONLY.
     ============================================================ -->
<script>
(function(){
  "use strict";
  var EXCHANGE_URL = SB_URL + "/functions/v1/exchange-jwt";
  var _sbJwt = null, _sbJwtExp = 0, _inflight = null;
  var _authedClient = null;      // client built WITH the token
  var _anonClient = null;        // fallback client (no token) -> RLS empty
  var _buildPromise = null;      // in-flight build (await instead of racing)

  function _decodeExp(jwt){
    try { var p = JSON.parse(atob(jwt.split(".")[1].replace(/-/g,"+").replace(/_/g,"/"))); return p.exp ? p.exp*1000 : 0; }
    catch(e){ return 0; }
  }
  async function _getIdToken(){
    if (typeof getMsal !== "function") return null;
    var inst; try { inst = await getMsal(); } catch(e){ return null; }
    if (!inst) return null;
    var acct = (inst.getActiveAccount && inst.getActiveAccount())
            || (inst.getAllAccounts && inst.getAllAccounts()[0]) || null;
    if (!acct) return null;
    try {
      var res = await inst.acquireTokenSilent({
        account: acct,
        scopes: (typeof loginRequest !== "undefined" && loginRequest.scopes) || ["openid","profile","email"]
      });
      return res.idToken || null;
    } catch(e){ console.warn("[rls] acquireTokenSilent failed", e); return null; }
  }
  async function _mintJwt(){
    var now = Date.now();
    if (_sbJwt && now < _sbJwtExp) return _sbJwt;
    if (_inflight) return _inflight;
    _inflight = (async function(){
      try {
        var idt = await _getIdToken();
        if (!idt) return null;
        var r = await fetch(EXCHANGE_URL, { method:"POST",
          headers:{ "Authorization":"Bearer "+idt, "apikey":SB_KEY, "Content-Type":"application/json" }});
        if (!r.ok){ console.warn("[rls] exchange HTTP", r.status); return null; }
        var b = await r.json();
        if (!b || !b.supabaseJwt) return null;
        _sbJwt = b.supabaseJwt;
        var exp = _decodeExp(_sbJwt);
        _sbJwtExp = exp ? (exp - 10*60*1000) : (now + 50*60*1000);
        return _sbJwt;
      } catch(e){ console.error("[rls] exchange error", e); return null; }
      finally { _inflight = null; }
    })();
    return _inflight;
  }

  function _makeClient(jwt){
    var opts = { auth:{ autoRefreshToken:false, persistSession:false } };
    if (jwt) opts.global = { headers: { Authorization: "Bearer " + jwt } };
    return _origCreate(SB_URL, SB_KEY, opts);
  }

  var _origCreate = (window.supabase && window.supabase.createClient)
    ? window.supabase.createClient.bind(window.supabase) : null;

  // Build (or rebuild) the authed client, then reload the app's data.
  // Dedupes concurrent callers onto one shared promise so an explicit
  // ensure(true) awaits the same build a background getSB() kicked off.
  function ensureAuthedClient(force){
    if (_authedClient && !force) return Promise.resolve(_authedClient);
    if (_buildPromise) return _buildPromise;
    _buildPromise = (async function(){
      try {
        var jwt = await _mintJwt();
        if (!jwt) return null;
        _authedClient = _makeClient(jwt);
        try { if (_authedClient.realtime && _authedClient.realtime.setAuth) _authedClient.realtime.setAuth(jwt); } catch(e){}
        window.__rlsReady = true;
        console.log("[rls] authed client ready — reloading data.");
        try {
          if (typeof dbLoad === "function") { await dbLoad(); }
          if (typeof updateBadges === "function") updateBadges();
          if (typeof renderView === "function") renderView();
        } catch(e){ console.warn("[rls] post-auth reload issue", e); }
        return _authedClient;
      } finally { _buildPromise = null; }
    })();
    return _buildPromise;
  }

  // getSB(): return authed client if ready; else an anon client (fail-closed),
  // and kick off building the authed one in the background.
  if (typeof getSB === "function" && _origCreate) {
    window.getSB = function(){
      if (_authedClient) return _authedClient;
      // start building (non-blocking) if we have a signed-in account
      ensureAuthedClient();
      if (!_anonClient) _anonClient = _makeClient(null);
      return _anonClient;
    };
    try { if (typeof sb !== "undefined") sb = null; } catch(e){}

    window.clearSupabaseTokenCache = function(){
      _sbJwt = null; _sbJwtExp = 0; _authedClient = null; window.__rlsReady = false;
    };
    window.__rlsGetJwt = _mintJwt;
    window.__rlsEnsure = ensureAuthedClient;

    // Prime after login: wrap loginAs so the authed client builds right when
    // a user is established, then data reloads with their token.
    if (typeof loginAs === "function") {
      var _origLoginAs = loginAs;
      window.loginAs = function(id){
        var r = _origLoginAs.apply(this, arguments);
        // build authed client + reload once MSAL account is present
        ensureAuthedClient(true);
        return r;
      };
    }

    console.log("[rls] token-exchange patch v4 active (SANDBOX) — creation-time header client.");
  } else {
    console.error("[rls] getSB or supabase.createClient not found — patch could not attach.");
  }
})();
</script>
