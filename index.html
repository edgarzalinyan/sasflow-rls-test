<style id="sas-period-css">
.sas-period-badge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;background:var(--ledger-lt,#EEF2FB);color:var(--ledger,#202657);border:1px solid rgba(32,38,87,.15);white-space:nowrap;flex-shrink:0}
.sas-period-badge i{font-size:10px}
</style>
<script>
/* ── Period field utilities ── */
window.calcNextPeriodEnd=function(periodEnd,recur){
  if(!periodEnd||!recur)return '';
  const d=new Date(periodEnd+'T12:00:00');if(isNaN(d))return '';
  const day=d.getDate(),month=d.getMonth(),year=d.getFullYear();

  // Helper: last day of month (0-indexed month)
  function lastOfMonth(y,m){return new Date(y,m+1,0).getDate();}
  // Is this the last day of its month?
  const isLast=day===lastOfMonth(year,month);

  if(recur==='daily'){
    const n=new Date(d);n.setDate(day+1);return n.toISOString().slice(0,10);
  }
  if(recur==='weekly'){
    const n=new Date(d);n.setDate(day+7);return n.toISOString().slice(0,10);
  }
  if(recur==='biweekly'){
    const n=new Date(d);n.setDate(day+14);return n.toISOString().slice(0,10);
  }
  if(recur==='semimonthly'){
    // 1–15 → 16–last; 16–last → 1–15 next month
    if(day<=15){
      const last=lastOfMonth(year,month);
      return `${year}-${String(month+1).padStart(2,'0')}-${String(last).padStart(2,'0')}`;
    }
    const nm=month>=11?0:month+1,ny=month>=11?year+1:year;
    return `${ny}-${String(nm+1).padStart(2,'0')}-15`;
  }
  if(recur==='monthly'){
    // Advance one month; if original was last day of month, snap to last day of new month
    const nm=month>=11?0:month+1,ny=month>=11?year+1:year;
    const newDay=isLast?lastOfMonth(ny,nm):Math.min(day,lastOfMonth(ny,nm));
    return `${ny}-${String(nm+1).padStart(2,'0')}-${String(newDay).padStart(2,'0')}`;
  }
  if(recur==='quarterly'){
    // Advance 3 months; snap to last day of target month if original was month-end
    let nm=month+3,ny=year;
    if(nm>11){nm-=12;ny++;}
    const newDay=isLast?lastOfMonth(ny,nm):Math.min(day,lastOfMonth(ny,nm));
    return `${ny}-${String(nm+1).padStart(2,'0')}-${String(newDay).padStart(2,'0')}`;
  }
  if(recur==='annual'||recur==='yearly'){
    // Same month next year; handle Feb 29 leap year edge case
    const newDay=Math.min(day,lastOfMonth(year+1,month));
    return `${year+1}-${String(month+1).padStart(2,'0')}-${String(newDay).padStart(2,'0')}`;
  }
  return '';
};
window.periodLabel=function(periodEnd,recur){
  if(!periodEnd)return '';
  const d=new Date(periodEnd+'T12:00:00');if(isNaN(d))return periodEnd;
  const day=d.getDate(),month=d.getMonth(),year=d.getFullYear();
  const mn=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][month];
  const ys=year!==new Date().getFullYear()?` ${year}`:'';
  if(recur==='daily')return `${mn} ${day}${ys}`;
  if(recur==='weekly'){const s=new Date(d);s.setDate(day-6);const sm=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][s.getMonth()];return s.getMonth()===month?`${mn} ${s.getDate()}–${day}${ys}`:`${sm} ${s.getDate()} – ${mn} ${day}${ys}`;}
  if(recur==='biweekly'){const s=new Date(d);s.setDate(day-13);const sm=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][s.getMonth()];return s.getMonth()===month?`${mn} ${s.getDate()}–${day}${ys}`:`${sm} ${s.getDate()} – ${mn} ${day}${ys}`;}
  if(recur==='semimonthly'){if(day<=15)return `${mn} 1–15${ys}`;const last=new Date(year,month+1,0).getDate();return `${mn} 16–${last}${ys}`;}
  if(recur==='monthly')return `${mn}${ys}`;
  if(recur==='quarterly')return `Q${Math.floor(month/3)+1} ${year}`;
  if(recur==='annual'||recur==='yearly')return `${year}`;
  return `${mn} ${day}${ys}`;
};
</script>

<!-- ══════════════════════════════════════════
     v49: recurring PROJECTS spawn-on-complete (consistency with tasks/to-dos)
     - A recurring project regenerates the moment its LAST task is completed
       (projDone === all tasks done), not on a date sweep.
     - Neutralizes the old date-sweep project branch to prevent stacking/dupes.
     - Fresh copy: new id, tasks & subtasks reset to open, due advanced by
       recurrence, period rolled via calcNextPeriodEnd. One live copy at a time.
══════════════════════════════════════════ -->
<script id="sas-v49-project-spawn-on-complete">
(function(){
  function todayV49(){return (typeof TODAY!=='undefined'&&TODAY)?TODAY:new Date().toISOString().slice(0,10);}
  function dateV49(d){const x=new Date((d||todayV49())+'T12:00:00');return isNaN(+x)?new Date(todayV49()+'T12:00:00'):x;}
  function isoV49(d){return d.toISOString().slice(0,10);}
  function nextDueV49(d,recur){
    if(!recur)return '';
    const x=dateV49(d);const r=String(recur).toLowerCase();
    if(r==='daily')x.setDate(x.getDate()+1);
    else if(r==='weekly')x.setDate(x.getDate()+7);
    else if(r==='biweekly')x.setDate(x.getDate()+14);
    else if(r==='semimonthly')x.setDate(x.getDate()+15);
    else if(r==='monthly')x.setMonth(x.getMonth()+1);
    else if(r==='quarterly')x.setMonth(x.getMonth()+3);
    else if(r==='annual'||r==='yearly')x.setFullYear(x.getFullYear()+1);
    else return '';
    return isoV49(x);
  }
  function projDoneV49(pid){
    if(typeof projDone==='function')return projDone(pid);
    const pt=(tasks||[]).filter(t=>t.project===pid);
    return pt.length>0&&pt.every(t=>typeof isTaskDone==='function'?isTaskDone(t):!!t.done);
  }
  function projTasksV49(pid){return (tasks||[]).filter(t=>t.project===pid);}

  // Has the next occurrence of this recurring project already been created?
  function nextProjExistsV49(p,nd){
    return (projects||[]).some(x=>x!==p&&x.name===p.name&&x.client===(p.client||'')&&x.recur===p.recur&&x.due===nd);
  }

  // Create the next occurrence of a completed recurring project (with fresh tasks/subtasks).
  window.sasCreateNextProjectV49=function(p,reason){
    if(!p||!p.recur)return false;
    if(!projDoneV49(p.id))return false;                 // only when fully complete
    const nd=nextDueV49(p.due||todayV49(),p.recur);
    if(!nd)return false;
    if(p._v49NextCreated&&p._v49NextDue===nd)return false;
    if(nextProjExistsV49(p,nd)){p._v49NextCreated=true;p._v49NextDue=nd;try{dbSaveProject(p);}catch(e){}return false;}

    const newId='p'+Date.now()+Math.floor(Math.random()*1000);
    const newPeriod=(p.period&&typeof calcNextPeriodEnd==='function')?calcNextPeriodEnd(p.period,p.recur):'';
    const np={...p,id:newId,due:nd,period:newPeriod};
    delete np._v49NextCreated;delete np._v49NextDue;
    delete np._nextCreated;delete np._v44NextCreated;delete np._v45NextCreated;delete np._v46NextCreated;
    (projects||[]).push(np);

    // Clone this project's tasks (and their subtasks) fresh & open onto the new project.
    const srcTasks=projTasksV49(p.id);
    srcTasks.forEach(t=>{
      const ntPeriod=(t.period&&t.recur&&typeof calcNextPeriodEnd==='function')?calcNextPeriodEnd(t.period,t.recur):(t.period||'');
      const nt={
        id:++nid,
        name:t.name,
        project:newId,
        client:t.client||np.client||'',
        assignee:t.assignee||'',
        due:t.recur?(nextDueV49(t.due||nd,t.recur)||nd):nd,
        done:false,
        recur:t.recur||'',
        period:ntPeriod,
        notes:t.notes||'',
        subtasks:(t.subtasks||[]).map(s=>({id:++nid,name:s.name,assignee:s.assignee||t.assignee||'',done:false,due:'',notes:s.notes||''}))
      };
      (tasks||[]).unshift(nt);
      try{dbSaveTask(nt);}catch(e){}
    });

    p._v49NextCreated=true;p._v49NextDue=nd;
    try{dbSaveProject(p);dbSaveProject(np);dbSaveNid&&dbSaveNid();}catch(e){}
    try{addLog('Created recurring project',(reason?reason+': ':'')+np.name+' → '+(typeof fmtDate==='function'?fmtDate(nd):nd),'project',newId);}catch(e){}
    return true;
  };

  // If a project is reopened (a task un-checked so it's no longer complete), clear the guard
  // so it can spawn again next time it completes.
  function clearProjFlagIfReopenedV49(pid){
    const p=(projects||[]).find(x=>x.id===pid);
    if(p&&p._v49NextCreated&&!projDoneV49(pid)){p._v49NextCreated=false;p._v49NextDue='';try{dbSaveProject(p);}catch(e){}}
  }

  // After any task-completion action runs, check whether that task's project just completed.
  function afterTaskChangeV49(taskId){
    const t=(tasks||[]).find(x=>x.id===taskId);
    const pid=t&&t.project;if(!pid)return;
    const p=(projects||[]).find(x=>x.id===pid);
    if(!p||!p.recur)return;
    if(projDoneV49(pid)){
      const made=window.sasCreateNextProjectV49(p,'Project completed');
      if(made){try{renderView();updateBadges();}catch(e){}try{toast('Project complete. Next recurring project created with tasks.');}catch(e){}}
    } else {
      clearProjFlagIfReopenedV49(pid);
    }
  }

  // Wrap the live task-completion handlers so project spawn fires after they finish.
  ['tglDone','tglSubDone','tglSubMod'].forEach(fn=>{
    const orig=window[fn];
    if(typeof orig!=='function'||orig._v49wrapped)return;
    window[fn]=function(){
      // First two args across these handlers carry the task id: tglDone(e,id), tglSubDone(e,tid,sid), tglSubMod(tid,sid,el)
      let tid=null;
      if(fn==='tglSubMod')tid=arguments[0];
      else tid=arguments[1];
      const r=orig.apply(this,arguments);
      try{afterTaskChangeV49(tid);}catch(e){}
      return r;
    };
    window[fn]._v49wrapped=true;
  });

  // Also wrap the subtask-edit save path (saveSubEdit) which can complete a task via modal.
  (function(){
    const orig=window.saveSubEdit;
    if(typeof orig==='function'&&!orig._v49wrapped){
      window.saveSubEdit=function(tid,sid){const r=orig.apply(this,arguments);try{afterTaskChangeV49(tid);}catch(e){}return r;};
      window.saveSubEdit._v49wrapped=true;
    }
  })();

  // Neutralize the OLD date-sweep so it no longer spawns projects (prevents stacking/dupes).
  // We keep task/to-do sweeping intact by re-running only those branches if an old spawnRecurring exists.
  (function(){
    const prev=window.spawnRecurring;
    window.spawnRecurring=function(){
      // Run whatever the latest task/to-do recurring logic is, but strip project spawning.
      // The current live model already spawns tasks/to-dos on completion, so the sweep is a no-op
      // for projects by design here. If a prior sweep exists, call it with projects temporarily hidden.
      if(typeof prev==='function'){
        const saved=window.projects;
        try{window.projects=[];prev();}catch(e){}finally{window.projects=saved;}
      }
    };
    window.spawnRecurring._v49wrapped=true;
  })();
})();
</script>

<!-- ══════════════════════════════════════════
     v50: Copy Project — robust, Supabase-persisted, wired into live UI
     - Rewrites cpyProj so the duplicated project AND its cloned tasks/subtasks
       are saved to Supabase (previously in-memory only → lost on reload).
     - Copy = fresh project: new id, name + " (copy)", recurrence CLEARED,
       all tasks/subtasks reset to open. Period preserved in memory.
     - Injects a Copy button into the live project rows and the project
       detail modal (the newer V47/V48 renders lacked one).
══════════════════════════════════════════ -->
<script id="sas-v50-copy-project">
(function(){
  // ---- robust, persisted copy ----
  window.cpyProj=function(pid){
    const proj=(projects||[]).find(p=>p.id===pid);
    if(!proj){try{toast('Project not found');}catch(e){}return;}
    if(typeof perm==='function'&&!perm('create_project')){try{toast('You do not have permission to copy projects');}catch(e){}return;}
    const newId='p'+Date.now()+Math.floor(Math.random()*1000);
    const np={...proj,id:newId,name:proj.name+' (copy)',recur:'',period:proj.period||''};
    // strip any recurring-guard flags carried over via spread
    delete np._nextCreated;delete np._v44NextCreated;delete np._v45NextCreated;
    delete np._v46NextCreated;delete np._v49NextCreated;delete np._v49NextDue;
    delete np._v45NextDue;delete np._v46NextDue;
    (projects||[]).push(np);

    const srcTasks=(tasks||[]).filter(t=>t.project===pid);
    const newTasks=srcTasks.map(t=>{
      const cp={
        ...t,
        id:++nid,
        name:t.name,           // keep task names as-is; only the project gets "(copy)"
        done:false,
        project:newId,
        recur:'',              // a copy is a one-off, matching prior cpyProj intent
        subtasks:(t.subtasks||[]).map(s=>({...s,id:++nid,done:false}))
      };
      delete cp._nextCreated;delete cp._v44NextCreated;delete cp._v45NextCreated;
      delete cp._v46NextCreated;delete cp._v45NextDue;delete cp._v46NextDue;
      return cp;
    });
    newTasks.forEach(cp=>(tasks||[]).push(cp));

    // persist
    try{
      if(typeof dbSaveProject==='function')dbSaveProject(np);
      newTasks.forEach(cp=>{try{dbSaveTask&&dbSaveTask(cp);}catch(e){}});
      dbSaveNid&&dbSaveNid();
    }catch(e){}
    try{addLog('Copied project',proj.name+' → '+np.name+' ('+newTasks.length+' tasks)','project',newId);}catch(e){}

    try{renderView();updateBadges&&updateBadges();}catch(e){}
    try{openEditProject(newId);}catch(e){}
    try{toast('Project copied ('+newTasks.length+' task'+(newTasks.length===1?'':'s')+')');}catch(e){}
  };

  // ---- inject a Copy button into live project rows + detail modal ----
  // The V47/V48 project rows put a trash button in .racts; we add a copy button just before it.
  function injectRowCopyButtons(){
    if(typeof perm==='function'&&!perm('create_project'))return;
    document.querySelectorAll('.trow.sas-project-row').forEach(row=>{
      if(row.querySelector('.sas-v50-copy'))return;
      // Derive project id from the row's onclick openProjDetail('id')
      const oc=row.getAttribute('onclick')||'';
      const m=oc.match(/openProjDetail\('([^']+)'\)/);
      if(!m)return;
      const pid=m[1];
      const acts=row.querySelector('.racts');
      if(!acts)return;
      const btn=document.createElement('button');
      btn.className='btn btn-ghost btn-xs sas-v50-copy';
      btn.title='Copy project';
      btn.innerHTML='<i class="ti ti-copy"></i>';
      btn.onclick=function(e){e.stopPropagation();cpyProj(pid);};
      // place before the delete (danger) button if present, else append
      const del=acts.querySelector('.btn-danger');
      if(del)acts.insertBefore(btn,del);else acts.appendChild(btn);
    });
  }

  // Copy button inside the project detail modal header.
  function injectModalCopyButton(){
    if(typeof perm==='function'&&!perm('create_project'))return;
    const modal=document.querySelector('.sas-project-modal, .sas-v48-project-modal');
    if(!modal)return;
    const hdr=modal.querySelector('.mhdr');
    if(!hdr||hdr.querySelector('.sas-v50-copy-modal'))return;
    const pid=window._v48CurrentProject;
    if(!pid)return;
    const btnRow=hdr.querySelector('div:last-child');
    if(!btnRow)return;
    const editBtn=btnRow.querySelector('button');
    const b=document.createElement('button');
    b.className='btn btn-ghost btn-sm sas-v50-copy-modal';
    b.title='Copy project';
    b.innerHTML='<i class="ti ti-copy"></i>';
    b.onclick=function(){try{closeModal();}catch(e){}cpyProj(pid);};
    btnRow.insertBefore(b,btnRow.firstChild);
  }

  // Re-inject after every render (renderView rebuilds the DOM).
  const origRender=window.renderView;
  if(typeof origRender==='function'&&!origRender._v50){
    window.renderView=function(){
      const r=origRender.apply(this,arguments);
      try{setTimeout(injectRowCopyButtons,0);}catch(e){}
      return r;
    };
    window.renderView._v50=true;
  }

  // openProjDetail opens a modal after render; hook it for the modal button.
  const origDetail=window.openProjDetail;
  if(typeof origDetail==='function'&&!origDetail._v50){
    window.openProjDetail=function(){
      const r=origDetail.apply(this,arguments);
      try{setTimeout(injectModalCopyButton,0);}catch(e){}
      return r;
    };
    window.openProjDetail._v50=true;
  }

  // Initial pass in case content is already on screen.
  try{setTimeout(injectRowCopyButtons,0);}catch(e){}
})();
</script>

<!-- ══════════════════════════════════════════
     v52: subtask-aware assignee filtering & visibility
     Fixes two related bugs:
       (A) Filtering by assignee kept a parent task when ANY subtask matched,
           then rendered ALL its subtasks — including other people's.
       (B) A user who could see a task only because they own one subtask could
           also see subtasks assigned to others, without view_others_work.
     Approach: display-layer only. taskRowHTML renders against a shallow copy
     whose .subtasks is the filtered set. Stored data is never mutated, so
     completion/recurrence logic (which operate on the real objects) is intact.
══════════════════════════════════════════ -->
<script id="sas-v52-subtask-filter-visibility">
(function(){
  function curId(){return (typeof currentUser!=='undefined'&&currentUser)?currentUser.id:'';}
  function admin(){return (typeof isAdmin==='function')&&isAdmin();}
  function canOthers(){return admin()||((typeof perm==='function')&&perm('view_others_work'));}
  function activeMem(){
    // Read via the app's own accessor when available (defined in the same scope
    // as the working parent-row filter), else fall back to the bare binding.
    try{ if(typeof window.sasCurrentMemFilter==='function'){ const v=window.sasCurrentMemFilter(); if(v!==undefined) return v||''; } }catch(e){}
    try{ if(typeof fMem!=='undefined') return fMem||''; }catch(e){}
    return '';
  }

  // The subtasks this viewer, under the current filter, is allowed to SEE.
  window.sasVisibleSubs=function(task){
    const subs=(task&&Array.isArray(task.subtasks))?task.subtasks:[];
    if(!subs.length)return subs;
    const co=canOthers(), me=curId(), am=activeMem();
    if(co && !am) return subs;                 // full access, no filter → unchanged
    return subs.filter(s=>{
      if(!co && s.assignee!==me) return false; // permission gate
      if(am && s.assignee!==am) return false;  // assignee filter
      return true;
    });
  };

  // Preserve TRUE completion state & count even when the displayed subtask set
  // is filtered. We tag proxies with _v52RealSubs and teach isTaskDone to use it.
  const baseIsDone=window.isTaskDone;
  if(typeof baseIsDone==='function' && !baseIsDone._v52){
    window.isTaskDone=function(t){
      if(t && t._v52RealSubs){
        const rs=t._v52RealSubs;
        return rs.length?rs.every(s=>s.done):!!t.done;
      }
      return baseIsDone.apply(this,arguments);
    };
    window.isTaskDone._v52=true;
  }

  const base=window.taskRowHTML;
  if(typeof base==='function' && !base._v52){
    window.taskRowHTML=function(task,showSubs){
      const full=(task&&Array.isArray(task.subtasks))?task.subtasks:[];
      const vis=window.sasVisibleSubs(task);
      if(vis.length===full.length) return base.call(this,task,showSubs);
      // Shallow copy: display only the visible subtasks, but stash the real set
      // so isTaskDone and any consumer that checks _v52RealSubs stay correct.
      const proxy={};for(const k in task){proxy[k]=task[k];}
      proxy.subtasks=vis;
      proxy._v52RealSubs=full;   // keeps isTaskDone honest (true completion state)
      // Counter and listed rows reflect only the VISIBLE subtasks, which is the
      // correct scope both for the assignee filter and for permission-hiding.
      // The parent checkbox / dim state still reflects the TRUE task state via
      // the isTaskDone override above, so a task never looks finished when a
      // hidden subtask is still open.
      return base.call(this,proxy,showSubs);
    };
    window.taskRowHTML._v52=true;
  }
})();
</script>

<!-- ══════════════════════════════════════════
     v53: drag-and-drop reordering (projects, tasks-within-project, subtasks)
     - Persists to a new sort_order column on projects & tasks (run SQL below).
       Subtasks reorder by their position in the task's subtasks JSONB array.
     - Manual order drives the DEFAULT sort (integrated in baseRowsForMode);
       clicking a column header still re-sorts, returning to default restores
       the dragged order.
     - Drag handles + HTML5 DnD are attached AFTER render, so the row builders
       are untouched. Reorder writes new sort_order values (gapped by 10) and
       saves only the affected rows.

     REQUIRED SQL (run once in Supabase SQL editor):
       alter table projects add column if not exists sort_order double precision;
       alter table tasks    add column if not exists sort_order double precision;
══════════════════════════════════════════ -->
<style id="sas-v53-dnd-style">
  .trow.sas-dnd-row{position:relative}
  .sas-drag-handle{position:absolute;left:-2px;top:50%;transform:translateY(-50%);cursor:grab;display:inline-flex;align-items:center;justify-content:center;width:16px;height:100%;max-height:34px;color:var(--text3,#9a9);opacity:0;flex:0 0 auto;border-radius:4px;z-index:3}
  .trow.sas-dnd-row:hover .sas-drag-handle{opacity:.5}
  .sas-drag-handle:hover{opacity:1!important;background:var(--ledger-lt,#EEF2FB)}
  .sas-drag-handle:active{cursor:grabbing}
  .sas-drag-handle i{font-size:14px;pointer-events:none}
  .trow.sas-dragging{opacity:.4}
  .trow.sas-drop-before{box-shadow:inset 0 3px 0 -1px var(--ledger,#3457C4)}
  .trow.sas-drop-after{box-shadow:inset 0 -3px 0 -1px var(--ledger,#3457C4)}
  @media(max-width:760px){.sas-drag-handle{width:20px;opacity:.5}}
</style>
<script id="sas-v53-drag-drop-reorder">
(function(){
  const GAP=10;
  function num(v){return (v!=null&&v!=='')?Number(v):null;}

  // ---- helpers to read the id off a live row ----
  function rowKind(row){
    if(row.classList.contains('sub'))return 'subtask';
    if(row.classList.contains('sas-project-row'))return 'project';
    // a task row inside the project-children wrapper (or standalone)
    return 'task';
  }
  function projIdOf(row){const oc=row.getAttribute('onclick')||'';const m=oc.match(/openProjDetail\('([^']+)'\)/);return m?m[1]:null;}
  function taskIdOf(row){const oc=row.getAttribute('onclick')||'';const m=oc.match(/openTask\((\d+)\)/);return m?+m[1]:null;}
  function subIdsOf(row){const oc=row.getAttribute('onclick')||'';const m=oc.match(/openSubEdit\((\d+),(\d+)\)/);return m?{tid:+m[1],sid:+m[2]}:null;}

  // ---- reorder + persist ----
  function reassignGapped(list){ // list: array of objects with .sortOrder; renumber 10,20,30…
    list.forEach((o,i)=>{o.sortOrder=(i+1)*GAP;});
  }

  function moveProject(draggedId,targetId,after){
    const cur=(projects||[]).slice();
    // Order the current projects the way they're displayed (by sortOrder then name)
    const so=v=>(v!=null&&v!==''?Number(v):Infinity);
    cur.sort((a,b)=>(so(a.sortOrder)-so(b.sortOrder))||(a.name||'').localeCompare(b.name||''));
    const from=cur.findIndex(p=>p.id===draggedId);
    if(from<0)return;
    const moved=cur.splice(from,1)[0];
    let to=cur.findIndex(p=>p.id===targetId);
    if(to<0){cur.push(moved);}else{cur.splice(after?to+1:to,0,moved);}
    reassignGapped(cur);
    cur.forEach(p=>{const real=(projects||[]).find(x=>x.id===p.id);if(real){real.sortOrder=p.sortOrder;}});
    // Persist only rows whose order changed (all, to be safe — small N)
    cur.forEach(p=>{const real=(projects||[]).find(x=>x.id===p.id);if(real)dbSaveProject(real);});
    try{addLog('Reordered projects',moved.name,'project',moved.id);}catch(e){}
    renderView();
  }

  function moveTaskInProject(pid,draggedId,targetId,after){
    const so=v=>(v!=null&&v!=='')?Number(v):null;
    let group=(tasks||[]).filter(t=>t.project===pid);
    // Baseline order = current array order, but if sortOrder values exist use them.
    const anySO=group.some(t=>so(t.sortOrder)!=null);
    if(anySO){
      group=group.slice().sort((a,b)=>{const av=so(a.sortOrder),bv=so(b.sortOrder);return (av==null?1e9:av)-(bv==null?1e9:bv);});
    } // else keep the existing array order (matches what the list/modal shows)
    const from=group.findIndex(t=>t.id===draggedId);
    if(from<0)return;
    const moved=group.splice(from,1)[0];
    let to=group.findIndex(t=>t.id===targetId);
    if(to<0){group.push(moved);}else{group.splice(after?to+1:to,0,moved);}
    reassignGapped(group);
    group.forEach(t=>{const real=(tasks||[]).find(x=>x.id===t.id);if(real){real.sortOrder=t.sortOrder;dbSaveTask(real);}});
    try{addLog('Reordered tasks',moved.name,'task',moved.id);}catch(e){}
    renderView();
  }

  function moveSubtask(tid,draggedSid,targetSid,after){
    const t=(tasks||[]).find(x=>x.id===tid);
    if(!t||!Array.isArray(t.subtasks))return;
    const arr=t.subtasks.slice();
    const from=arr.findIndex(s=>s.id===draggedSid);
    if(from<0)return;
    const moved=arr.splice(from,1)[0];
    let to=arr.findIndex(s=>s.id===targetSid);
    if(to<0){arr.push(moved);}else{arr.splice(after?to+1:to,0,moved);}
    t.subtasks=arr;                 // array position IS the subtask order
    dbSaveTask(t);
    try{addLog('Reordered subtasks',moved.name,'subtask',moved.id,tid);}catch(e){}
    renderView();
  }

  // ---- attach handles + DnD after each render ----
  let dragState=null; // {kind, id, pid?, tid?}

  function clearDropMarks(){document.querySelectorAll('.sas-drop-before,.sas-drop-after').forEach(el=>el.classList.remove('sas-drop-before','sas-drop-after'));}

  function attach(){
    const canProj=(typeof perm==='function')&&perm('create_project');
    const canTask=(typeof perm==='function')&&perm('edit_task');
    const rows=document.querySelectorAll('.content .trow');
    rows.forEach(row=>{
      if(row.classList.contains('ghdr')||row.classList.contains('tbl-hd'))return;
      if(row.querySelector('.sas-drag-handle'))return; // already wired
      const kind=rowKind(row);
      if(kind==='project' && !canProj)return;
      if((kind==='task'||kind==='subtask') && !canTask)return;

      // Only allow task drag when it lives inside a project-children group
      let pid=null,tid=null,sids=null;
      if(kind==='project'){pid=projIdOf(row);if(!pid)return;}
      else if(kind==='task'){
        const wrap=row.closest('.sas-v48-project-children');
        if(!wrap)return;                     // standalone tasks not draggable (per selection)
        tid=taskIdOf(row);if(tid==null)return;
        // find owning project id: previous sibling project row
        let prev=wrap.previousElementSibling;
        pid=prev&&prev.classList.contains('sas-project-row')?projIdOf(prev):null;
        if(!pid){const tk=(tasks||[]).find(t=>t.id===tid);pid=tk?tk.project:null;}
        if(!pid)return;
      } else { // subtask
        sids=subIdsOf(row);if(!sids)return;
      }

      // insert a drag handle as an absolute overlay (does NOT consume a grid column)
      row.classList.add('sas-dnd-row');
      const handle=document.createElement('span');
      handle.className='sas-drag-handle';
      handle.title='Drag to reorder';
      handle.innerHTML='<i class="ti ti-grip-vertical"></i>';
      handle.setAttribute('draggable','true');
      row.insertBefore(handle,row.firstChild);

      handle.addEventListener('dragstart',ev=>{
        ev.stopPropagation();
        if(kind==='project')dragState={kind,id:pid};
        else if(kind==='task')dragState={kind,id:tid,pid};
        else dragState={kind,id:sids.sid,tid:sids.tid};
        row.classList.add('sas-dragging');
        try{ev.dataTransfer.effectAllowed='move';ev.dataTransfer.setData('text/plain',String(dragState.id));}catch(e){}
      });
      handle.addEventListener('dragend',ev=>{row.classList.remove('sas-dragging');clearDropMarks();dragState=null;});

      // the whole row is a drop target (only accepts same-kind, same-scope)
      row.addEventListener('dragover',ev=>{
        if(!dragState)return;
        if(dragState.kind!==kind)return;
        if(kind==='task' && dragState.pid!==pid)return;      // only within same project
        if(kind==='subtask' && dragState.tid!==sids.tid)return; // only within same task
        ev.preventDefault();
        const rect=row.getBoundingClientRect();
        const after=rect.height>0 ? ((ev.clientY-rect.top)>rect.height/2) : false;
        clearDropMarks();
        row.classList.add(after?'sas-drop-after':'sas-drop-before');
      });
      row.addEventListener('drop',ev=>{
        if(!dragState)return;
        if(dragState.kind!==kind)return;
        ev.preventDefault();ev.stopPropagation();
        const rect=row.getBoundingClientRect();
        const after=rect.height>0 ? ((ev.clientY-rect.top)>rect.height/2) : false;
        clearDropMarks();
        if(kind==='project'){const tgt=projIdOf(row);if(tgt&&tgt!==dragState.id)moveProject(dragState.id,tgt,after);}
        else if(kind==='task'){const tgt=taskIdOf(row);if(dragState.pid===pid&&tgt!=null&&tgt!==dragState.id)moveTaskInProject(pid,dragState.id,tgt,after);}
        else {const s=subIdsOf(row);if(s&&dragState.tid===s.tid&&s.sid!==dragState.id)moveSubtask(s.tid,dragState.id,s.sid,after);}
        dragState=null;
      });
    });
  }

  const prev=window.renderView;
  if(typeof prev==='function' && !prev._v53){
    window.renderView=function(){const r=prev.apply(this,arguments);try{setTimeout(attach,0);}catch(e){}return r;};
    window.renderView._v53=true;
  }
  // expose reorder helpers so the modal drag-and-drop layer (v58) can reuse them
  window.sasMoveTaskInProject=moveTaskInProject;
  window.sasMoveSubtask=moveSubtask;
  window.sasMoveProject=moveProject;
  try{setTimeout(attach,0);}catch(e){}
})();
</script>

<!-- ══════════════════════════════════════════
     v54: full JSON backup + restore + daily auto-download
     Complements the v35 Excel export (which is report-only, not restorable).
     - JSON backup captures the raw arrays faithfully → can be restored.
     - Restore reads a JSON file, confirms (destructive), writes every record
       back to Supabase via existing dbSave* fns, then reloads.
     - Daily auto-download: opt-in; once per day on app open, triggers a real
       .json file download to your Downloads folder (localStorage alone is not
       a safe backup — it dies with the browser/computer).
     - Adds these controls into the existing Backup modal.
     NOTE: the HTML file itself is version-backed by GitHub commits; the app
     cannot reliably read & download its own source, so HTML backup lives there.
══════════════════════════════════════════ -->
<script id="sas-v54-json-backup-restore">
(function(){
  const AUTO_JSON_KEY='sasflow_json_backup_auto_v1';
  const LAST_JSON_KEY='sasflow_json_backup_last_ts_v1';
  const SCHEMA='sasflow-backup';
  const SCHEMA_VER=1;

  function snapshot(){
    // Read the live top-level arrays via bare identifiers (shared script scope).
    let _projects,_tasks,_todos,_clients,_members,_taxJobs,_auditLog,_palette,_customViews,_nid;
    try{_projects=projects;}catch(e){_projects=[];}
    try{_tasks=tasks;}catch(e){_tasks=[];}
    try{_todos=todos;}catch(e){_todos=[];}
    try{_clients=clients;}catch(e){_clients=[];}
    try{_members=members;}catch(e){_members=[];}
    try{_taxJobs=taxJobs;}catch(e){_taxJobs=[];}
    try{_auditLog=auditLog;}catch(e){_auditLog=[];}
    try{_palette=palette;}catch(e){_palette=null;}
    try{_customViews=customViews;}catch(e){_customViews=null;}
    try{_nid=nid;}catch(e){_nid=null;}
    return {
      _schema:SCHEMA,_schemaVersion:SCHEMA_VER,
      created_at:new Date().toISOString(),
      created_by:(typeof currentUser!=='undefined'&&currentUser?currentUser.name:''),
      counts:{projects:(_projects||[]).length,tasks:(_tasks||[]).length,todos:(_todos||[]).length,clients:(_clients||[]).length,members:(_members||[]).length},
      data:{
        projects:_projects||[],
        tasks:_tasks||[],          // includes subtasks + sortOrder + period in-object
        todos:_todos||[],
        clients:_clients||[],
        members:_members||[],
        taxJobs:_taxJobs||[],
        auditLog:(_auditLog||[]).slice(0,500),
        settings:{palette:_palette,customViews:_customViews,nid:_nid}
      }
    };
  }

  function jsonFilename(){return 'sasflow_backup_'+new Date().toISOString().slice(0,19).replace(/[-:T]/g,'')+'.json';}

  function download(text,filename,mime){
    const blob=new Blob([text],{type:mime||'application/json;charset=utf-8'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;
    document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
  }

  window.sasCreateJsonBackup=function(doDownload){
    const snap=snapshot();
    const text=JSON.stringify(snap,null,2);
    try{localStorage.setItem(LAST_JSON_KEY,snap.created_at);}catch(e){}
    if(doDownload!==false){download(text,jsonFilename());if(typeof toast==='function')toast('JSON backup downloaded');}
    return snap;
  };

  // ── Restore ──
  window.sasRestoreFromJson=function(fileText){
    let obj;
    try{obj=JSON.parse(fileText);}catch(e){if(typeof toast==='function')toast('Not a valid JSON backup file');return;}
    if(!obj || obj._schema!==SCHEMA || !obj.data){if(typeof toast==='function')toast('This does not look like a SASFlow backup');return;}
    const c=obj.counts||{};
    const msg='Restore this backup?\n\nCreated: '+(obj.created_at||'?')+'\nBy: '+(obj.created_by||'?')+
      '\n\nProjects: '+(c.projects||0)+'\nTasks: '+(c.tasks||0)+'\nTo-dos: '+(c.todos||0)+'\nClients: '+(c.clients||0)+'\nMembers: '+(c.members||0)+
      '\n\nThis OVERWRITES current data in Supabase with the backup contents. Records added since this backup was made may be lost. This cannot be undone. Continue?';
    if(!confirm(msg))return;
    if(!confirm('Are you absolutely sure? This will overwrite the live database.'))return;
    doRestore(obj.data);
  };

  async function doRestore(data){
    if(typeof toast==='function')toast('Restoring… do not close this tab');
    let ok=0,fail=0;
    const saveEach=async(arr,fn)=>{for(const it of (arr||[])){try{await fn(it);ok++;}catch(e){fail++;console.warn('restore save failed',e);}}};
    try{
      // Order matters: members & clients first (referenced by tasks/projects).
      if(typeof dbSaveMember==='function')  await saveEach(data.members, m=>dbSaveMember(m));
      if(typeof dbSaveClient==='function')  await saveEach(data.clients, c=>dbSaveClient(c));
      if(typeof dbSaveProject==='function') await saveEach(data.projects,p=>dbSaveProject(p));
      if(typeof dbSaveTask==='function')    await saveEach(data.tasks,   t=>dbSaveTask(t));
      if(typeof dbSaveTodo==='function')    await saveEach(data.todos,   t=>dbSaveTodo(t));
      if(data.settings && typeof dbSaveSetting==='function'){
        if(data.settings.palette)     try{await dbSaveSetting('palette',data.settings.palette);}catch(e){}
        if(data.settings.customViews) try{await dbSaveSetting('custom_views',data.settings.customViews);}catch(e){}
        if(data.settings.nid!=null)   try{await dbSaveSetting('nid',data.settings.nid);}catch(e){}
      }
      if(data.taxJobs && typeof dbSaveSetting==='function'){try{await dbSaveSetting('tax_jobs',data.taxJobs);}catch(e){}}
      try{addLog('Restored backup',ok+' records ('+fail+' failed)','system','');}catch(e){}
      if(typeof toast==='function')toast('Restore complete: '+ok+' records. Reloading…');
      // Reload from DB so the UI reflects restored data.
      setTimeout(async()=>{try{if(typeof dbLoad==='function'){await dbLoad();renderView();updateBadges&&updateBadges();}else{location.reload();}}catch(e){location.reload();}},600);
    }catch(e){
      console.error('Restore failed',e);
      if(typeof toast==='function')toast('Restore hit an error — see console. Some records may be saved.');
    }
  }

  window.sasPickRestoreFile=function(){
    const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
    inp.onchange=e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>window.sasRestoreFromJson(String(rd.result||''));rd.readAsText(f);};
    inp.click();
  };

  // ── daily auto-download (opt-in) ──
  function autoOn(){return localStorage.getItem(AUTO_JSON_KEY)==='true';}
  function maybeDailyJson(){
    if(!autoOn())return;
    let last=0;try{last=Date.parse(localStorage.getItem(LAST_JSON_KEY)||'')||0;}catch(e){}
    if(!last || Date.now()-last>24*60*60*1000){
      try{window.sasCreateJsonBackup(true);}catch(e){console.warn('daily json backup failed',e);}
    }
  }

  // ── inject JSON section into the existing Backup modal ──
  const openOrig=window.sasOpenBackupModal;
  window.sasOpenBackupModal=function(){
    if(typeof openOrig==='function')openOrig.apply(this,arguments);
    setTimeout(()=>{
      const body=document.querySelector('.modal .mbody, .mbody');
      if(!body || body.querySelector('#sas-v54-json-card'))return;
      let last='No JSON backup yet';try{const ts=localStorage.getItem(LAST_JSON_KEY);if(ts)last=ts;}catch(e){}
      const checked=autoOn()?'checked':'';
      const card=document.createElement('div');
      card.className='sas-backup-card';card.id='sas-v54-json-card';
      card.innerHTML=
        '<div style="font-weight:800;margin-bottom:4px">Full backup &amp; restore (JSON)</div>'+
        '<div class="sas-backup-muted">A complete, restorable snapshot of projects, tasks, subtasks, to-dos, clients, members, tax jobs and settings. Unlike the Excel export, this file can be restored back into the app.</div>'+
        '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">'+
          '<button class="btn btn-pri btn-sm" onclick="sasCreateJsonBackup(true)"><i class="ti ti-download"></i>Download JSON backup</button>'+
          '<button class="btn btn-sm" onclick="sasPickRestoreFile()"><i class="ti ti-upload"></i>Restore from JSON…</button>'+
        '</div>'+
        '<label style="display:flex;align-items:center;gap:8px;margin:12px 0 4px"><input type="checkbox" '+checked+' onchange="localStorage.setItem(\''+AUTO_JSON_KEY+'\',this.checked?\'true\':\'false\');toast(this.checked?\'Daily JSON backup on\':\'Daily JSON backup off\')"> Auto-download a JSON backup once per day (when you open the app)</label>'+
        '<div class="sas-backup-muted">Downloads to your computer\u2019s Downloads folder. Keep a few days\u2019 worth; to recover, use \u201cRestore from JSON\u201d.</div>'+
        '<div class="sas-backup-muted" style="margin-top:8px">Latest JSON backup: '+String(last).replace(/[<>]/g,'')+'</div>'+
        '<div class="sas-backup-muted" style="margin-top:10px;border-top:1px solid var(--border);padding-top:8px"><b>App file (HTML):</b> your <code>index.html</code> is backed up automatically by each GitHub commit \u2014 every deploy is a restore point. To roll back the app itself, revert to an earlier commit in the <code>sasflow</code> repo.</div>';
      body.appendChild(card);
    },60);
  };

  // run daily check on load & hourly
  const prevRV=window.renderView;
  if(typeof prevRV==='function' && !prevRV._v54){
    window.renderView=function(){const r=prevRV.apply(this,arguments);try{setTimeout(maybeDailyJson,0);}catch(e){}return r;};
    window.renderView._v54=true;
  }
  setInterval(maybeDailyJson,60*60*1000);
  setTimeout(maybeDailyJson,1500);
})();
</script>

<!-- ══════════════════════════════════════════
     v55: Expand all / Collapse all buttons in list views
     Adds two toolbar buttons to the filter bar of the grouped list views
     (All tasks, Projects, Recurring, Today). They expand/collapse every
     visible project and every task-with-subtasks in one click, using the
     in-scope helpers sasExpandAllV48 / sasCollapseAllV48 added to the V48 block.
══════════════════════════════════════════ -->
<style id="sas-v55-expand-style">
  .sas-expand-btns{display:inline-flex;gap:6px}
  .sas-expand-btns .btn i{font-size:14px}
</style>
<script id="sas-v55-expand-collapse-all">
(function(){
  function mode(){
    const v=(typeof currentView!=='undefined')?currentView:'all';
    return v==='recurring'?'recurring':v==='today'?'today':v==='projects'?'projects':v==='todos'?'todos':'all';
  }
  function inject(){
    // only in the grouped list views that actually have collapsible rows
    const v=(typeof currentView!=='undefined')?currentView:'';
    if(!['tasks','projects','recurring','today'].includes(v))return;
    const fbar=document.querySelector('.fbar');
    if(!fbar || fbar.querySelector('.sas-expand-btns'))return;
    if(typeof window.sasExpandAllV48!=='function')return;
    const m=mode();
    const wrap=document.createElement('span');
    wrap.className='sas-expand-btns';
    wrap.innerHTML=
      '<button class="btn btn-sm" title="Expand all projects & tasks" onclick="sasExpandAllV48(\''+m+'\')"><i class="ti ti-chevrons-down"></i>Expand all</button>'+
      '<button class="btn btn-sm" title="Collapse all projects & tasks" onclick="sasCollapseAllV48(\''+m+'\')"><i class="ti ti-chevrons-up"></i>Collapse all</button>';
    // place right after the "Deselect all" button if present, else at the end
    const btns=[...fbar.querySelectorAll('button')];
    const deselect=btns.find(b=>/deselect/i.test(b.textContent||''));
    if(deselect && deselect.parentElement===fbar){deselect.insertAdjacentElement('afterend',wrap);}
    else {
      // insert before the search box if we can, else append
      const srch=fbar.querySelector('.srch');
      if(srch)fbar.insertBefore(wrap,srch);else fbar.appendChild(wrap);
    }
  }
  const prev=window.renderView;
  if(typeof prev==='function' && !prev._v55){
    window.renderView=function(){const r=prev.apply(this,arguments);try{setTimeout(inject,0);}catch(e){}return r;};
    window.renderView._v55=true;
  }
  try{setTimeout(inject,0);}catch(e){}
})();
</script>

<!-- ══════════════════════════════════════════
     v56: move Questions/Team Notes into its own "Notes" tab
     In the project detail modal the notes panel was rendered after all tab
     bodies, so it showed under every tab (incl. Tasks). This adds a dedicated
     "Notes" tab to both the project and task detail modals and shows the notes
     panel ONLY on that tab. Done via post-render DOM so the big template
     strings are left untouched.
══════════════════════════════════════════ -->
<script id="sas-v56-notes-tab">
(function(){
  // Which modal is open? Returns {kind:'project'|'task', tabVar, curTab, reopen()} or null.
  function detectModal(){
    const modal=document.querySelector('#modal-root .modal');
    if(!modal)return null;
    const tabbar=modal.querySelector('.mhdr')?.nextElementSibling; // the tab strip div
    // project modal is tagged; task modal has a Subtasks tab
    const isProject=modal.classList.contains('sas-v48-project-modal')||modal.classList.contains('sas-project-modal');
    const tabs=[...modal.querySelectorAll('.tab')];
    const hasSubtasks=tabs.some(t=>/subtask/i.test(t.textContent||''));
    if(isProject){
      const pid=(typeof window._v48CurrentProject!=='undefined')?window._v48CurrentProject:null;
      return {kind:'project',modal,tabbar,tabs,cur:(window._projDTab||'tasks'),
        setTab:v=>{window._projDTab=v;closeModal();openProjDetail(pid);}};
    }
    if(hasSubtasks){
      // task modal — recover id from an onclick in the tab bar
      let id=null;
      for(const t of tabs){const m=(t.getAttribute('onclick')||'').match(/openTask\((\d+)\)/);if(m){id=+m[1];break;}}
      return {kind:'task',modal,tabbar,tabs,cur:(window._taskViewTab||'details'),
        setTab:v=>{window._taskViewTab=v;closeModal();openTask(id);}};
    }
    return null;
  }

  function apply(){
    const info=detectModal();
    if(!info)return;
    const {modal,tabs,cur}=info;
    const strip=tabs.length?tabs[0].parentElement:null;
    if(!strip)return;
    const panel=modal.querySelector('.sas-note-panel');

    // 1) add a Notes tab if not already present
    if(!strip.querySelector('.sas-v56-notes-tab')){
      const t=document.createElement('div');
      t.className='tab sas-v56-notes-tab'+(cur==='notes'?' active':'');
      t.textContent='Notes';
      t.onclick=()=>info.setTab('notes');
      strip.appendChild(t);
    }

    // 2) show notes only on the Notes tab; hide it elsewhere
    if(panel){
      if(cur==='notes'){
        panel.style.display='';
        // hide the non-notes body content so only notes show
        [...modal.querySelectorAll('.mbody > *')].forEach(el=>{
          if(el===panel)return;
          if(el.contains(panel))return;
          el.style.display='none';
        });
        // if the panel is nested inside a body wrapper that we just hid, force-show its chain
        let p=panel.parentElement;
        while(p && !p.classList.contains('mbody')){p.style.display='';p=p.parentElement;}
      } else {
        panel.style.display='none';
      }
    } else if(cur==='notes'){
      // Notes tab selected but no panel rendered on this tab: render it ourselves.
      const body=modal.querySelector('.mbody');
      if(body && typeof renderNotesPanel==='function'){
        // hide existing body children, then append the notes panel
        [...body.children].forEach(el=>{el.style.display='none';});
        const holder=document.createElement('div');
        holder.className='sas-v56-notes-holder';
        holder.innerHTML=renderNotesPanel(info.kind, info.kind==='project'?window._v48CurrentProject:currentTaskId(info));
        body.appendChild(holder);
      }
    }
  }

  function currentTaskId(info){
    for(const t of info.tabs){const m=(t.getAttribute('onclick')||'').match(/openTask\((\d+)\)/);if(m)return +m[1];}
    return null;
  }

  // hook the two openers so we re-apply after each (tab clicks reopen the modal)
  ['openProjDetail','openTask'].forEach(fn=>{
    const orig=window[fn];
    if(typeof orig==='function' && !orig._v56){
      window[fn]=function(){const r=orig.apply(this,arguments);try{setTimeout(apply,0);setTimeout(apply,60);}catch(e){}return r;};
      window[fn]._v56=true;
    }
  });
  try{setTimeout(apply,0);}catch(e){}
})();
</script>

<!-- ══════════════════════════════════════════
     v57: compact task Details + subtasks on Details tab (remove Subtasks tab)
     - Tightens the info cards (assignee/status/due/period) so the header area
       is more compact when a task is opened.
     - Renders the subtasks list directly on the Details tab, and hides the
       separate "Subtasks (n)" tab. Uses the same row markup/handlers as the
       old tab (tglSubMod / openSubEdit / delSubMod / openAddSub) so behavior

══════════════════════════════════════════ -->
