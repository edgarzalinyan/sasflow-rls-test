<script id="sas-v57-subtasks-on-details">
(function(){
  function isTaskModal(modal){
    if(!modal)return false;
    // task modal is the one with a Subtasks tab and an "Add subtask" footer action
    return [...modal.querySelectorAll('.tab')].some(t=>/subtask/i.test(t.textContent||''));
  }
  function taskIdFrom(modal){
    for(const t of modal.querySelectorAll('.tab')){const m=(t.getAttribute('onclick')||'').match(/openTask\((\d+)\)/);if(m)return +m[1];}
    // footer edit button also carries it
    const fb=[...modal.querySelectorAll('.mftr button')].map(b=>b.getAttribute('onclick')||'').join(' ');
    const mm=fb.match(/openEditTask\((\d+)\)/)||fb.match(/openAddSub\((\d+)\)/);
    return mm?+mm[1]:null;
  }
  function subRowHTML(t,s){
    const sm=(typeof getMem==='function')?getMem(s.assignee):{initials:'',palId:'blue'};
    const smc=(typeof mc2==='function')?mc2(sm.palId):{bg:'#eee',tc:'#333'};
    const canEdit=(typeof perm!=='function')||perm('edit_task');
    return `<div style="display:flex;align-items:center;gap:8px;padding:9px 11px;border-bottom:1px solid var(--border)">`+
      `<div class="chk ${s.done?'done':''}" onclick="tglSubMod(${t.id},${s.id},this)">${s.done?'<i class="ti ti-check" style="font-size:9px"></i>':''}</div>`+
      `<div style="flex:1;min-width:0"><div style="font-weight:600;${s.done?'text-decoration:line-through;color:var(--text3)':''};overflow:hidden;text-overflow:ellipsis">${(typeof esc==='function'?esc(s.name):s.name)}</div></div>`+
      `<div class="av" style="width:22px;height:22px;background:${smc.bg};color:${smc.tc};font-size:9px">${sm.initials}</div>`+
      (canEdit?`<button class="btn btn-ghost btn-xs" onclick="openSubEdit(${t.id},${s.id})"><i class="ti ti-edit"></i></button><button class="btn btn-ghost btn-xs btn-danger" onclick="delSubMod(${t.id},${s.id})"><i class="ti ti-trash"></i></button>`:'')+
      `</div>`;
  }
  function apply(){
    const modal=document.querySelector('#modal-root .modal');
    if(!modal || !isTaskModal(modal))return;
    modal.classList.add('sas-v57-modal');
    const id=taskIdFrom(modal);
    if(id==null)return;
    const t=(typeof tasks!=='undefined'?tasks:[]).find(x=>x.id===id);
    if(!t)return;

    // which tab is active? only act on Details
    const activeTab=(window._taskViewTab||'details');

    // hide the Subtasks tab in all cases (we've merged it into Details)
    [...modal.querySelectorAll('.tab')].forEach(tab=>{
      if(/^subtasks\b/i.test((tab.textContent||'').trim()))tab.classList.add('sas-v57-hidden-tab');
    });
    // if someone is on the (now hidden) subtasks tab, bounce to details
    if(activeTab==='subtasks'){window._taskViewTab='details';closeModal();openTask(id);return;}

    if(activeTab!=='details')return;              // only inject on Details
    const body=modal.querySelector('.mbody');
    if(!body || body.querySelector('.sas-v57-subs-block'))return;

    const subs=t.subtasks||[];
    const canEdit=(typeof perm!=='function')||perm('edit_task');
    const block=document.createElement('div');
    block.className='sas-v57-subs-block';
    block.innerHTML=
      `<div class="sas-v57-subs-head"><i class="ti ti-list-check" style="font-size:12px"></i>Subtasks (${subs.length})</div>`+
      `<div class="sas-v57-subs-list">${subs.map(s=>subRowHTML(t,s)).join('')||'<div style="padding:12px;color:var(--text3);font-size:13px">No subtasks yet</div>'}</div>`+
      (canEdit?`<button class="btn btn-ghost btn-sm" style="margin-top:8px" onclick="openAddSub(${id})"><i class="ti ti-plus"></i>Add subtask</button>`:'');

    // place the subtasks block right after the info grid (before Notes card if present)
    const grid=body.querySelector('.sas-info-grid');
    const notes=body.querySelector('.sas-notes-card');
    if(notes){notes.parentElement.insertBefore(block,notes);}
    else if(grid){grid.insertAdjacentElement('afterend',block);}
    else{body.appendChild(block);}
  }

  const orig=window.openTask;
  if(typeof orig==='function' && !orig._v57){
    window.openTask=function(){const r=orig.apply(this,arguments);try{setTimeout(apply,0);setTimeout(apply,60);}catch(e){}return r;};
    window.openTask._v57=true;
  }
  try{setTimeout(apply,0);}catch(e){}
})();
</script>

<!-- ══════════════════════════════════════════
     v58: drag-and-drop reordering INSIDE the pop-up modals
     v53 only wired the main list (.content .trow). This adds the same
     reordering inside:
       • Project detail modal → reorder its task rows (.trow with openTask)
       • Task detail modal (Details tab) → reorder the v57 subtask rows
     Reuses v53's persisted movers (sasMoveTaskInProject / sasMoveSubtask),
     then re-opens the modal so the new order is shown. Handles are absolute
     overlays (don't disturb the grid), matching the main-list fix.
══════════════════════════════════════════ -->
<style id="sas-v58-modal-dnd-style">
  .sas-v58-dnd{position:relative}
  .sas-v58-handle{position:absolute;left:-3px;top:50%;transform:translateY(-50%);cursor:grab;display:inline-flex;align-items:center;justify-content:center;width:16px;height:100%;max-height:32px;color:var(--text3,#9a9);opacity:0;z-index:5;border-radius:4px}
  .sas-v58-dnd:hover .sas-v58-handle{opacity:.5}
  .sas-v58-handle:hover{opacity:1!important;background:var(--ledger-lt,#EEF2FB)}
  .sas-v58-handle:active{cursor:grabbing}
  .sas-v58-handle i{font-size:14px;pointer-events:none}
  .sas-v58-dragging{opacity:.4}
  .sas-v58-drop-before{box-shadow:inset 0 3px 0 -1px var(--ledger,#3457C4)}
  .sas-v58-drop-after{box-shadow:inset 0 -3px 0 -1px var(--ledger,#3457C4)}
  /* give modal subtask rows a little left room for the handle */
  .sas-v57-subs-list .sas-v58-dnd{padding-left:14px}
</style>
<script id="sas-v58-modal-drag-drop">
(function(){
  let drag=null; // {kind:'task'|'subtask', id, pid?, tid?}

  function clearMarks(root){(root||document).querySelectorAll('.sas-v58-drop-before,.sas-v58-drop-after').forEach(el=>el.classList.remove('sas-v58-drop-before','sas-v58-drop-after'));}

  function projModal(){const m=document.querySelector('#modal-root .modal');return (m&&(m.classList.contains('sas-v48-project-modal')||m.classList.contains('sas-project-modal')))?m:null;}
  function taskModal(){const m=document.querySelector('#modal-root .modal');if(!m)return null;return [...m.querySelectorAll('.tab')].some(t=>/subtask|details/i.test(t.textContent||''))&&m.querySelector('.sas-v57-subs-list')?m:null;}

  function makeHandle(){const h=document.createElement('span');h.className='sas-v58-handle';h.title='Drag to reorder';h.innerHTML='<i class="ti ti-grip-vertical"></i>';h.setAttribute('draggable','true');return h;}

  // The project modal renders its task list in raw `tasks` array order (it does
  // not sort by sortOrder). So after a reorder we physically sort the live
  // `tasks` array by sortOrder (within project), keeping other projects' tasks
  // where they are, so the reopened modal shows the new order.
  function reflowTasksBySortOrder(){
    try{
      const so=v=>(v!=null&&v!=='')?Number(v):Infinity;
      tasks.sort((a,b)=>{
        const pa=a.project||'', pb=b.project||'';
        if(pa!==pb)return 0; // don't reorder across different projects
        return (so(a.sortOrder)-so(b.sortOrder));
      });
    }catch(e){}
  }
  // A stable full sort: group preserved by project appearance, tasks within a
  // project ordered by sortOrder. Used before reopening the project modal.
  function reflowProjectTasks(pid){
    try{
      const so=v=>(v!=null&&v!=='')?Number(v):Infinity;
      const grp=tasks.filter(t=>t.project===pid).sort((a,b)=>so(a.sortOrder)-so(b.sortOrder));
      const rest=tasks.filter(t=>t.project!==pid);
      // rebuild tasks with the sorted group inserted where the first member was
      const firstIdx=tasks.findIndex(t=>t.project===pid);
      if(firstIdx<0)return;
      const out=[];let placed=false;
      tasks.forEach((t,i)=>{
        if(t.project===pid){ if(!placed){grp.forEach(g=>out.push(g));placed=true;} }
        else out.push(t);
      });
      tasks.length=0;out.forEach(t=>tasks.push(t));
    }catch(e){}
  }

  // ---------- project modal: reorder task rows ----------
  function wireProjectTasks(){
    const modal=projModal();if(!modal)return;
    const pid=(typeof window._v48CurrentProject!=='undefined')?window._v48CurrentProject:null;
    if(!pid)return;
    if((typeof perm==='function')&&!perm('edit_task'))return;
    const rows=[...modal.querySelectorAll('.trow')].filter(r=>/openTask\(\d+\)/.test(r.getAttribute('onclick')||''));
    rows.forEach(row=>{
      if(row.querySelector('.sas-v58-handle'))return;
      const m=(row.getAttribute('onclick')||'').match(/openTask\((\d+)\)/);if(!m)return;
      const tid=+m[1];
      row.classList.add('sas-v58-dnd');
      const h=makeHandle();row.insertBefore(h,row.firstChild);
      h.addEventListener('dragstart',ev=>{ev.stopPropagation();drag={kind:'task',id:tid,pid};row.classList.add('sas-v58-dragging');try{ev.dataTransfer.effectAllowed='move';ev.dataTransfer.setData('text/plain',String(tid));}catch(e){}});
      h.addEventListener('dragend',()=>{row.classList.remove('sas-v58-dragging');clearMarks(modal);drag=null;});
      row.addEventListener('dragover',ev=>{if(!drag||drag.kind!=='task'||drag.pid!==pid)return;ev.preventDefault();const r=row.getBoundingClientRect();const after=r.height>0?((ev.clientY-r.top)>r.height/2):false;clearMarks(modal);row.classList.add(after?'sas-v58-drop-after':'sas-v58-drop-before');});
      row.addEventListener('drop',ev=>{if(!drag||drag.kind!=='task')return;ev.preventDefault();ev.stopPropagation();const r=row.getBoundingClientRect();const after=r.height>0?((ev.clientY-r.top)>r.height/2):false;clearMarks(modal);const tgt=tid;if(drag.pid===pid&&tgt!==drag.id&&typeof window.sasMoveTaskInProject==='function'){const moved=drag.id;drag=null;window.sasMoveTaskInProject(pid,moved,tgt,after);setTimeout(()=>{try{reflowProjectTasks(pid);closeModal();openProjDetail(pid);}catch(e){}},0);}});
    });
  }

  // ---------- task modal: reorder subtask rows (v57 list) ----------
  function wireSubtasks(){
    const modal=taskModal();if(!modal)return;
    if((typeof perm==='function')&&!perm('edit_task'))return;
    // recover task id
    let tid=null;
    for(const t of modal.querySelectorAll('.tab')){const m=(t.getAttribute('onclick')||'').match(/openTask\((\d+)\)/);if(m){tid=+m[1];break;}}
    if(tid==null){const fb=[...modal.querySelectorAll('.mftr button,[onclick]')].map(b=>b.getAttribute('onclick')||'').join(' ');const mm=fb.match(/openEditTask\((\d+)\)/)||fb.match(/openAddSub\((\d+)\)/);tid=mm?+mm[1]:null;}
    if(tid==null)return;
    const list=modal.querySelector('.sas-v57-subs-list');if(!list)return;
    // each subtask row is a direct child div containing a tglSubMod handler
    const rows=[...list.children].filter(el=>el.querySelector&&el.querySelector('[onclick*="tglSubMod"]'));
    rows.forEach(row=>{
      if(row.querySelector('.sas-v58-handle'))return;
      const chk=row.querySelector('[onclick*="tglSubMod"]');
      const mm=(chk.getAttribute('onclick')||'').match(/tglSubMod\((\d+),(\d+)/);if(!mm)return;
      const sid=+mm[2];
      row.classList.add('sas-v58-dnd');
      const h=makeHandle();row.insertBefore(h,row.firstChild);
      h.addEventListener('dragstart',ev=>{ev.stopPropagation();drag={kind:'subtask',id:sid,tid};row.classList.add('sas-v58-dragging');try{ev.dataTransfer.effectAllowed='move';ev.dataTransfer.setData('text/plain',String(sid));}catch(e){}});
      h.addEventListener('dragend',()=>{row.classList.remove('sas-v58-dragging');clearMarks(list);drag=null;});
      row.addEventListener('dragover',ev=>{if(!drag||drag.kind!=='subtask'||drag.tid!==tid)return;ev.preventDefault();const r=row.getBoundingClientRect();const after=r.height>0?((ev.clientY-r.top)>r.height/2):false;clearMarks(list);row.classList.add(after?'sas-v58-drop-after':'sas-v58-drop-before');});
      row.addEventListener('drop',ev=>{if(!drag||drag.kind!=='subtask'||drag.tid!==tid)return;ev.preventDefault();ev.stopPropagation();const r=row.getBoundingClientRect();const after=r.height>0?((ev.clientY-r.top)>r.height/2):false;clearMarks(list);if(sid!==drag.id&&typeof window.sasMoveSubtask==='function'){const moved=drag.id;drag=null;window.sasMoveSubtask(tid,moved,sid,after);setTimeout(()=>{try{window._taskViewTab='details';closeModal();openTask(tid);}catch(e){}},0);}});
    });
  }

  function wireAll(){try{wireProjectTasks();}catch(e){}try{wireSubtasks();}catch(e){}}

  ['openProjDetail','openTask'].forEach(fn=>{
    const orig=window[fn];
    if(typeof orig==='function' && !orig._v58){
      window[fn]=function(){const r=orig.apply(this,arguments);try{setTimeout(wireAll,0);setTimeout(wireAll,80);}catch(e){}return r;};
      window[fn]._v58=true;
    }
  });
  try{setTimeout(wireAll,0);}catch(e){}
})();
</script>

<!-- ══════════════════════════════════════════
     v59: fix task/subtask copy — unique IDs + persistence
     Root cause of "copied task is the wrong one": copyTask/cpySub used ++nid
     for the new id. If nid was stale (it wasn't saved after copies), ++nid
     could collide with an existing id, so openTask()/rows resolved to a
     DIFFERENT existing record. Also copyTask never persisted to Supabase, so
     copies vanished on reload.
     Fix: generate a guaranteed-unique id from the max of ALL live ids, persist
     the copy (dbSaveTask), and save nid. Preserves sortOrder/period/subtasks.
══════════════════════════════════════════ -->
<script id="sas-v59-copy-fix">
(function(){
  // Highest id in use across tasks, all subtasks, and todos → next id is +1.
  function maxLiveId(){
    let mx=0;
    try{(tasks||[]).forEach(t=>{if(+t.id>mx)mx=+t.id;(t.subtasks||[]).forEach(s=>{if(+s.id>mx)mx=+s.id;});});}catch(e){}
    try{(todos||[]).forEach(td=>{if(+td.id>mx)mx=+td.id;});}catch(e){}
    try{if(typeof nid==='number'&&nid>mx)mx=nid;}catch(e){}
    return mx;
  }
  function nextId(){const v=maxLiveId()+1;try{nid=v;}catch(e){}return v;}

  window.copyTask=function(id){
    const t=(tasks||[]).find(x=>x.id===id);
    if(!t){try{toast('Task not found');}catch(e){}return;}
    if(typeof perm==='function'&&!perm('create_task')){try{toast('No permission to copy tasks');}catch(e){}return;}
    const newId=nextId();
    const cp={...t,id:newId,name:t.name+' (copy)',done:false,
      subtasks:(t.subtasks||[]).map(s=>({...s,id:nextId(),done:false}))};
    // a copy is a one-off in its list position; keep project/client/assignee/period,
    // clear recurring-guard flags and give it a fresh sortOrder slot after the source.
    delete cp._v49NextCreated;delete cp._v49NextDue;delete cp._v45NextCreated;delete cp._v46NextCreated;delete cp._nextCreated;
    const srcSO=(t.sortOrder!=null&&t.sortOrder!=='')?Number(t.sortOrder):null;
    cp.sortOrder=(srcSO!=null)?srcSO+1:null; // sits just after the original; reflow renumbers later if needed
    const i=(tasks||[]).findIndex(x=>x.id===id);
    if(i<0)tasks.push(cp);else tasks.splice(i+1,0,cp);
    try{dbSaveTask(cp);dbSaveNid&&dbSaveNid();}catch(e){}
    try{addLog('Copied task',t.name+' → '+cp.name,'task',newId);}catch(e){}
    try{renderView();updateBadges&&updateBadges();}catch(e){}
    try{openTask(newId);}catch(e){}
    try{toast('Task copied');}catch(e){}
  };

  window.cpySub=function(tid,sid){
    const t=(tasks||[]).find(x=>x.id===tid);
    if(!t){try{toast('Task not found');}catch(e){}return;}
    if(typeof perm==='function'&&!perm('edit_task')){try{toast('No permission');}catch(e){}return;}
    const arr=t.subtasks||(t.subtasks=[]);
    const s=arr.find(x=>x.id===sid);
    if(!s){try{toast('Subtask not found');}catch(e){}return;}
    const cp={...s,id:nextId(),name:s.name+' (copy)',done:false};
    const i=arr.findIndex(x=>x.id===sid);
    if(i<0)arr.push(cp);else arr.splice(i+1,0,cp);
    try{dbSaveTask(t);dbSaveNid&&dbSaveNid();}catch(e){}
    try{addLog('Copied subtask',s.name+' → '+cp.name,'subtask',cp.id,tid);}catch(e){}
    try{renderView();updateBadges&&updateBadges();}catch(e){}
    try{toast('Subtask copied');}catch(e){}
  };
})();
</script>

<!-- ══════════════════════════════════════════
     v60: project/task modal — wider to fit rows + working expand chevron
     (1) The base modal is 580px, but the task/subtask rows use the 8-column
         list grid (~510px of fixed columns + name), so the right-most columns
         (Period/Who/Select) spilled past the modal edge. Widen the project &
         task detail modals on desktop and let the body scroll cleanly.
     (2) tglExp toggled expanded[id] then called renderView(), which re-rendered
         the list BEHIND the modal but not the modal itself, so the subtask
         chevron looked dead inside the pop-up. Now, if a project/task modal is
         open, we re-open it after toggling so subtasks expand/collapse in place.
══════════════════════════════════════════ -->
<style id="sas-v60-modal-fit">
  /* Desktop: give the project & task detail modals room for the row grid. */
  @media(min-width:900px){
    #modal-root .modal.sas-v48-project-modal,
    #modal-root .modal.sas-project-modal,
    #modal-root .modal.sas-v57-modal{
      width:min(1080px, calc(100vw - 60px))!important;
      max-width:min(1080px, calc(100vw - 60px))!important;
    }
  }
  /* Let the body scroll vertically; prevent horizontal spill of the grid rows. */
  #modal-root .modal.sas-v48-project-modal .mbody,
  #modal-root .modal.sas-project-modal .mbody,
  #modal-root .modal.sas-v57-modal .mbody{overflow-x:auto}
  /* Rows inside these modals shouldn't force their fixed min widths past the edge:
     let the flexible name column shrink and keep the row within the modal. */
  #modal-root .modal.sas-v48-project-modal .trow.gcols,
  #modal-root .modal.sas-project-modal .trow.gcols{min-width:0}
  /* subtasks list block inside task modal: keep within padding */
  #modal-root .modal.sas-v57-modal .sas-v57-subs-list{max-width:100%}
</style>
<script id="sas-v60-modal-expand-fix">
(function(){
  // Re-open whichever detail modal is open, preserving its tab.
  function reopenOpenModal(){
    const modal=document.querySelector('#modal-root .modal');
    if(!modal)return false;
    const isProject=modal.classList.contains('sas-v48-project-modal')||modal.classList.contains('sas-project-modal');
    if(isProject){
      const pid=(typeof window._v48CurrentProject!=='undefined')?window._v48CurrentProject:null;
      if(pid!=null && typeof openProjDetail==='function'){closeModal();openProjDetail(pid);return true;}
    }
    // task modal (has a Details tab and our subtasks block or a subtasks tab)
    const isTask=[...modal.querySelectorAll('.tab')].some(t=>/details/i.test(t.textContent||''))&&
                 ([...modal.querySelectorAll('.tab')].some(t=>/subtask/i.test(t.textContent||''))||modal.querySelector('.sas-v57-subs-list'));
    if(isTask){
      let id=null;
      for(const t of modal.querySelectorAll('.tab')){const m=(t.getAttribute('onclick')||'').match(/openTask\((\d+)\)/);if(m){id=+m[1];break;}}
      if(id!=null && typeof openTask==='function'){closeModal();openTask(id);return true;}
    }
    return false;
  }

  const origTglExp=window.tglExp;
  if(typeof origTglExp==='function' && !origTglExp._v60){
    window.tglExp=function(e,id){
      try{if(e&&e.stopPropagation)e.stopPropagation();}catch(_){}
      try{expanded[id]=!expanded[id];}catch(_){}
      // If a detail modal is open, re-render IT (the base fn only re-renders the list behind it).
      if(!reopenOpenModal()){
        try{renderView();}catch(_){}
      }
    };
    window.tglExp._v60=true;
  }
})();
</script>

<!-- ══════════════════════════════════════════
     v63: Deleted Items (undelete / recycle bin), Supabase-synced
     - Captures a full snapshot of any deleted task, subtask, project, to-do,
       client, or member into a `deleted_items` table BEFORE the delete hits
       Supabase, by wrapping the app-level delete functions (which have the full
       record in scope — dbDelete* only get an id).
     - Adds a "Deleted Items" sidebar page + view. Each user sees their OWN
       deleted items; admins see everyone's. Restore re-saves the record
       (subtasks go back onto their parent task) and removes the bin row.
     REQUIRES the deleted_items table (see deleted_items_migration.sql).
══════════════════════════════════════════ -->
<script id="sas-v63-deleted-items">
(function(){
  function sb(){try{return getSB();}catch(e){return null;}}
  function meId(){try{return currentUser?currentUser.id:'';}catch(e){return '';}}
  function meName(){try{return currentUser?currentUser.name:'';}catch(e){return '';}}
  function admin(){try{return isAdmin();}catch(e){return false;}}
  function newBinId(){return 'del'+Date.now()+Math.floor(Math.random()*100000);}

  // In-memory cache of the recycle bin (loaded from Supabase).
  window.sasDeletedItems=window.sasDeletedItems||[];

  // ---- record a deletion (snapshot → Supabase + cache) ----
  window.sasRecordDeletion=async function(type,item,parentId,displayName){
    if(!item)return;
    const rec={
      id:newBinId(),
      item_type:type,
      item_id:String(item.id!=null?item.id:''),
      item_name:displayName||item.name||'(unnamed)',
      snapshot:item,
      parent_id:parentId!=null?String(parentId):null,
      deleted_by:meId(),
      deleted_by_name:meName(),
      deleted_at:new Date().toISOString()
    };
    // optimistic cache (so the page shows it immediately)
    window.sasDeletedItems.unshift(rec);
    try{
      const client=sb();
      if(client){await client.from('deleted_items').insert({
        id:rec.id,item_type:rec.item_type,item_id:rec.item_id,item_name:rec.item_name,
        snapshot:rec.snapshot,parent_id:rec.parent_id,deleted_by:rec.deleted_by,
        deleted_by_name:rec.deleted_by_name,deleted_at:rec.deleted_at
      });}
    }catch(e){console.warn('record deletion failed',e);}
  };

  // ---- load recycle bin from Supabase ----
  window.sasLoadDeleted=async function(){
    try{
      const client=sb();if(!client)return;
      let q=client.from('deleted_items').select('*').order('deleted_at',{ascending:false}).limit(500);
      if(!admin()) q=q.eq('deleted_by',meId());
      const {data}=await q;
      if(data){
        window.sasDeletedItems=data.map(r=>({
          id:r.id,item_type:r.item_type,item_id:r.item_id,item_name:r.item_name,
          snapshot:r.snapshot,parent_id:r.parent_id,deleted_by:r.deleted_by,
          deleted_by_name:r.deleted_by_name,deleted_at:r.deleted_at
        }));
      }
    }catch(e){console.warn('load deleted failed',e);}
  };

  // ---- wrap the app-level delete functions to snapshot before deleting ----
  // Each wrapper captures the record, then calls the original. We capture from a
  // fresh lookup so we get the object exactly as it was.
  function wrapTaskDelete(fnName){
    const orig=window[fnName];
    if(typeof orig!=='function'||orig._v63)return;
    window[fnName]=function(){
      // task id is the last numeric arg in these handlers
      let id=null;for(let i=arguments.length-1;i>=0;i--){if(typeof arguments[i]==='number'){id=arguments[i];break;}}
      const t=(typeof tasks!=='undefined'?tasks:[]).find(x=>x.id===id);
      const r=orig.apply(this,arguments);
      // only record if the delete actually happened (task now gone)
      if(t && !(typeof tasks!=='undefined'?tasks:[]).some(x=>x.id===id)){
        window.sasRecordDeletion('task',JSON.parse(JSON.stringify(t)),null,t.name);
      }
      return r;
    };
    window[fnName]._v63=true;
  }
  ['delTaskInline','delTaskModal'].forEach(wrapTaskDelete);

  function wrapSubDelete(fnName){
    const orig=window[fnName];
    if(typeof orig!=='function'||orig._v63)return;
    window[fnName]=function(){
      // signatures: delSub(e,tid,sid) | delSubMod(tid,sid) | delSubEdit(tid,sid)
      let tid=null,sid=null;
      const nums=[...arguments].filter(a=>typeof a==='number');
      if(nums.length>=2){tid=nums[0];sid=nums[1];}
      const t=(typeof tasks!=='undefined'?tasks:[]).find(x=>x.id===tid);
      const s=t&&(t.subtasks||[]).find(x=>x.id===sid);
      const snap=s?JSON.parse(JSON.stringify(s)):null;
      const r=orig.apply(this,arguments);
      const stillThere=t&&(t.subtasks||[]).some(x=>x.id===sid);
      if(snap && !stillThere){window.sasRecordDeletion('subtask',snap,tid,snap.name);}
      return r;
    };
    window[fnName]._v63=true;
  }
  ['delSub','delSubMod','delSubEdit'].forEach(wrapSubDelete);

  function collArr(name){
    try{ if(name==='projects')return projects; if(name==='todos')return todos; if(name==='clients')return clients; if(name==='members')return members; }catch(e){}
    return [];
  }
  function wrapById(fnName,type,coll,getName){
    const orig=window[fnName];
    if(typeof orig!=='function'||orig._v63)return;
    window[fnName]=function(){
      // id is first string/number arg for delProj/rmCli/rmMem; for deleteTodo/delTodoModal it's the numeric arg
      let id=null;
      for(const a of arguments){if(typeof a==='string'||typeof a==='number'){id=a;break;}}
      // deleteTodo signature is (e,id): pick the non-event arg
      if(arguments.length>=2 && (typeof arguments[0]==='object')){for(let i=1;i<arguments.length;i++){if(typeof arguments[i]!=='object'){id=arguments[i];break;}}}
      const before=collArr(coll).find(x=>x.id==id);
      const snap=before?JSON.parse(JSON.stringify(before)):null;
      const r=orig.apply(this,arguments);
      if(snap && !collArr(coll).some(x=>x.id==id)){window.sasRecordDeletion(type,snap,null,getName?getName(snap):snap.name);}
      return r;
    };
    window[fnName]._v63=true;
  }
  wrapById('delProj','project','projects');
  wrapById('deleteTodo','todo','todos');
  wrapById('delTodoModal','todo','todos');
  wrapById('rmCli','client','clients');
  wrapById('rmMem','member','members',m=>m.name);

  // bulk delete: wrap to snapshot each removed item
  (function(){
    const orig=window.bulkDelete;
    if(typeof orig==='function' && !orig._v63){
      window.bulkDelete=function(){
        let items=[];try{items=selectedItems();}catch(e){}
        // snapshot candidates BEFORE deletion
        const snaps=items.map(it=>{
          if(it.type==='project'){const p=projects.find(x=>x.id==it.id);return p?{type:'project',snap:JSON.parse(JSON.stringify(p)),parent:null}:null;}
          if(it.type==='task'){const t=tasks.find(x=>x.id==it.id);return t?{type:'task',snap:JSON.parse(JSON.stringify(t)),parent:null}:null;}
          if(it.type==='subtask'){const t=tasks.find(x=>(x.subtasks||[]).some(s=>s.id==it.id));const s=t&&t.subtasks.find(x=>x.id==it.id);return s?{type:'subtask',snap:JSON.parse(JSON.stringify(s)),parent:t.id}:null;}
          if(it.type==='todo'){const td=todos.find(x=>x.id==it.id);return td?{type:'todo',snap:JSON.parse(JSON.stringify(td)),parent:null}:null;}
          return null;
        }).filter(Boolean);
        const r=orig.apply(this,arguments);
        // if user confirmed (items gone), record them
        snaps.forEach(o=>{
          const gone = o.type==='subtask'
            ? !(tasks.find(t=>t.id==o.parent)||{subtasks:[]}).subtasks.some(s=>s.id==o.snap.id)
            : !( (o.type==='project'?projects:o.type==='task'?tasks:todos).some(x=>x.id==o.snap.id) );
          if(gone) window.sasRecordDeletion(o.type,o.snap,o.parent,o.snap.name);
        });
        return r;
      };
      window.bulkDelete._v63=true;
    }
  })();

  // ---- restore an item ----
  window.sasRestoreDeleted=async function(binId){
    const rec=window.sasDeletedItems.find(x=>x.id===binId);
    if(!rec){try{toast('Item not found');}catch(e){}return;}
    const s=rec.snapshot;
    try{
      if(rec.item_type==='task'){
        if(!tasks.some(x=>x.id===s.id))tasks.push(s);
        dbSaveTask(s);
      } else if(rec.item_type==='subtask'){
        const t=tasks.find(x=>x.id==rec.parent_id);
        if(!t){toast('Parent task no longer exists — cannot restore subtask');return;}
        t.subtasks=t.subtasks||[];
        if(!t.subtasks.some(x=>x.id===s.id))t.subtasks.push(s);
        dbSaveTask(t);
      } else if(rec.item_type==='project'){
        if(!projects.some(x=>x.id===s.id))projects.push(s);
        dbSaveProject(s);
      } else if(rec.item_type==='todo'){
        if(!todos.some(x=>x.id===s.id))todos.push(s);
        dbSaveTodo(s);
      } else if(rec.item_type==='client'){
        if(!clients.some(x=>x.id===s.id))clients.push(s);
        dbSaveClient(s);
      } else if(rec.item_type==='member'){
        if(!members.some(x=>x.id===s.id))members.push(s);
        dbSaveMember(s);
      }
      // remove from bin
      window.sasDeletedItems=window.sasDeletedItems.filter(x=>x.id!==binId);
      try{const client=sb();if(client)await client.from('deleted_items').delete().eq('id',binId);}catch(e){}
      try{addLog('Restored '+rec.item_type,rec.item_name,rec.item_type,s.id);}catch(e){}
      try{renderView();updateBadges&&updateBadges();renderMemNav&&renderMemNav();}catch(e){}
      try{toast('Restored: '+rec.item_name);}catch(e){}
    }catch(e){console.error('restore failed',e);try{toast('Restore failed — see console');}catch(_){}}
  };

  // permanently remove a bin entry (does NOT restore)
  window.sasPurgeDeleted=async function(binId){
    if(!confirm('Permanently remove this item from Deleted Items? It cannot be restored afterward.'))return;
    window.sasDeletedItems=window.sasDeletedItems.filter(x=>x.id!==binId);
    try{const client=sb();if(client)await client.from('deleted_items').delete().eq('id',binId);}catch(e){}
    try{renderView();}catch(e){}
    try{toast('Removed permanently');}catch(e){}
  };

  // ---- the Deleted Items view ----
  const typeLabel={task:'Task',subtask:'Subtask',project:'Project',todo:'To-do',client:'Client',member:'Team member'};
  const typeIcon={task:'ti-list',subtask:'ti-subtask',project:'ti-folder',todo:'ti-circle-check',client:'ti-building',member:'ti-user'};
  function fmtWhen(iso){try{const d=new Date(iso);return d.toLocaleString();}catch(e){return iso;}}

  window.renderDeletedItems=function(mc){
    const isAdm=admin();
    const list=window.sasDeletedItems||[];
    let rows=list.map(r=>{
      const who=isAdm?`<td style="color:var(--text2)">${(r.deleted_by_name||'—')}</td>`:'';
      return `<tr>
        <td><i class="ti ${typeIcon[r.item_type]||'ti-file'}" style="opacity:.6;margin-right:6px"></i>${typeLabel[r.item_type]||r.item_type}</td>
        <td style="font-weight:600">${(r.item_name||'').replace(/[<>]/g,'')}</td>
        ${who}
        <td style="color:var(--text2);white-space:nowrap">${fmtWhen(r.deleted_at)}</td>
        <td style="text-align:right;white-space:nowrap">
          <button class="btn btn-sm btn-pri" onclick="sasRestoreDeleted('${r.id}')"><i class="ti ti-arrow-back-up"></i>Restore</button>
          <button class="btn btn-sm btn-ghost btn-danger" title="Remove permanently" onclick="sasPurgeDeleted('${r.id}')"><i class="ti ti-trash"></i></button>
        </td>
      </tr>`;
    }).join('');
    if(!list.length) rows=`<tr><td colspan="${isAdm?5:4}" style="text-align:center;color:var(--text3);padding:28px">No deleted items${isAdm?'':' — items you delete will appear here so you can restore them'}.</td></tr>`;
    mc.innerHTML=`
      <div class="card">
        <div class="card-hdr" style="display:flex;align-items:center;justify-content:space-between">
          <div><h2 style="margin:0">Deleted Items</h2>
          <div style="color:var(--text2);font-size:13px;margin-top:2px">${isAdm?'Showing deleted items for the whole team.':'Items you\u2019ve deleted. Restore anything you removed by mistake.'}</div></div>
          <button class="btn btn-sm" onclick="(async()=>{await sasLoadDeleted();renderView();})()"><i class="ti ti-refresh"></i>Refresh</button>
        </div>
        <div style="overflow-x:auto">
        <table class="tbl" style="width:100%;border-collapse:collapse">
          <thead><tr style="text-align:left;border-bottom:1px solid var(--border)">
            <th style="padding:8px">Type</th><th style="padding:8px">Name</th>
            ${isAdm?'<th style="padding:8px">Deleted by</th>':''}
            <th style="padding:8px">Deleted</th><th style="padding:8px;text-align:right">Actions</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
        </div>
      </div>`;
  };

  // ---- hook into the view router + sidebar ----
  const origRender=window.renderView;
  if(typeof origRender==='function' && !origRender._v63){
    window.renderView=function(){
      if(typeof currentView!=='undefined' && currentView==='deleted' && !detailType){
        const mc=document.getElementById('main-content');
        // load fresh then render
        window.sasLoadDeleted().then(()=>window.renderDeletedItems(mc));
        // render immediately from cache too (so it's not blank)
        window.renderDeletedItems(mc);
        return;
      }
      return origRender.apply(this,arguments);
    };
    window.renderView._v63=true;
  }

  // add the sidebar entry (after Audit log if present, else at end of nav)
  function addNav(){
    const nav=document.querySelector('.sidebar .nav#nav-log')||document.querySelector('.sidebar');
    if(!nav)return;
    if(document.getElementById('nav-deleted'))return;
    const el=document.createElement('div');
    el.className='nav';el.id='nav-deleted';el.setAttribute('title','Deleted Items');
    el.setAttribute('onclick',"gv('deleted',this)");
    el.innerHTML='<i class="ti ti-trash"></i><span class="sb-lbl">Deleted Items</span>';
    const logNav=document.getElementById('nav-log');
    if(logNav && logNav.parentElement){logNav.insertAdjacentElement('afterend',el);}
    else{const sb=document.querySelector('.sidebar');if(sb)sb.appendChild(el);}
  }
  // nav may re-render; keep trying on renderView
  const origRV2=window.renderView;
  window.renderView=function(){const r=origRV2.apply(this,arguments);try{setTimeout(addNav,0);}catch(e){}return r;};
  try{setTimeout(addNav,300);}catch(e){}
  // preload the bin once on startup
  try{setTimeout(()=>{window.sasLoadDeleted();},1500);}catch(e){}
})();
</script>

<!-- ══════════════════════════════════════════
     v65: owner-based GRANT access (folded into Tasks/Projects/To-dos dropdowns)
     - access.tasks==='people'  → see own tasks + tasks whose assignee ∈ visMembers.tasks
     - access.visMembers.projects → see own projects + projects owned by those people
     - access.visMembers.todos    → see own to-dos + to-dos assigned to those people
     - access.visMembers.subtasks → within visible tasks, also reveal those people's subtasks
     - GRANTS (OR): adds visibility on top of the base rules and overrides the
       view_others_work role gate. Client scope is still respected: a granted
       item that belongs to a client the user can't see stays hidden.
     - Admins bypass. Never mutates stored data.
══════════════════════════════════════════ -->
<script id="sas-v65-owner-grant-access">
(function(){
  function admin(){return (typeof isAdmin==='function')&&isAdmin();}
  function meId(){return (typeof currentUser!=='undefined'&&currentUser)?currentUser.id:'';}
  function acc(){try{return (typeof getAcc==='function')?getAcc():null;}catch(e){return null;}}
  function grantSet(type){
    const a=acc(); if(!a||!a.visMembers)return null;
    const arr=a.visMembers[type];
    if(!Array.isArray(arr)||!arr.length)return null;
    return new Set(arr.map(String));
  }
  // Does the viewer's client scope permit this client id? Empty client = ok.
  function cliOk(cid){ if(!cid)return true; try{return (typeof canSeeCli==='function')?canSeeCli(cid):true;}catch(e){return true;} }

  // ---- Task ----
  if(typeof window.canSeeTask==='function' && !window.canSeeTask._v65){
    const base=window.canSeeTask;
    window.canSeeTask=function(t){
      if(base.apply(this,arguments))return true;
      if(admin())return true;
      if(!t)return false;
      const set=grantSet('tasks'); if(!set)return false;
      const owner=String(t.assignee||'');
      if(!owner)return false;
      if(owner!==String(meId()) && !set.has(owner))return false;
      // respect client scope for the granted item
      const cid=t.client||((typeof getProj==='function'?getProj(t.project):{}).client)||'';
      return cliOk(cid);
    };
    window.canSeeTask._v65=true;
  }

  // ---- To-do ----
  if(typeof window.canSeeTodo==='function' && !window.canSeeTodo._v65){
    const base=window.canSeeTodo;
    window.canSeeTodo=function(td){
      if(base.apply(this,arguments))return true;
      if(admin())return true;
      if(!td)return false;
      const set=grantSet('todos'); if(!set)return false;
      const owner=String(td.assignee||'');
      if(!owner)return false;
      if(owner!==String(meId()) && !set.has(owner))return false;
      return cliOk(td.client||'');
    };
    window.canSeeTodo._v65=true;
  }

  // ---- Project (single) ----
  if(typeof window.canSeeProj==='function' && !window.canSeeProj._v65){
    const base=window.canSeeProj;
    window.canSeeProj=function(id){
      if(base.apply(this,arguments))return true;
      if(admin())return true;
      const set=grantSet('projects'); if(!set)return false;
      const p=(typeof getProj==='function')?getProj(id):null;
      const owner=String((p&&p.assignee)||'');
      if(!owner)return false;
      if(owner!==String(meId()) && !set.has(owner))return false;
      return cliOk((p&&p.client)||'');
    };
    window.canSeeProj._v65=true;
  }

  // ---- Project list (visProj) ----
  if(typeof window.visProj==='function' && !window.visProj._v65){
    const base=window.visProj;
    window.visProj=function(){
      const list=base.apply(this,arguments)||[];
      if(admin())return list;
      const set=grantSet('projects'); if(!set)return list;
      const me=String(meId());
      const seen=new Set(list.map(p=>p.id));
      const extra=(projects||[]).filter(p=>{
        if(seen.has(p.id))return false;
        const owner=String(p.assignee||'');
        if(!owner)return false;
        if(owner!==me && !set.has(owner))return false;
        return cliOk(p.client||'');
      });
      return list.concat(extra);
    };
    window.visProj._v65=true;
  }

  // ---- Subtask display filter (extends v52) ----
  if(typeof window.sasVisibleSubs==='function' && !window.sasVisibleSubs._v65){
    const base=window.sasVisibleSubs;
    window.sasVisibleSubs=function(task){
      const baseSubs=base.apply(this,arguments)||[];
      if(admin())return baseSubs;
      const set=grantSet('subtasks'); if(!set)return baseSubs;
      const me=String(meId());
      const all=(task&&Array.isArray(task.subtasks))?task.subtasks:[];
      // Union of base-visible subtasks and those owned by granted people.
      const keep=new Set(baseSubs);
      const out=[];
      all.forEach(s=>{
        if(keep.has(s)){out.push(s);return;}
        const o=String((s&&s.assignee)||'');
        if(o && (o===me || set.has(o)))out.push(s);
      });
      return out;
    };
    window.sasVisibleSubs._v65=true;
  }
})();
</script>
