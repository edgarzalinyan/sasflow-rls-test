<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Signature AS — Task Manager</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap');
:root{
  --bg:#fff;--bg2:#f7f7f5;--bg3:#eeede8;
  --text:#1a1a18;--text2:#5a5955;--text3:#9a9890;
  --border:rgba(0,0,0,.09);--border2:rgba(0,0,0,.16);
  --blue-bg:#E6F1FB;--blue-tc:#0C447C;
  --green-bg:#EAF3DE;--green-tc:#27500A;
  --amber-bg:#FAEEDA;--amber-tc:#633806;
  --pink-bg:#FBEAF0;--pink-tc:#72243E;
  --purple-bg:#EEEDFE;--purple-tc:#3C3489;
  --teal-bg:#E1F5EE;--teal-tc:#085041;
  --red-bg:#FCEBEB;--red-tc:#791F1F;
  --success:#166534;--success-bg:#dcfce7;
  --danger:#991b1b;--danger-bg:#fee2e2;
  --warn:#92400e;--warn-bg:#fef3c7;
  --info:#1e40af;--info-bg:#dbeafe;
  --radius:8px;--radius-lg:12px;
  --font:'DM Sans',system-ui,sans-serif;
  --fs-base:15px;--fs-sm:13.5px;--fs-xs:12.5px;--fs-xxs:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg3);color:var(--text);font-size:var(--fs-base);line-height:1.55}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:9px}
::-webkit-scrollbar-track{background:transparent}

.app{display:flex;height:100vh;overflow:hidden}

/* ── Sidebar ── */
.sidebar{width:216px;min-width:216px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s,min-width .2s;overflow:hidden}
.sidebar.col{width:52px;min-width:52px}
.sb-top{padding:13px 13px 9px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-shrink:0}
.sb-nm{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.sb-rl{font-size:12px;color:var(--text3)}
.sb-lbl{white-space:nowrap;overflow:hidden}
.sidebar.col .sb-lbl,.sidebar.col .sb-nm,.sidebar.col .sb-rl,.sidebar.col .sb-sec,
.sidebar.col .nbadge,.sidebar.col .sb-ftxt{display:none!important}
.sidebar.col .sb-top{justify-content:center;padding:12px 0}
.sidebar.col .nav{justify-content:center;padding:8px 0}
.sidebar.col .nav i{font-size:19px}
.sidebar.col .sb-foot{padding:8px 0}
.sidebar.col .sb-foot .btn{width:38px;height:38px;padding:0;justify-content:center}
.sb-sec{padding:9px 13px 3px;font-size:11.5px;font-weight:600;letter-spacing:.06em;color:var(--text3);text-transform:uppercase}
.nav{display:flex;align-items:center;gap:8px;padding:7px 13px;font-size:13.5px;cursor:pointer;color:var(--text2);user-select:none}
.nav:hover{background:rgba(0,0,0,.04);color:var(--text)}
.nav.active{background:var(--bg);color:var(--text);font-weight:500;border-right:2px solid var(--text)}
.nav i{font-size:16px;flex-shrink:0}
.nbadge{margin-left:auto;font-size:11px;background:var(--blue-bg);color:var(--blue-tc);padding:1px 6px;border-radius:9px;font-weight:600}
.sb-foot{margin-top:auto;border-top:1px solid var(--border);padding:9px 11px;display:flex;flex-direction:column;gap:5px;flex-shrink:0}
#sb-tog{border:none;background:none;cursor:pointer;color:var(--text2);padding:2px 3px;border-radius:5px;flex-shrink:0}
#sb-tog:hover{background:rgba(0,0,0,.07)}

/* ── Main ── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.topbar{display:flex;align-items:center;gap:8px;padding:12px 20px;border-bottom:1px solid var(--border);flex-shrink:0}
.tbtitle{font-size:16px;font-weight:600;flex:1}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;font-size:var(--fs-sm);border:1px solid var(--border2);border-radius:var(--radius);cursor:pointer;background:var(--bg);color:var(--text);font-family:var(--font);white-space:nowrap;font-weight:500;line-height:1.4}
.btn:hover{background:var(--bg2)}.btn:active{transform:scale(.98)}
.btn-pri{background:var(--text);color:var(--bg);border-color:var(--text)}.btn-pri:hover{opacity:.85}
.btn-sm{padding:5px 10px;font-size:var(--fs-xs)}
.btn-xs{padding:3px 7px;font-size:12px}
.btn-danger{color:var(--danger);border-color:rgba(153,27,27,.28)}.btn-danger:hover{background:var(--danger-bg)}
.btn-ghost{border-color:transparent;background:transparent}.btn-ghost:hover{background:var(--bg2);border-color:var(--border)}

/* ── Filter bar ── */
.fbar{display:flex;align-items:center;gap:6px;padding:9px 20px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--bg2);flex-wrap:wrap}
.fpill{font-size:var(--fs-xs);padding:4px 11px;border:1px solid var(--border);border-radius:99px;cursor:pointer;background:transparent;color:var(--text2);font-family:var(--font);font-weight:500}
.fpill:hover,.fpill.on{background:var(--bg);color:var(--text);border-color:var(--border2)}
.fsel{font-size:var(--fs-xs);padding:4px 8px;border:1px solid var(--border);border-radius:99px;background:transparent;color:var(--text2);font-family:var(--font);cursor:pointer}
.fsel:focus{outline:none;border-color:var(--border2)}
.srch{position:relative;margin-left:auto}
.srch i{position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--text3);pointer-events:none}
.srch input{padding:5px 10px 5px 27px;font-size:var(--fs-xs);border:1px solid var(--border);border-radius:99px;background:var(--bg);color:var(--text);font-family:var(--font);width:165px;transition:width .2s}
.srch input:focus{outline:none;border-color:var(--border2);width:200px}

/* ── Table ── */
.content{flex:1;overflow-y:auto}
.tbl-hd{display:grid;gap:6px;padding:7px 20px;font-size:11.5px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border);background:var(--bg2);position:sticky;top:0;z-index:2}
.tbl-hd span{cursor:pointer;display:flex;align-items:center;gap:3px;user-select:none}
.tbl-hd span:hover,.tbl-hd span.sorted{color:var(--text)}
.trow{display:grid;gap:6px;padding:9px 20px;border-bottom:1px solid var(--border);cursor:pointer;background:var(--bg);align-items:center;font-size:var(--fs-sm)}
.trow:hover{background:var(--bg2)}
.trow.sub{padding-left:48px;background:var(--bg2)}.trow.sub:hover{background:var(--bg3)}
.trow.dim{opacity:.52}
.trow.ghdr{background:var(--bg2);cursor:default;padding:6px 20px;font-size:12px}
.gcols{grid-template-columns:18px minmax(0,1fr) 92px 82px 70px 90px 70px 90px}
.chk{width:16px;height:16px;border:1.5px solid var(--border2);border-radius:3px;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;background:var(--bg)}
.chk.done{background:var(--success);border-color:var(--success)}
.chk.done i{font-size:10px;color:#fff}
.tname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px;min-width:0}
.tname.done{text-decoration:line-through;color:var(--text3)}
.tag{font-size:11.5px;padding:2px 8px;border-radius:99px;white-space:nowrap;flex-shrink:0;font-weight:500}
.tdue{font-size:var(--fs-xs);color:var(--text2)}.tdue.late{color:var(--danger);font-weight:600}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:600}
.racts{display:flex;align-items:center;gap:3px;opacity:0;transition:opacity .15s}
.trow:hover .racts{opacity:1}
.sub-ctr{font-size:10.5px;padding:1px 5px;border-radius:99px;background:var(--bg3);color:var(--text3);font-weight:600}

/* ── Stats ── */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:14px 20px;border-bottom:1px solid var(--border);flex-shrink:0}
.stat{background:var(--bg2);border-radius:var(--radius);padding:12px 14px}
.stat-lbl{font-size:12px;color:var(--text2);margin-bottom:2px;font-weight:500}
.stat-val{font-size:26px;font-weight:600}

/* ── Modal ── */
.mwrap{position:fixed;inset:0;background:rgba(0,0,0,.44);display:flex;align-items:flex-start;justify-content:center;padding-top:36px;z-index:100}
.modal{background:var(--bg);border:1px solid var(--border2);border-radius:var(--radius-lg);width:580px;max-height:640px;overflow-y:auto;box-shadow:0 24px 64px rgba(0,0,0,.14)}
.modal.wide{width:700px}
.mhdr{display:flex;align-items:center;justify-content:space-between;padding:16px 22px 12px;border-bottom:1px solid var(--border)}
.mhdr h2{font-size:16px;font-weight:600}
.mbody{padding:16px 22px}
.mftr{padding:12px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:7px;align-items:center}
.fl{margin-bottom:13px}
.fl label,.fl-lbl{font-size:12px;font-weight:600;color:var(--text2);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
.fi{width:100%;padding:8px 11px;font-size:var(--fs-sm);border:1px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);font-family:var(--font)}
.fi:focus{outline:none;border-color:#555}
.gr2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:13px}
.gr3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:13px}
.ro{font-size:var(--fs-xs);padding:5px 11px;border:1px solid var(--border);border-radius:99px;cursor:pointer;background:transparent;color:var(--text2);font-family:var(--font);font-weight:500}
.ro.on{background:var(--text);color:var(--bg);border-color:var(--text)}

/* ── Switches ── */
.sw-track{width:38px;height:22px;border-radius:99px;display:flex;align-items:center;padding:2px;border:none;cursor:pointer;transition:background .2s;flex-shrink:0}
.sw-track.on{background:#185FA5}.sw-track.off{background:#ccc}
.sw-knob{width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s;pointer-events:none}
.sw-track.on .sw-knob{transform:translateX(16px)}
.sw-track.off .sw-knob{transform:translateX(0)}
.perm-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)}
.perm-row:last-child{border-bottom:none}

/* ── Card / client ── */
.card{border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:10px;overflow:hidden}
.card-hdr{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--bg2)}

/* ── History / audit ── */
.hrow{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:var(--fs-sm)}
.hrow:last-child{border-bottom:none}
.htag{font-size:11px;padding:2px 8px;border-radius:4px;font-weight:500;white-space:nowrap}

/* ── Colors ── */
.cswatch{width:30px;height:30px;border-radius:6px;cursor:pointer;border:2px solid transparent;flex-shrink:0;transition:transform .1s}
.cswatch:hover{transform:scale(1.15)}.cswatch.sel{border-color:var(--text);transform:scale(1.1)}

/* ── Progress ── */
.pgbar{height:4px;background:var(--border);border-radius:99px;overflow:hidden}
.pgfill{height:100%;background:#185FA5;border-radius:99px;transition:width .3s}
.pgfill.done{background:var(--success)}

/* ── Toast ── */
.toast{position:fixed;bottom:20px;right:20px;background:var(--text);color:var(--bg);padding:10px 18px;border-radius:var(--radius);font-size:14px;font-weight:500;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

/* ── Section divider ── */
.sep{height:1px;background:var(--border);margin:10px 0}

/* ── Login ── */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg3)}
.login-card{background:var(--bg);border:1px solid var(--border2);border-radius:var(--radius-lg);padding:36px;width:340px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.08)}

/* ── To-do badge ── */
.todo-bdg{font-size:11.5px;padding:2px 9px;border-radius:99px;background:#F1EFE8;color:#444441;font-weight:500}

/* ── Checkbox multi-select ── */
.cb-list{border:1px solid var(--border2);border-radius:var(--radius);max-height:150px;overflow-y:auto}
.cb-item{display:flex;align-items:center;gap:8px;padding:7px 11px;border-bottom:1px solid var(--border);font-size:var(--fs-sm);cursor:pointer}
.cb-item:last-child{border-bottom:none}.cb-item:hover{background:var(--bg2)}
.cb-item input[type=checkbox]{width:15px;height:15px;cursor:pointer;flex-shrink:0}

/* ── Tabs ── */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);padding:0 20px;flex-shrink:0}
.tab{padding:10px 15px;font-size:var(--fs-sm);cursor:pointer;color:var(--text2);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500}
.tab:hover{color:var(--text)}.tab.active{color:var(--text);border-bottom-color:var(--text)}

/* ── Relative date display ── */
.rel-date{font-size:11.5px;color:var(--text3);margin-top:2px}

/* ── Digest email preview ── */
.dpreview{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:18px;font-size:13.5px;line-height:1.7;max-height:320px;overflow-y:auto;font-family:Georgia,serif}
.dpreview h3{font-size:16px;font-weight:700;font-family:var(--font);margin-bottom:4px}
.dpreview table{width:100%;border-collapse:collapse;margin:8px 0;font-size:13px}
.dpreview td,.dpreview th{padding:6px 9px;border:1px solid var(--border)}
.dpreview th{background:var(--bg2);font-weight:600;font-family:var(--font)}
.dpreview a{color:var(--info);text-decoration:underline;cursor:pointer}

/* ── Contact card ── */
.contact-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:var(--fs-sm)}
.contact-row:last-child{border-bottom:none}

/* ── Files ── */
.file-row{display:flex;align-items:center;gap:9px;padding:7px 10px;border-bottom:1px solid var(--border);font-size:var(--fs-sm)}
.file-row:last-child{border-bottom:none}
.file-icon{width:32px;height:32px;border-radius:6px;background:var(--bg2);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px;color:var(--text2)}
.file-drop{border:2px dashed var(--border2);border-radius:var(--radius);padding:20px;text-align:center;cursor:pointer;color:var(--text3);font-size:13.5px;transition:border-color .2s}
.file-drop:hover{border-color:var(--text);color:var(--text)}

/* ── Related clients search ── */
.rc-search{position:relative;margin-bottom:6px}
.rc-search i{position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--text3);pointer-events:none}
.rc-search input{width:100%;padding:7px 10px 7px 28px;font-size:var(--fs-sm);border:1px solid var(--border2);border-radius:var(--radius);font-family:var(--font)}
.rc-search input:focus{outline:none;border-color:#555}

/* ── CC multi-select ── */
.cc-tags{display:flex;flex-wrap:wrap;gap:5px;padding:6px 8px;border:1px solid var(--border2);border-radius:var(--radius);min-height:38px;cursor:text;background:var(--bg)}
.cc-tag{display:inline-flex;align-items:center;gap:4px;background:var(--blue-bg);color:var(--blue-tc);padding:2px 8px;border-radius:99px;font-size:12px;font-weight:500}
.cc-tag button{border:none;background:none;cursor:pointer;color:var(--blue-tc);padding:0;font-size:13px;line-height:1}
.cc-input{border:none;outline:none;font-size:13px;font-family:var(--font);flex:1;min-width:100px;background:transparent}
.cc-suggestions{border:1px solid var(--border2);border-radius:var(--radius);background:var(--bg);max-height:150px;overflow-y:auto;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.cc-sug-item{padding:8px 12px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px}
.cc-sug-item:hover{background:var(--bg2)}

/* ── Custom views ── */
.view-card{border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px;cursor:pointer;background:var(--bg)}
.view-card:hover{border-color:var(--border2);background:var(--bg2)}
.view-card.active-view{border-color:var(--text);background:var(--bg2)}


/* ══════════════════════════════════════════
   v16 CLEAN UI REFRESH — calmer, simpler, softer
══════════════════════════════════════════ */
:root{
  --bg:#ffffff;
  --bg2:#f8fafc;
  --bg3:#f3f4f6;
  --text:#111827;
  --text2:#4b5563;
  --text3:#9ca3af;
  --border:rgba(17,24,39,.08);
  --border2:rgba(17,24,39,.14);
  --radius:10px;
  --radius-lg:16px;
  --fs-base:14.5px;
  --fs-sm:13.5px;
  --fs-xs:12.5px;
}
body{background:#f5f6f8;color:var(--text);}
.app{background:#f5f6f8;}
.sidebar{width:236px;min-width:236px;background:#fbfbfa;border-right:1px solid rgba(17,24,39,.07);box-shadow:1px 0 0 rgba(255,255,255,.7) inset;}
.sidebar.col{width:58px;min-width:58px;}
.sb-top{padding:18px 16px 14px;border-bottom:1px solid rgba(17,24,39,.06);}
.sb-nm{font-size:15px;font-weight:700;letter-spacing:-.01em;}
.sb-rl{font-size:12px;margin-top:1px;color:#8b8d94;}
.sb-sec{padding:16px 16px 6px;font-size:10.5px;color:#b0b3bb;letter-spacing:.09em;}
.nav{margin:2px 10px;padding:9px 12px;border-radius:11px;font-size:14px;color:#4b5563;}
.nav:hover{background:#f1f3f5;color:#111827;}
.nav.active{background:#111827;color:#fff;border-right:none;font-weight:600;box-shadow:0 6px 18px rgba(17,24,39,.10);}
.nav.active i{color:#fff;}
.nav i{font-size:17px;color:#6b7280;}
.nbadge{background:#eef2ff;color:#3730a3;border-radius:999px;padding:1px 7px;font-size:11px;}
.nav.active .nbadge{background:rgba(255,255,255,.2);color:#fff;}
.sb-foot{border-top:1px solid rgba(17,24,39,.06);padding:12px 12px 14px;gap:7px;}
.sb-foot .btn{border-color:rgba(17,24,39,.09);background:#fff;box-shadow:0 1px 2px rgba(17,24,39,.04);}
.main{background:#fff;border-radius:0;}
.topbar{padding:18px 22px;border-bottom:1px solid rgba(17,24,39,.07);background:rgba(255,255,255,.96);}
.tbtitle{font-size:18px;font-weight:700;letter-spacing:-.02em;}
.btn{border-radius:10px;padding:8px 14px;border-color:rgba(17,24,39,.12);box-shadow:0 1px 2px rgba(17,24,39,.04);}
.btn:hover{background:#f8fafc;border-color:rgba(17,24,39,.18);}
.btn-pri{background:#111827;color:#fff;border-color:#111827;box-shadow:0 8px 20px rgba(17,24,39,.16);}
.btn-pri:hover{background:#1f2937;opacity:1;}
.btn-sm{padding:7px 12px;}
.fbar{padding:12px 22px;background:#fafafa;border-bottom:1px solid rgba(17,24,39,.06);gap:8px;}
.fpill,.fsel{background:#fff;border-color:rgba(17,24,39,.10);padding:6px 12px;color:#596171;}
.fpill.on,.fpill:hover{background:#111827;color:#fff;border-color:#111827;}
.srch input{height:34px;width:190px;border-color:rgba(17,24,39,.10);box-shadow:0 1px 2px rgba(17,24,39,.03);}
.srch input:focus{width:230px;border-color:#111827;}
.content{background:#fff;padding-bottom:18px;}
.tbl-hd{margin:12px 18px 0;padding:8px 12px;border:0;background:transparent;color:#a0a3ab;font-size:10.5px;}
.trow{margin:8px 18px;padding:14px 14px;border:1px solid rgba(17,24,39,.08);border-radius:14px;background:#fff;box-shadow:0 1px 3px rgba(17,24,39,.04);}
.trow:hover{background:#fbfbfc;border-color:rgba(17,24,39,.14);box-shadow:0 6px 18px rgba(17,24,39,.07);}
.trow.sub{margin-left:42px;background:#fbfbfc;border-style:dashed;padding-left:14px;}
.trow.ghdr{margin:14px 18px 6px;border:none;box-shadow:none;background:#f8fafc;border-radius:10px;color:#6b7280;font-weight:600;}
.tname{font-weight:500;color:#111827;}

/* ══════════════════════════════════════════
   MOBILE — single consolidated ledger layout.

   is robust to row templates having a different
   number/order of child divs (project rows have an
   extra leading expand-button that task/todo rows
   don't have).
══════════════════════════════════════════ */
@media (max-width:820px){
  /* Bottom tab bar replaces sidebar */

  .content{padding:0!important}

  /* ── ROW: every list row (task/subtask/project/todo) becomes one COMPACT line, not a multi-line stacked card. ── */
  .trow.gcols,
  .content>div[onclick^="openTodo("]{
    display:flex!important;flex-wrap:nowrap!important;align-items:center!important;
    gap:7px!important;
    padding:7px 12px!important;margin:0!important;min-height:0!important;
    border-left:0!important;border-right:0!important;border-top:0!important;border-radius:0!important;

  /* Checkbox / expand button: small, fixed, never grows */
  .trow.gcols .chk,.trow.gcols .exp-btn,.content>div[onclick^="openTodo("] .chk{
    flex:0 0 auto!important;width:20px!important;height:20px!important;min-width:20px!important;margin:0!important;
  }

  /* Name: the ONE thing allowed to grow/shrink and truncate with ellipsis - single line, no wrapping */
  .trow.gcols .tname,.content>div[onclick^="openTodo("]>div:nth-child(3){
    flex:1 1 auto!important;min-width:0!important;overflow:hidden!important;

  }
  .trow.gcols .tname>span:first-of-type,
  .content>div[onclick^="openTodo("]>div:nth-child(3)>div:first-child{
    font-size:13px!important;line-height:1.3!important;white-space:nowrap!important;overflow:hidden!important;
    text-overflow:ellipsis!important;min-width:0!important;flex:0 1 auto!important;
  }
  /* Hide the recurring badge text on the compact mobile row entirely - keep just a tiny icon to save space */
  .trow.gcols .tname .sas-v48-recur-badge,
  .trow.gcols .tname .sas-v48-recur-badge *{

  .trow.gcols .sas-type-cell,

  .trow.gcols .tdue,.content>div[onclick^="openTodo("] .tdue{
    font-size:11px!important;flex:0 0 auto!important;white-space:nowrap!important;min-width:0!important;
  }
  .trow.gcols .rel-date,.content>div[onclick^="openTodo("] .rel-date{display:none!important}

  .trow.gcols .av,.content>div[onclick^="openTodo("] .av{
    width:18px!important;height:18px!important;font-size:7.5px!important;flex:0 0 auto!important;

  /* Actions: hidden entirely on the compact mobile list row. Edit/delete happen
     after tapping into the row's detail/edit modal instead - keeps the list scannable. */
  .trow.gcols .racts,.content>div[onclick^="openTodo("] .racts{display:none!important}

  .sas-v48-project-children{margin-left:10px!important}
  .sas-section-label,.sas-v48-section-label{padding:7px 12px 2px!important;margin:0!important;font-size:11px!important}
  .sas-completed-toggle{padding:7px 12px!important;font-size:12px!important;margin:6px 8px 2px!important}

  .modal{width:calc(100vw - 16px)!important;max-height:calc(100dvh - 20px)!important;border-radius:4px!important}
  .mwrap{padding:8px!important;align-items:flex-start!important}
  .gr2,.gr3{grid-template-columns:1fr!important}
  .sas-info-grid{grid-template-columns:1fr!important}
}
</style>

<script>
const TODAY=new Date().toISOString().slice(0,10);

/* ══════════════════════════════════════════
   DATA
══════════════════════════════════════════ */
let palette=[
  {id:'blue',name:'Slate',bg:'#EDEEEA',tc:'#3D5247'},
  {id:'green',name:'Ledger',bg:'#E3EEEA',tc:'#0F5C4D'},
  {id:'amber',name:'Ochre',bg:'#F3ECDD',tc:'#7A5C28'},
  {id:'pink',name:'Clay',bg:'#F3E6E2',tc:'#7A3B2C'},
  {id:'purple',name:'Plum',bg:'#E9E7EE',tc:'#473E66'},
  {id:'teal',name:'Pine',bg:'#E1ECE7',tc:'#1E5C4A'},
  {id:'red',name:'Stamp',bg:'#F6E7E3',tc:'#A23B2E'},
];
function getPal(id){return palette.find(p=>p.id===id)||palette[0];}

const ROLES={
  admin:{name:'Admin',perms:{create_task:true,edit_task:true,delete_task:true,assign_task:true,create_project:true,manage_team:true,manage_roles:true,view_log:true,view_all:true,manage_clients:true,view_tax:true,manage_tax_jobs:true,upload_files:true,view_files:true,view_others_work:true}},
  manager:{name:'Manager',perms:{create_task:true,edit_task:true,delete_task:false,assign_task:true,create_project:true,manage_team:false,manage_roles:false,view_log:false,view_all:true,manage_clients:true,view_tax:true,manage_tax_jobs:true,upload_files:true,view_files:true,view_others_work:true}},
  staff:{name:'Staff',perms:{create_task:false,edit_task:true,delete_task:false,assign_task:false,create_project:false,manage_team:false,manage_roles:false,view_log:false,view_all:false,manage_clients:false,view_tax:true,manage_tax_jobs:false,upload_files:true,view_files:true,view_others_work:false}},
  viewer:{name:'Viewer',perms:{create_task:false,edit_task:false,delete_task:false,assign_task:false,create_project:false,manage_team:false,manage_roles:false,view_log:false,view_all:true,manage_clients:false,view_tax:true,manage_tax_jobs:false,upload_files:false,view_files:true,view_others_work:true}},
};
const PERM_LABELS={create_task:'Create tasks',edit_task:'Edit tasks',delete_task:'Delete tasks',assign_task:'Assign tasks',create_project:'Create projects',manage_team:'Manage team',manage_roles:'Manage roles',view_log:'View audit log',view_all:'View all tasks',manage_clients:'Manage clients',view_tax:'View tax module',manage_tax_jobs:'Manage tax jobs',upload_files:'Upload / attach files',view_files:'View file attachments',view_others_work:"View others' tasks, projects & to-dos"};

/* ── Access control ── */
function defaultAccess(){ return {clients:'none',projects:'assigned',tasks:'assigned',seeTeam:false}; }
function normalizeAccess(acc, role){
  if(role==='admin') return {clients:'all',projects:'all',tasks:'all',seeTeam:true};
  const d=defaultAccess();
  if(!acc) return d;
  if(typeof acc==='string'){
    try{ acc=JSON.parse(acc); }catch(e){ return d; }
  }
  const validClientModes=['all','none'];
  const validProjectModes=['all','assigned'];
  const validTaskModes=['all','assigned','project','client','people'];
  const vmRaw=(acc.visMembers&&typeof acc.visMembers==='object')?acc.visMembers:{};
  const vmArr=k=>Array.isArray(vmRaw[k])?vmRaw[k].filter(x=>typeof x==='string'||typeof x==='number').map(String):[];
  const stm=Array.isArray(acc.seeTeamMembers)?acc.seeTeamMembers.filter(x=>typeof x==='string'||typeof x==='number').map(String):[];
  return {
    clients:Array.isArray(acc.clients)?acc.clients:(validClientModes.includes(acc.clients)?acc.clients:d.clients),
    projects:Array.isArray(acc.projects)?acc.projects:(validProjectModes.includes(acc.projects)?acc.projects:d.projects),
    tasks:validTaskModes.includes(acc.tasks)?acc.tasks:d.tasks,
    seeTeam:!!acc.seeTeam,
    seeTeamMembers:stm,
    visMembers:{tasks:vmArr('tasks'),projects:vmArr('projects'),subtasks:vmArr('subtasks'),todos:vmArr('todos')}
  };
}
function memberFromRow(m){
  const role=m.role||'staff';
  const rawAccess = m.access_profile ?? m.access ?? null;
  return {
    id:m.id,
    name:m.name,
    initials:m.initials||String(m.name||'').slice(0,2).toUpperCase(),
    palId:m.pal_id||m.palId||'blue',
    role,
    email:m.email||'',
    access:normalizeAccess(rawAccess, role)
  };
}
function isAdmin(){ return !!(currentUser&&currentUser.role==='admin'); }
function getAcc(){ return (currentUser&&currentUser.access)||defaultAccess(); }
function visCli(){ if(isAdmin())return clients; const a=getAcc(); if(a.clients==='all')return clients; if(a.clients==='none'||!a.clients)return []; if(Array.isArray(a.clients))return clients.filter(x=>a.clients.includes(x.id)); return []; }
function visProj(){ if(isAdmin())return projects; const a=getAcc(); if(!perm('view_others_work')) return projects.filter(p=>p.assignee===currentUser.id||tasks.some(t=>t.project===p.id&&(t.assignee===currentUser.id||(t.subtasks||[]).some(s=>s.assignee===currentUser.id)))); if(a.projects==='all')return projects.filter(p=>!p.client||canSeeCli(p.client)||p.assignee===currentUser.id); if(a.projects==='assigned')return projects.filter(p=>p.assignee===currentUser.id||(!p.client&&false)||(p.client&&canSeeCli(p.client))||tasks.some(t=>t.project===p.id&&(t.assignee===currentUser.id||(t.subtasks||[]).some(s=>s.assignee===currentUser.id)))); if(Array.isArray(a.projects))return projects.filter(x=>a.projects.includes(x.id)||x.assignee===currentUser.id||(x.client&&canSeeCli(x.client))); return []; }
function canSeeCli(id){ return isAdmin()||visCli().some(x=>x.id===id); }
function canSeeProj(id){ return isAdmin()||visProj().some(x=>x.id===id); }
function canSeeTask(t){ if(isAdmin())return true; const a=getAcc(); const cid=t.client||(getProj(t.project).client)||''; if(cid&&!canSeeCli(cid))return false; const mine=t.assignee===currentUser.id||(t.subtasks||[]).some(s=>s.assignee===currentUser.id); if(!perm('view_others_work'))return mine; if(a.tasks==='all')return true; if(a.tasks==='assigned')return mine; if(a.tasks==='project')return canSeeProj(t.project); if(a.tasks==='client')return cid?canSeeCli(cid):false; return false; }
function canSeeTodo(td){ if(isAdmin())return true; if(!td)return false; const cid=td.client||''; if(cid && !canSeeCli(cid))return false; if(!perm('view_others_work'))return td.assignee===currentUser.id; return td.assignee===currentUser.id; }
function canSeeMemb(id){ if(isAdmin())return true; if(id===currentUser.id)return true; const a=getAcc(); const vm=(a&&a.visMembers)||{}; const inGrants=['tasks','projects','subtasks','todos'].some(k=>Array.isArray(vm[k])&&vm[k].map(String).includes(String(id))); if(a.seeTeam){ const list=Array.isArray(a.seeTeamMembers)?a.seeTeamMembers:[]; if(!list.length)return true; if(list.map(String).includes(String(id)))return true; } return inGrants; }

function fmtDate(d){
  if(!d)return'—';
  const[y,m,day]=d.split('-');
  const mn=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return mn[+m-1]+' '+parseInt(day);
}
function relDate(d){
  if(!d)return'';
  const diff=Math.round((new Date(d)-new Date(TODAY))/(86400000));
  if(diff===0)return'Today';
  if(diff===1)return'Tomorrow';
  if(diff===-1)return'Yesterday';
  if(diff>0&&diff<=7)return`In ${diff} days`;
  if(diff<0&&diff>=-7)return`${-diff} days ago`;
  return'';
}

// Log entries for a specific entity (and optionally sub-entities)
function logsFor(eType,eId,inclSubs){
  let logs=auditLog.filter(l=>l.eType===eType&&String(l.eId)===String(eId));
  if(inclSubs){
    // For tasks: include subtask logs
    if(eType==='task'){
      const t=tasks.find(x=>x.id===+eId);
      if(t)(t.subtasks||[]).forEach(s=>{
        logs=logs.concat(auditLog.filter(l=>l.eType==='subtask'&&String(l.eId)===String(s.id)));
      });
    }
    // For projects: include task + subtask logs
    if(eType==='project'){
      const pt=tasks.filter(x=>x.project===eId);
      pt.forEach(t=>{
        logs=logs.concat(auditLog.filter(l=>l.eType==='task'&&String(l.eId)===String(t.id)));
        (t.subtasks||[]).forEach(s=>{
          logs=logs.concat(auditLog.filter(l=>l.eType==='subtask'&&String(l.eId)===String(s.id)));
        });
      });
    }
  }
  return logs.sort((a,b)=>b.ts.localeCompare(a.ts));
}

const msalConfig = {
  auth: {
    clientId: '82b36714-260e-405e-8fcf-c1607e549b0c',
    authority: 'https://login.microsoftonline.com/organizations',
    redirectUri: window.location.origin,
    navigateToLoginRequestUrl: false,
  },
  cache: {
    cacheLocation: 'localStorage',
    storeAuthStateInCookie: true,
  }
};
const loginRequest = { scopes: ['openid','profile','User.Read'] };
let msalInstance = null;

let _msalLoading = false;
let _msalLoaded = false;

async function loadMsalLib(){
  if(_msalLoaded) return true;
  if(_msalLoading) {
    // Wait for existing load to complete
    await new Promise(r => setTimeout(r, 3000));
    return _msalLoaded;
  }
  _msalLoading = true;
  const cdns = [
    'https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js',
    'https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.10.0/lib/msal-browser.min.js',
    'https://unpkg.com/@azure/msal-browser@3.10.0/lib/msal-browser.min.js'
  ];
  for(const url of cdns){
    try {
      await new Promise((resolve, reject) => {
        if(typeof msal !== 'undefined'){ resolve(); return; }
        const s = document.createElement('script');
        s.src = url;
        s.onload = () => { _msalLoaded = true; resolve(); };
        s.onerror = reject;
        document.head.appendChild(s);
      });
      if(typeof msal !== 'undefined') break;
    } catch(e){ continue; }
  }
  _msalLoading = false;
  return typeof msal !== 'undefined';
}

async function getMsal(){
  if(typeof msal === 'undefined'){
    const loaded = await loadMsalLib();
    if(!loaded) throw new Error('Could not load Microsoft sign-in library. Please check your internet connection and try again.');
  }
  if(!msalInstance){
    msalInstance = new msal.PublicClientApplication(msalConfig);
    await msalInstance.initialize();
  }
  return msalInstance;
}

  let activeTab=window._memTab||'tasks';

  const a=m.access||defaultAccess();

  const projMode=isAdm?'all':(Array.isArray(a.projects)?(a.projects.length>0?'specific':'assigned'):(a.projects||'assigned'));

function mc2(palId){return getPal(palId);}

/* ══════════════════════════════════════════
   CLIENT DETAIL
══════════════════════════════════════════ */
function renderClientDetail(mc){
  const c=clients.find(x=>x.id===detailId);if(!c)return closeDetail();
  const cProjs=projects.filter(p=>p.client===c.id);
  const cTasks=tasks.filter(t=>t.client===c.id||cProjs.some(p=>p.id===t.project));
  const cTodos=todos.filter(t=>t.client===c.id);
  const ini=c.name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
  const palIds=['blue','teal','amber','pink','purple'];
  const cp=getPal(palIds[clients.indexOf(c)%5]);
  const open=cTasks.filter(t=>!isTaskDone(t)).length;
  let activeTab=window._cliTab||'overview';

  const relClis=(c.relatedClients||[]).map(rid=>{const rc=getCli(rid);return rc?`<span class="tag" style="background:var(--bg2);color:var(--text2);margin-right:4px">${rc.name}</span>`:''}).join('');

  mc.innerHTML=`<div class="topbar">
    <button class="btn btn-ghost btn-sm" onclick="closeDetail()"><i class="ti ti-arrow-left"></i>Back</button>
    <div class="av" style="width:34px;height:34px;background:${cp.bg};color:${cp.tc};font-size:12px;font-weight:700;margin-left:6px">${ini}</div>
    <div style="flex:1;margin-left:8px"><div class="tbtitle" style="margin-bottom:0">${c.name}</div><div style="font-size:12px;color:var(--text2)">${c.type} · ${c.contact}</div></div>
    <button class="btn btn-sm" onclick="openEditClient('${c.id}')"><i class="ti ti-edit"></i>Edit</button>
  </div>
  <div class="tabs">
    <div class="tab ${activeTab==='overview'?'active':''}" onclick="window._cliTab='overview';renderView()">Overview</div>
    <div class="tab ${activeTab==='tasks'?'active':''}" onclick="window._cliTab='tasks';renderView()">Tasks (${cTasks.length})</div>
    <div class="tab ${activeTab==='todos'?'active':''}" onclick="window._cliTab='todos';renderView()">To-dos (${cTodos.length})</div>
    <div class="tab ${activeTab==='projects'?'active':''}" onclick="window._cliTab='projects';renderView()">Projects (${cProjs.length})</div>
    <div class="tab ${activeTab==='contacts'?'active':''}" onclick="window._cliTab='contacts';renderView()">Contacts (${(c.contacts||[]).length})</div>
    ${isAdmin()?`<div class="tab ${activeTab==='history'?'active':''}" onclick="window._cliTab='history';renderView()">History</div>`:''}
    ${isAdmin()?`<div class="tab ${activeTab==='access'?'active':''}" onclick="window._cliTab='access';renderView()">Access</div>`:''}
  </div>
  <div class="content" style="padding:0 18px 18px">
  ${activeTab==='overview'?`
    <div class="stat-grid" style="grid-template-columns:repeat(3,1fr);padding:14px 0">
      <div class="stat"><div class="stat-lbl">Open tasks</div><div class="stat-val">${open}</div></div>
      <div class="stat"><div class="stat-lbl">Projects</div><div class="stat-val">${cProjs.length}</div></div>
      <div class="stat"><div class="stat-lbl">Open to-dos</div><div class="stat-val">${cTodos.filter(x=>!x.done).length}</div></div>
    </div>
    ${c.email?`<div style="font-size:13px;color:var(--text2);margin-bottom:6px"><i class="ti ti-mail" style="vertical-align:-1px;margin-right:5px"></i>${c.email}</div>`:''}
    ${c.phone?`<div style="font-size:13px;color:var(--text2);margin-bottom:6px"><i class="ti ti-phone" style="vertical-align:-1px;margin-right:5px"></i>${c.phone}</div>`:''}
    ${c.notes?`<div style="font-size:13px;color:var(--text3);margin-top:8px">${c.notes}</div>`:''}
    ${relClis?`<div style="margin-top:10px"><div style="font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px">Related clients</div>${relClis}</div>`:''}
  `:''}
  ${activeTab==='tasks'?renderMiniTaskList(cTasks):''}
  ${activeTab==='todos'?cTodos.map(t=>todoRowHTML(t)).join('')||'<div style="padding:24px;text-align:center;color:var(--text3)">No to-dos</div>':''}
  ${activeTab==='projects'?cProjs.map(p=>miniProjCard(p)).join('')||'<div style="padding:24px;text-align:center;color:var(--text3)">No projects</div>':''}
  ${activeTab==='contacts'?renderContactsList(c):''}
  ${isAdmin()&&activeTab==='history'?renderHistoryList(logsFor('','',false).filter(l=>
    (l.eType==='task'&&cTasks.some(t=>t.id===+l.eId))||
    (l.eType==='project'&&cProjs.some(p=>p.id===l.eId))||
    (l.eType==='subtask'&&cTasks.some(t=>t.subtasks&&t.subtasks.some(s=>s.id===+l.eId)))
  )):''}
  </div>`;
}

function renderContactsList(c){
  const contacts=c.contacts||[];
  return`<div style="padding-top:10px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <div style="font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.04em">Contacts</div>
      ${perm('manage_clients')?`<button class="btn btn-sm btn-pri" onclick="openAddContact('${c.id}')"><i class="ti ti-plus"></i>Add contact</button>`:''}
    </div>
    ${contacts.length?contacts.map((ct,i)=>`<div class="contact-row">
      <div class="av" style="width:32px;height:32px;background:var(--bg2);color:var(--text2);font-size:11px;font-weight:700">${ct.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase()}</div>
      <div style="flex:1"><div style="font-size:13px;font-weight:500">${ct.name}</div><div style="font-size:11px;color:var(--text3)">${ct.title||''}</div></div>
      <div style="font-size:12px;color:var(--text2);margin-right:10px">${ct.email||''}</div>
      <div style="font-size:12px;color:var(--text2);margin-right:10px">${ct.phone||''}</div>
      ${perm('manage_clients')?`<button class="btn btn-ghost btn-xs btn-danger" onclick="removeContact('${c.id}',${i})"><i class="ti ti-trash"></i></button>`:''}
    </div>`).join(''):'<div style="padding:20px;text-align:center;color:var(--text3);font-size:13px">No contacts yet</div>'}
  </div>`;
}

function renderMiniTaskList(tArr){
  if(!tArr.length)return'<div style="padding:24px;text-align:center;color:var(--text3)">No tasks</div>';
  let fArr=[...tArr];
  const open=fArr.filter(t=>!isTaskDone(t));
  const done=fArr.filter(t=>isTaskDone(t));
  return`<div class="tbl-hd gcols" style="margin-top:10px">
    <span></span><span>Task</span><span>Project</span><span>Client</span><span>Due</span><span>Who</span><span>Actions</span>
  </div>`+open.map(t=>taskRowHTML(t,false)).join('')+(done.length?`<div class="trow ghdr"><i class="ti ti-check"></i>Completed (${done.length})</div>`+done.map(t=>taskRowHTML(t,false)).join(''):'');
}

function miniProjCard(proj){
  const pt=tasks.filter(t=>t.project===proj.id);
  const pct=pt.length?Math.round(pt.filter(t=>isTaskDone(t)).length/pt.length*100):0;
  const pcol=pc(proj.palId);
  const cli=getCli(proj.client);
  return`<div class="card" style="margin-top:8px">
    <div class="card-hdr" style="background:${pcol.bg}">
      <div style="flex:1"><div style="font-size:13px;font-weight:600;color:${pcol.tc}">${proj.name}</div>
      <div style="font-size:11px;color:${pcol.tc};opacity:.8">${cli?cli.name:'—'} · ${pt.filter(t=>!isTaskDone(t)).length} open</div>
      <div class="pgbar" style="width:120px;margin-top:4px"><div class="pgfill ${pct===100?'done':''}" style="width:${pct}%"></div></div></div>
      <button class="btn btn-xs" style="background:${pcol.bg};border-color:${pcol.tc}40;color:${pcol.tc}" onclick="openEditProject('${proj.id}')"><i class="ti ti-edit"></i></button>
    </div>
  </div>`;
}

/* ══════════════════════════════════════════
   HISTORY RENDERER (shared)
══════════════════════════════════════════ */
function renderHistoryList(logs){
  if(!isAdmin())return '<div style="padding:24px;text-align:center;color:var(--text3);font-size:13px">Admin-only history.</div>';
  if(!logs||!logs.length)return'<div style="padding:24px;text-align:center;color:var(--text3);font-size:13px">No history yet</div>';
  const actionColors={
    'Created task':'#1e40af','Created project':'#166534','Created to-do':'#92400e',
    'Updated task':'#5a5955','Completed task':'#166534','Completed subtask':'#166534',
    'Deleted task':'#991b1b','Auto-completed task':'#166534',
    'Updated project':'#5a5955','Completed project':'#166534',
    'Added member':'#3C3489','Updated member':'#5a5955','Removed member':'#991b1b',

    else if(e.eType==='todo'&&e.eId){const td=todos.find(x=>x.id===+e.eId);if(td)linkBtn=`<button class="btn btn-ghost btn-xs" onclick="openTodo(${td.id})" title="Open to-do"><i class="ti ti-external-link"></i></button>`;}
    else if(e.eType==='subtask'&&e.eId&&e.parentId){const t=tasks.find(x=>x.id===+e.parentId);if(t)linkBtn=`<button class="btn btn-ghost btn-xs" onclick="openTask(${t.id})" title="Open parent task"><i class="ti ti-external-link"></i></button>`;}
    return`<div class="hrow">
      <div style="font-size:11px;color:var(--text3);min-width:90px;flex-shrink:0">${e.ts}</div>
      <div class="av" style="width:22px;height:22px;background:${mc3.bg};color:${mc3.tc};font-size:9px;flex-shrink:0">${m.initials}</div>
      <div style="flex:1;min-width:0">

        <span class="htag" style="background:${acol}20;color:${acol};margin:0 5px">${e.action}</span>

      </div>
      <div style="flex-shrink:0">${linkBtn}</div>

  }).join('');
}

/* ══════════════════════════════════════════
   TASK LIST
══════════════════════════════════════════ */
function getVisTasks(){
  let t=[...tasks,...todos.map(td=>({...td,_isTodo:true,project:'',subtasks:[]}))];
  if(!isAdmin()){
    t=t.filter(x=>x._isTodo ? canSeeTodo(x) : canSeeTask(x));
  }
  if(currentView==='today')t=t.filter(x=>x.due===TODAY||(x.subtasks&&x.subtasks.some(s=>s.due===TODAY)));
  if(currentView==='recurring')t=t.filter(x=>x.recur);
  if(fMem)t=t.filter(x=>x.assignee===fMem||(x.subtasks&&x.subtasks.some(s=>s.assignee===fMem)));
  if(fCli)t=t.filter(x=>x.client===fCli||(getProj(x.project).client===fCli));
  if(fProj){ if(fProj==='__todo') t=t.filter(x=>x._isTodo); else t=t.filter(x=>x.project===fProj); }
  if(fStat==='open')t=t.filter(x=>!isTaskDone(x));
  if(fStat==='done')t=t.filter(x=>isTaskDone(x));
  if(fQ){const q=fQ.toLowerCase();t=t.filter(x=>x.name.toLowerCase().includes(q)||(x.subtasks&&x.subtasks.some(s=>s.name.toLowerCase().includes(q))));}
  if(sortC==='project')t.sort((a,b)=>sortD*(getProj(a.project).name.localeCompare(getProj(b.project).name)));
  else if(sortC==='task')t.sort((a,b)=>sortD*a.name.localeCompare(b.name));
  else if(sortC==='due')t.sort((a,b)=>sortD*((a.due||'9999')>(b.due||'9999')?1:-1));
  else if(sortC==='assignee')t.sort((a,b)=>sortD*getMem(a.assignee).name.localeCompare(getMem(b.assignee).name));
  return t;
}
function sortBy(col){if(sortC===col)sortD*=-1;else{sortC=col;sortD=1;}renderView();}
function sIcon(col){if(sortC!==col)return'<i class="ti ti-selector" style="font-size:10px;opacity:.35"></i>';return sortD===1?'<i class="ti ti-sort-ascending" style="font-size:10px"></i>':'<i class="ti ti-sort-descending" style="font-size:10px"></i>';}

function taskRowHTML(task,showSubs){
  const proj=getProj(task.project);const pcol=pc(proj.palId);
  const cliId=task.client||(proj.client)||'';
  const m=getMem(task.assignee);const mc3=mc2(m.palId);
  const done=isTaskDone(task);const late=isLate(task.due,done);
  const hasSubs=task.subtasks&&task.subtasks.length>0;
  const isExp=expanded[task.id];
  const subsDone=hasSubs?task.subtasks.filter(s=>s.done).length:0;
  const cli=getCli(cliId);
  const rLabel={daily:'Daily',weekly:'Weekly',semimonthly:'Semimon.',monthly:'Monthly',quarterly:'Qtrly',annual:'Annual',yearly:'Annual'}[task.recur]||'';
  let html=`<div class="trow gcols ${done?'dim':''}" onclick="openTask(${task.id})">
    <div class="chk ${done?'done':''}" onclick="tglDone(event,${task.id})">${done?'<i class="ti ti-check"></i>':''}</div>
    <div class="tname ${done?'done':''}">
      <input type="checkbox" class="selbox" ${isSelected('task',task.id)?'checked':''} onclick="toggleJobSel(event,'task',${task.id})" title="Select for bulk actions">
      ${hasSubs&&showSubs?`<button class="exp-btn" title="${isExp?'Collapse subtasks':'Expand subtasks'}" onclick="tglExp(event,${task.id})"><i class="ti ${isExp?'ti-chevron-down':'ti-chevron-right'}" style="font-size:19px"></i></button>`:'<span class="exp-spacer"></span>'}
      <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${task.name}</span>
      ${hasSubs?`<span class="sub-ctr">${subsDone}/${task.subtasks.length}</span>`:''}
      ${rLabel?`<span style="font-size:9px;color:var(--text3)"><i class="ti ti-refresh" style="font-size:9px"></i>${rLabel}</span>`:''}
    </div>
    <div>${task.project?`<span class="tag" style="background:${pcol.bg};color:${pcol.tc};max-width:88px;overflow:hidden;text-overflow:ellipsis;display:inline-block">${proj.name}</span>`:'<span style="font-size:var(--fs-xs);color:var(--text3)">—</span>'}</div>
    <div style="font-size:var(--fs-xs);color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${cli?cli.name.split(' ').slice(0,2).join(' '):'—'}</div>
    <div><div class="tdue ${late?'late':''}">${fmtDate(task.due)}</div>${relDate(task.due)?`<div class="rel-date">${relDate(task.due)}</div>`:''}</div>
    <div>${task.period&&task.recur&&typeof periodLabel==='function'?`<span class="sas-period-badge" style="font-size:11px;background:var(--ledger-lt,#EEF2FB);color:var(--ledger,#202657);border-radius:99px;padding:2px 8px;font-weight:600;display:inline-flex;align-items:center;gap:3px"><i class="ti ti-calendar-week" style="font-size:10px"></i>${periodLabel(task.period,task.recur)}</span>`:''}</div>
    <div><div class="av" style="width:20px;height:20px;background:${mc3.bg};color:${mc3.tc};font-size:8px" title="${m.name}">${m.initials}</div></div>
    <div class="racts" onclick="event.stopPropagation()">
      ${perm('edit_task')?`<button class="btn btn-ghost btn-xs" onclick="event.stopPropagation();openEditTask(${task.id})"><i class="ti ti-edit"></i></button>`:''}
      ${perm('create_task')?`<button class="btn btn-ghost btn-xs" onclick="copyTask(${task.id})"><i class="ti ti-copy"></i></button>`:''}
      ${perm('delete_task')?`<button class="btn btn-ghost btn-xs btn-danger" onclick="delTaskInline(event,${task.id})"><i class="ti ti-trash"></i></button>`:''}
    </div>
  </div>`;
  if(showSubs&&hasSubs&&isExp){
    task.subtasks.forEach(s=>{
      const sm=getMem(s.assignee);const smc=mc2(sm.palId);const sl=isLate(s.due,s.done);
      html+=`<div class="trow gcols sub ${s.done?'dim':''}" onclick="openSubEdit(${task.id},${s.id});event.stopPropagation()">
        <div class="chk ${s.done?'done':''}" onclick="tglSubDone(event,${task.id},${s.id})">${s.done?'<i class="ti ti-check"></i>':''}</div>
        <div class="tname ${s.done?'done':''}"><input type="checkbox" class="selbox" ${isSelected('subtask',s.id)?'checked':''} onclick="toggleJobSel(event,'subtask',${s.id},${task.id})" title="Select for bulk actions"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${s.name}</span></div>
        <div></div><div></div>
        <div><div class="tdue ${sl?'late':''}">${fmtDate(s.due)}</div>${relDate(s.due)?`<div class="rel-date">${relDate(s.due)}</div>`:''}</div>
        <div><div class="av" style="width:20px;height:20px;background:${smc.bg};color:${smc.tc};font-size:8px">${sm.initials}</div></div>

        </div>
      </div>`;
    });
  }
  return html;
}

/* ══════════════════════════════════════════

function selKey(type,id){return type+':'+id;}
function isSelected(type,id){return !!selectedJobs[selKey(type,id)];}
function selectedItems(){return Object.values(selectedJobs);}
function toggleJobSel(e,type,id,parentId){e.stopPropagation();const k=selKey(type,id);if(selectedJobs[k])delete selectedJobs[k];else selectedJobs[k]={type,id,parentId:parentId||''};renderView();}
function clearSelection(){selectedJobs={};renderView();}
function renderBulkBar(){const items=selectedItems();if(!items.length)return'';return`<div class="bulkbar"><strong>${items.length}</strong> selected <button class="btn btn-xs" onclick="openBulkModal()"><i class="ti ti-edit"></i>Bulk update</button><button class="btn btn-xs btn-danger" onclick="bulkDelete()"><i class="ti ti-trash"></i>Delete selected</button><button class="btn btn-xs btn-ghost" onclick="clearSelection()">Clear</button></div>`;}
function openBulkModal(){const items=selectedItems();if(!items.length)return;showModal(`<div class="mhdr"><h2>Bulk update ${items.length} item(s)</h2><button class="btn btn-ghost btn-sm" onclick="closeModal()"><i class="ti ti-x"></i></button></div><div class="mbody">
  <div class="fl"><label>Assign to</label><select class="fi" id="bulk-assignee"><option value="">Do not change</option>${visibleMembers().map(m=>`<option value="${m.id}">${m.name}</option>`).join('')}</select></div>
  <div class="fl"><label>Client</label><select class="fi" id="bulk-client"><option value="">Do not change</option>${clients.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select><div style="font-size:11.5px;color:var(--text3);margin-top:4px">Projects and to-dos can be moved to this client. For tasks, client is updated unless the task inherits from its project.</div></div>
  <div class="fl"><label>Due date</label><input class="fi" type="date" id="bulk-due"><div style="font-size:11.5px;color:var(--text3);margin-top:4px">Leave blank to keep current due dates.</div></div>
  <div class="fl"><label>Status</label><select class="fi" id="bulk-status"><option value="">Do not change</option><option value="open">Mark open</option><option value="done">Mark done</option></select></div>
</div><div class="mftr"><button class="btn btn-sm" onclick="closeModal()">Cancel</button><button class="btn btn-pri btn-sm" onclick="bulkApply()"><i class="ti ti-check"></i>Apply</button></div>`);}
function bulkApply(){const ass=document.getElementById('bulk-assignee').value;const clientId=document.getElementById('bulk-client').value;const due=document.getElementById('bulk-due').value;const status=document.getElementById('bulk-status').value;let changed=0;for(const it of selectedItems()){
  if(it.type==='project'){const p=projects.find(x=>x.id==it.id);if(!p)continue;if(clientId)p.client=clientId;if(due)p.due=due;dbSaveProject(p);changed++;}
  if(it.type==='task'){const t=tasks.find(x=>x.id==it.id);if(!t)continue;const effClient=clientId||t.client||getProj(t.project).client||'';if(ass&&!validateAssignment(ass,effClient))return;if(ass)t.assignee=ass;if(clientId)t.client=clientId;if(due)t.due=due;if(status)t.done=status==='done';dbSaveTask(t);changed++;}
  if(it.type==='subtask'){const t=tasks.find(x=>(x.subtasks||[]).some(s=>s.id==it.id));if(!t)continue;const s=(t.subtasks||[]).find(x=>x.id==it.id);const effClient=clientId||t.client||getProj(t.project).client||'';if(ass&&!validateAssignment(ass,effClient))return;if(ass)s.assignee=ass;if(due)s.due=due;if(status)s.done=status==='done';dbSaveTask(t);changed++;}
  if(it.type==='todo'){const td=todos.find(x=>x.id==it.id);if(!td)continue;const effClient=clientId||td.client||'';if(ass&&!validateAssignment(ass,effClient))return;if(ass)td.assignee=ass;if(clientId)td.client=clientId;if(due)td.due=due;if(status)td.done=status==='done';dbSaveTodo(td);changed++;}
}
addLog('Bulk updated',changed+' item(s)');selectedJobs={};closeModal();renderView();updateBadges();toast('Bulk update applied');}
function bulkDelete(){const items=selectedItems();if(!items.length)return;if(!confirm('Delete '+items.length+' selected item(s)?'))return;for(const it of items){
  if(it.type==='project'){const p=projects.find(x=>x.id==it.id);if(p){projects=projects.filter(x=>x.id!=it.id);dbDeleteProject(it.id);addLog('Deleted project',p.name,'project',it.id);}}
  if(it.type==='task'){const t=tasks.find(x=>x.id==it.id);if(t){tasks=tasks.filter(x=>x.id!=it.id);dbDeleteTask(it.id);addLog('Deleted task',t.name,'task',it.id);}}
  if(it.type==='subtask'){const t=tasks.find(x=>(x.subtasks||[]).some(s=>s.id==it.id));if(t){const s=t.subtasks.find(x=>x.id==it.id);t.subtasks=t.subtasks.filter(x=>x.id!=it.id);dbSaveTask(t);addLog('Deleted subtask',s.name,'subtask',it.id,t.id);}}
  if(it.type==='todo'){const td=todos.find(x=>x.id==it.id);if(td){todos=todos.filter(x=>x.id!=it.id);dbDeleteTodo(it.id);addLog('Deleted to-do',td.name,'todo',it.id);}}
}
selectedJobs={};renderView();updateBadges();toast('Deleted selected items');}

function tglExp(e,id){e.stopPropagation();expanded[id]=!expanded[id];renderView();}
function tglDone(e,id){e.stopPropagation();const t=tasks.find(x=>x.id===id);if(!t)return;if(t.subtasks&&t.subtasks.length){const all=t.subtasks.every(s=>s.done);t.subtasks.forEach(s=>s.done=!all);t.done=!all;}else t.done=!t.done;addLog(isTaskDone(t)?'Completed task':'Reopened task',t.name,'task',t.id);dbSaveTask(t);renderView();updateBadges();}

function delSub(e,tid,sid){e.stopPropagation();const t=tasks.find(x=>x.id===tid);if(!t)return;const s=t.subtasks.find(x=>x.id===sid);if(!s)return;if(!confirm('Delete subtask "'+s.name+'"?'))return;t.subtasks=t.subtasks.filter(x=>x.id!==sid);addLog('Deleted subtask',s.name,'subtask',sid,tid);dbSaveTask(t);renderView();}
function deleteTodo(e,id){e.stopPropagation();const td=todos.find(x=>x.id===id);if(!td)return;if(!confirm('Delete \"'+td.name+'\"?'))return;todos=todos.filter(x=>x.id!==id);addLog('Deleted to-do',td.name,'todo',id);dbDeleteTodo(id);renderView();updateBadges();toast('Deleted');}
function cpySub(tid,sid){const t=tasks.find(x=>x.id===tid);if(!t)return;const s=t.subtasks.find(x=>x.id===sid);if(!s)return;const cp={...s,id:++nid,name:s.name+' (copy)',done:false};const i=t.subtasks.findIndex(x=>x.id===sid);t.subtasks.splice(i+1,0,cp);addLog('Copied subtask',s.name,'subtask',cp.id,tid);dbSaveTask(t);renderView();toast('Subtask copied');}

/* ══════════════════════════════════════════

══════════════════════════════════════════ */
function relDateOpts(sel){
  const opts=[['','Specific date'],['today','Today'],['tomorrow','Tomorrow'],['3d','In 3 days'],['1w','In 1 week'],['2w','In 2 weeks'],['1m','In 1 month'],['3m','In 3 months']];
  return opts.map(([v,l])=>`<option value="${v}"${sel===v?' selected':''}>${l}</option>`).join('');
}
function resolveRelDate(val,base){
  const b=new Date(base||TODAY);
  if(!val||val==='')return base||'';
  if(val==='today')return TODAY;
  if(val==='tomorrow'){b.setDate(b.getDate()+1);return b.toISOString().slice(0,10);}
  if(val==='3d'){b.setDate(b.getDate()+3);return b.toISOString().slice(0,10);}
  if(val==='1w'){b.setDate(b.getDate()+7);return b.toISOString().slice(0,10);}
  if(val==='2w'){b.setDate(b.getDate()+14);return b.toISOString().slice(0,10);}
  if(val==='1m'){b.setMonth(b.getMonth()+1);return b.toISOString().slice(0,10);}
  if(val==='3m'){b.setMonth(b.getMonth()+3);return b.toISOString().slice(0,10);}
  return val;
}
function dueDateField(id,val){
  return`<div>
    <select class="fi" id="${id}-rel" onchange="syncDue('${id}')" style="margin-bottom:5px">${relDateOpts('')}</select>
    <input class="fi" type="date" id="${id}" value="${val||''}">
  </div>`;
}

  d.innerHTML=`<div style="display:flex;gap:6px;align-items:center">
    <input class="fi" placeholder="Subtask name" id="stn-${idx}" style="flex:1">

function selRo(el,hidId,val){el.closest('.fl').querySelectorAll('.ro').forEach(b=>b.classList.remove('on'));el.classList.add('on');document.getElementById(hidId).value=val;}
function saveNewTask(){
  const name=document.getElementById('nt-name').value.trim();if(!name)return;
  const projectId=document.getElementById('nt-proj').value;
  const clientId=document.getElementById('nt-cli').value;
  const effClient=effectiveClient(projectId,clientId);
  const assignee=document.getElementById('nt-assign').value;
  if(!validateAssignment(assignee, effClient))return;
  const subs=[];
  for(const el of document.querySelectorAll('[id^="stn-"]')){
    const i=el.id.split('-')[1];const sn=el.value.trim();
    const subAssignee=document.getElementById('sta-'+i).value;
    if(sn){
      if(!validateAssignment(subAssignee, effClient))return;
      const subId=++nid;
      subs.push({id:subId,name:sn,assignee:subAssignee,done:false,due:document.getElementById('std-'+i).value,notes:''});
      moveTempFiles('subtmp-'+i,'sub-'+subId);
    }
  }
  const taskId=++nid;
  const t={id:taskId,name,project:projectId,client:clientId,assignee,due:document.getElementById('nt-due').value,done:false,recur:document.getElementById('nt-recur').value,period:document.getElementById('nt-period')?.value||'',notes:document.getElementById('nt-notes').value,subtasks:subs};
  moveTempFiles('new-task','task-'+taskId);
  tasks.unshift(t);
  const cli=getCli(t.client||effClient);
  addLog('Created task',name+(cli?' → '+cli.name:'')+(subs.length?' ('+subs.length+' subtasks)':''),'task',t.id);
  stc=0;dbSaveTask(tasks[0]);dbSaveNid();closeModal();renderView();updateBadges();toast('Task created');
}

function tglSubMod(tid,sid,el){const t=tasks.find(x=>x.id===tid);if(!t)return;const s=t.subtasks.find(x=>x.id===sid);if(!s)return;s.done=!s.done;el.className='chk '+(s.done?'done':'');el.innerHTML=s.done?'<i class="ti ti-check" style="font-size:9px"></i>':'';const lbl=el.nextElementSibling;if(lbl){lbl.style.textDecoration=s.done?'line-through':'';lbl.style.color=s.done?'var(--text3)':'';}addLog(s.done?'Completed subtask':'Reopened subtask',s.name,'subtask',s.id,tid);checkAutoComplete(t);renderView();updateBadges();}
function delSubMod(tid,sid){const t=tasks.find(x=>x.id===tid);if(!t)return;const s=t.subtasks.find(x=>x.id===sid);if(!s||!confirm('Delete "'+s.name+'"?'))return;t.subtasks=t.subtasks.filter(x=>x.id!==sid);addLog('Deleted subtask',s.name,'subtask',sid,tid);dbSaveTask(t);renderView();closeModal();openTask(tid);}
function delTaskModal(id){const t=tasks.find(x=>x.id===id);if(!t||!confirm('Delete "'+t.name+'"?'))return;tasks=tasks.filter(x=>x.id!==id);addLog('Deleted task',t.name,'task',id);dbDeleteTask(id);closeModal();renderView();updateBadges();}
function saveTask(id){const t=tasks.find(x=>x.id===id);if(!t)return;const old=t.name;const projectId=document.getElementById('et-proj').value;const clientId=document.getElementById('et-cli').value;const effClient=effectiveClient(projectId,clientId);const assignee=document.getElementById('et-assign').value;if(!validateAssignment(assignee,effClient))return;for(const s of (t.subtasks||[])){if(!validateAssignment(s.assignee,effClient))return;}t.name=document.getElementById('et-name').value.trim()||t.name;t.project=projectId;t.client=clientId;t.assignee=assignee;t.due=document.getElementById('et-due').value;t.recur=document.getElementById('et-recur').value;t.period=document.getElementById('et-period')?.value||'';t.notes=document.getElementById('et-notes').value;addLog('Updated task',old+(t.name!==old?' → '+t.name:''),'task',t.id);dbSaveTask(t);closeModal();renderView();toast('Task saved');}

function clientAccessHTML(clientId){
  if(!isAdmin())return '';
  const rows=members.filter(m=>m.role!=='admin').map(m=>`<label class="cb-item"><input type="checkbox" value="${m.id}" ${clientId&&memberCanAccessClient(m.id,clientId)?'checked':''}><div class="av" style="width:20px;height:20px;background:var(--bg2);color:var(--text);font-size:8px">${m.initials}</div>${m.name}</label>`).join('')||'<div style="padding:10px;color:var(--text3);font-size:13px">No staff members yet</div>';

}
function getClientAccessMembers(){return [...document.querySelectorAll('#client-access-list input:checked')].map(x=>x.value);}
function grantClientAccess(clientId, memberIds){
  if(!isAdmin())return;
  members.forEach(m=>{
    if(m.role==='admin')return;
    if(!memberIds.includes(m.id))return;
    const a=normalizeAccess(m.access||defaultAccess(),m.role||'staff');
    if(a.clients!=='all'){
      if(!Array.isArray(a.clients))a.clients=[];
      if(!a.clients.includes(clientId))a.clients.push(clientId);
      m.access=a;
      dbSaveMember(m).catch(err=>console.error('Could not save client access for '+m.name,err));
    }
  });
}

async function saveNewMem(){
  const name=document.getElementById('am-name').value.trim();if(!name){toast('Enter a name');return;}
  const email=document.getElementById('am-email').value.trim();if(!email){toast('Enter an email');return;}
  // Check for duplicate email
  if(members.find(m=>m.email.toLowerCase()===email.toLowerCase())){toast('A member with this email already exists');return;}
  const ini=name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
  const pids=['blue','teal','amber','pink','purple','green','red'];
  const palId=pids[members.length%pids.length];
  const role=document.getElementById('am-role').value;
  const m={id:'m'+Date.now(),name,initials:ini,palId,role,email,access:normalizeAccess(null,role)};
  members.push(m);
  addLog('Added member',name+' as '+ROLES[m.role].name);
  try{
    await dbSaveMember(m);
    renderMemNav();closeModal();renderView();
    toast('Member added — they can now sign in with Microsoft');
  } catch(e){
    members=members.filter(x=>x.id!==m.id);
    toast('Error saving member: '+(e.message||'check Supabase'));
  }
}

function toggleEditAccessSection(role){ const box=document.getElementById('em-access-box'); const msg=document.getElementById('em-admin-full-msg'); if(box) box.style.display=role==='admin'?'none':'block'; if(msg) msg.style.display=role==='admin'?'block':'none'; }
async function saveEditMem(id){
  const m=getMem(id);if(!m.id)return;
  const before={...m,access:JSON.parse(JSON.stringify(m.access||defaultAccess()))};
  const saveBtn=document.querySelector('.mftr .btn-pri');
  if(saveBtn){saveBtn.disabled=true;saveBtn.innerHTML='<i class="ti ti-loader"></i>Saving…';}
  m.name=document.getElementById('em-name').value.trim()||m.name;
  m.email=document.getElementById('em-email').value.trim();
  m.role=document.getElementById('em-role').value;
  if(m.role!=='admin'){
    const hasAccessUI=!!document.getElementById('em-cli-mode');
    if(!hasAccessUI){
      // Basic edit modal without access controls: keep existing access as-is,
      // only re-normalize under the (possibly changed) non-admin role.
      m.access=normalizeAccess(before.access,m.role);
    } else {
      const cm=document.getElementById('em-cli-mode')?.value||'none';
      const pm=document.getElementById('em-proj-mode')?.value||'assigned';
      const tm=document.getElementById('em-task-mode')?.value||'assigned';
      const st=document.getElementById('sw-see-team');
      const cliVal=cm==='specific'?Array.from(document.querySelectorAll('#em-cli-list input:checked')).map(x=>x.value):cm;
      const projVal=pm==='specific'?Array.from(document.querySelectorAll('#em-proj-list input:checked')).map(x=>x.value):pm;
      const prev=normalizeAccess(m.access||defaultAccess(),m.role);
      m.access=normalizeAccess({clients:cliVal,projects:projVal,tasks:tm,seeTeam:st?st.classList.contains('on'):false,seeTeamMembers:prev.seeTeamMembers,visMembers:prev.visMembers},m.role);
    }
  } else {
    m.access=normalizeAccess(null,'admin');
  }
  try{
    await dbSaveMember(m);
    addLog('Updated member',m.name,'member',m.id);
    if(m.id===currentUser.id){currentUser=m;document.getElementById('sb-nm').textContent=m.name;document.getElementById('sb-rl').textContent=ROLES[m.role].name;}
    renderMemNav();closeModal();renderView();
    toast('Saved to Supabase — access updated');
  } catch(e){
    Object.assign(m,before);
    toast('Access was not saved: '+(e.message||'check Supabase'));
    if(saveBtn){saveBtn.disabled=false;saveBtn.innerHTML='Save';}
  }
}
function rmMem(id){const m=getMem(id);if(!m.id||!confirm('Remove '+m.name+'?'))return;members=members.filter(x=>x.id!==id);addLog('Removed member',m.name);dbDeleteMember(id);renderMemNav();renderView();}
async function saveMemberAccessFromDetail(id){
  const m=getMem(id);if(!m.id||m.role==='admin')return;
  const cm=document.getElementById('mad-cli-mode')?.value||'none';
  const pm=document.getElementById('mad-proj-mode')?.value||'assigned';
  const tm=document.getElementById('mad-task-mode')?.value||'assigned';
  const subMode=document.getElementById('mad-sub-mode')?.value||'follow';
  const todoMode=document.getElementById('mad-todo-mode')?.value||'assigned';
  const st=document.getElementById('sw-mad-see-team');
  const pick=id=>Array.from(document.querySelectorAll('#'+id+' input:checked')).map(x=>x.value);
  const cliVal=cm==='specific'?pick('mad-cli-rt-panel'):cm;
  // Projects: "specific" = project ids in a.projects; "people" = owner ids in visMembers.projects (mode baseline 'assigned').
  const projVal = pm==='specific' ? pick('mad-proj-inner') : (pm==='people' ? 'assigned' : pm);
  // Tasks: "people" mode is stored on a.tasks with owners in visMembers.tasks.
  const taskVal = tm;
  const visMembers={
    tasks:    tm==='people'      ? pick('mad-task-people-inner')  : [],
    projects: pm==='people'      ? pick('mad-proj-people-inner')  : [],
    subtasks: subMode==='people' ? pick('mad-sub-people-inner')   : [],
    todos:    todoMode==='people'? pick('mad-todo-people-inner')  : []
  };
  const seeTeamOn=st?st.classList.contains('on'):false;
  const seeTeamMembers=seeTeamOn?pick('mad-seeteam-inner'):[];
  m.access=normalizeAccess({clients:cliVal,projects:projVal,tasks:taskVal,seeTeam:seeTeamOn,seeTeamMembers,visMembers},m.role);
  try{
    await dbSaveMember(m);
    addLog('Updated access',m.name,'member',m.id);
    renderView();
    toast('Access saved');
  }catch(e){toast('Could not save access: '+(e.message||'check Supabase'));}
}
window.updateMadCliTrigger=function(){

window.removeMemberClientAccess=async function(clientId,memberId){
  const m=getMem(memberId);if(!m||!m.id||m.role==='admin')return;
  const a=m.access||defaultAccess();

/* ══════════════════════════════════════════
   FILES (stored as metadata per entity)
══════════════════════════════════════════ */
let entityFiles={};
function getFiles(key){return entityFiles[key]||[];}
function addFile(key,file){if(!entityFiles[key])entityFiles[key]=[];entityFiles[key].push(file);}
function removeFile(key,id){if(entityFiles[key])entityFiles[key]=entityFiles[key].filter(f=>f.id!==id);saveFilesSetting();}
async function saveFilesSetting(){try{const client=getSB();if(client)await client.from('app_settings').upsert({key:'entity_files',value:entityFiles});}catch(e){console.warn('Could not save attachments',e);}}
function fileIcon(type){if(!type)return'ti-file';if(type.includes('image'))return'ti-photo';if(type.includes('pdf'))return'ti-file-type-pdf';if(type.includes('word')||type.includes('document'))return'ti-file-type-doc';if(type.includes('sheet')||type.includes('excel')||type.includes('csv'))return'ti-file-type-xls';if(type.includes('zip'))return'ti-file-zip';return'ti-file';}
function fmtSize(b){if(b<1024)return b+'B';if(b<1048576)return(b/1024).toFixed(1)+'KB';return(b/1048576).toFixed(1)+'MB';}
function renderFilesSection(entityKey,canEdit){
  const files=getFiles(entityKey);
  const safeKey=entityKey.replace(/[^a-z0-9]/gi,'_');
  return`<div class="fl"><label>Files & attachments</label><div class="file-tabs-note">Attach files and add a description directly in the row — no pop-up windows.</div>
    <div class="attach-box" id="files-${safeKey}">
      <div class="attach-head">
        <div class="attach-title">Attachments</div>
        ${canEdit?`<button class="btn btn-sm attach-add" type="button"><i class="ti ti-upload"></i>Add files<input type="file" multiple onchange="handleFileUpload('${entityKey}',this)"></button>`:''}
      </div>
      <div id="files-list-${safeKey}">
      ${files.length?files.map(f=>fileRowHTML(entityKey,f,canEdit)).join(''):'<div class="attach-empty">No files attached yet.</div>'}
      </div>
    </div>
  </div>`;
}
function fileRowHTML(entityKey,f,canEdit){
  return`<div class="attach-row">
    <div class="file-icon"><i class="ti ${fileIcon(f.type)}"></i></div>
    <div style="min-width:0"><div class="attach-name">${esc(f.name)}</div><div class="attach-meta">${fmtSize(f.size)} · ${f.ts||TODAY}</div></div>
    <input class="attach-desc" placeholder="Description" value="${esc(f.desc||'')}" ${canEdit?'':'disabled'} onchange="updateFileDesc('${entityKey}','${f.id}',this.value)">
    <div style="display:flex;gap:3px">${f.dataUrl?`<a href="${f.dataUrl}" download="${esc(f.name)}" class="btn btn-ghost btn-xs"><i class="ti ti-download"></i></a>`:''}${canEdit?`<button class="btn btn-ghost btn-xs btn-danger" onclick="removeFile('${entityKey}','${f.id}');refreshFilesBox('${entityKey}')"><i class="ti ti-trash"></i></button>`:''}</div>
  </div>`;
}
function esc(v){return String(v||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function updateFileDesc(key,id,desc){const f=(entityFiles[key]||[]).find(x=>x.id===id);if(f){f.desc=desc;saveFilesSetting();}}
function refreshFilesBox(key){saveFilesSetting();const safeKey=key.replace(/[^a-z0-9]/gi,'_');const list=document.getElementById('files-list-'+safeKey);if(list){const files=getFiles(key);list.innerHTML=files.length?files.map(f=>fileRowHTML(key,f,true)).join(''):'<div class="attach-empty">No files attached yet.</div>';}}
function handleFileUpload(key,input){
  const picked=Array.from(input.files||[]); if(!picked.length)return;
  let left=picked.length;
  picked.forEach(file=>{
    const reader=new FileReader();
    reader.onload=e=>{addFile(key,{id:'f'+Date.now()+Math.random().toString(36).slice(2),name:file.name,size:file.size,type:file.type,desc:'',dataUrl:e.target.result,uploadedBy:currentUser.id,ts:TODAY}); if(--left===0){saveFilesSetting();refreshFilesBox(key);toast(picked.length+' file(s) attached');}};
    reader.readAsDataURL(file);
  });
  input.value='';
}
let tempFiles={};
function getTempFiles(key){return tempFiles[key]||[];}
function renderTempFilesSection(tempKey,title){
  return`<div class="fl"><label>${title||'Attachments'}</label><div class="attach-box">
    <div class="attach-head"><div class="attach-title">Files</div><button class="btn btn-sm attach-add" type="button"><i class="ti ti-upload"></i>Add files<input type="file" multiple onchange="handleTempUpload('${tempKey}',this)"></button></div>
    <div id="temp-list-${tempKey}">${renderTempFileRows(tempKey)}</div>
  </div></div>`;
}
function renderTempFileRows(tempKey){const files=getTempFiles(tempKey);return files.length?files.map(f=>`<div class="attach-row">
  <div class="file-icon"><i class="ti ${fileIcon(f.type)}"></i></div>
  <div style="min-width:0"><div class="attach-name">${esc(f.name)}</div><div class="attach-meta">${fmtSize(f.size)}</div></div>
  <input class="attach-desc" placeholder="Description" value="${esc(f.desc||'')}" onchange="updateTempDesc('${tempKey}','${f.id}',this.value)">
  <button class="btn btn-ghost btn-xs btn-danger" onclick="removeTempFile('${tempKey}','${f.id}')"><i class="ti ti-trash"></i></button>
</div>`).join(''):'<div class="attach-empty">No files selected yet.</div>';}
function handleTempUpload(tempKey,input){const picked=Array.from(input.files||[]);if(!picked.length)return;if(!tempFiles[tempKey])tempFiles[tempKey]=[];let left=picked.length;picked.forEach(file=>{const reader=new FileReader();reader.onload=e=>{tempFiles[tempKey].push({id:'f'+Date.now()+Math.random().toString(36).slice(2),name:file.name,size:file.size,type:file.type,desc:'',dataUrl:e.target.result,uploadedBy:currentUser.id,ts:TODAY});if(--left===0)refreshTempFiles(tempKey);};reader.readAsDataURL(file);});input.value='';}
function refreshTempFiles(tempKey){const el=document.getElementById('temp-list-'+tempKey);if(el)el.innerHTML=renderTempFileRows(tempKey);}
function updateTempDesc(tempKey,id,desc){const f=(tempFiles[tempKey]||[]).find(x=>x.id===id);if(f)f.desc=desc;}
function removeTempFile(tempKey,id){if(tempFiles[tempKey])tempFiles[tempKey]=tempFiles[tempKey].filter(f=>f.id!==id);refreshTempFiles(tempKey);}
function moveTempFiles(tempKey,entityKey){const files=tempFiles[tempKey]||[];if(files.length){if(!entityFiles[entityKey])entityFiles[entityKey]=[];entityFiles[entityKey].push(...files);delete tempFiles[tempKey];saveFilesSetting();}}

══════════════════════════════════════════ */
let ccEmails=[];
function initCC(cid,init){ccEmails=[...(init||[])];renderCCWidget(cid);}
function renderCCWidget(cid){
  const c=document.getElementById(cid);if(!c)return;
  c.innerHTML=`<div class="cc-tags" onclick="document.getElementById('${cid}-inp').focus()">
    ${ccEmails.map((e,i)=>`<span class="cc-tag">${e}<button onclick="rmCC(${i},'${cid}')" type="button">×</button></span>`).join('')}
    <input class="cc-input" id="${cid}-inp" placeholder="${ccEmails.length?'Add…':'Team or email…'}" oninput="showCCSugs(this.value,'${cid}')" onkeydown="ccKD(event,'${cid}')" onfocus="showCCSugs(this.value,'${cid}')">
  </div><div id="${cid}-sugs" class="cc-suggestions" style="display:none;position:relative;z-index:10"></div>`;
}
function showCCSugs(q,cid){
  const el=document.getElementById(cid+'-sugs');if(!el)return;
  const lq=q.toLowerCase();
  const mm=members.filter(m=>!ccEmails.includes(m.email)&&(m.name.toLowerCase().includes(lq)||m.email.toLowerCase().includes(lq)));
  let html=mm.map(m=>{const c2=mc2(m.palId);return`<div class="cc-sug-item" onclick="addCC('${m.email}','${cid}')"><div class="av" style="width:22px;height:22px;background:${c2.bg};color:${c2.tc};font-size:9px">${m.initials}</div>${m.name}<span style="font-size:11px;color:var(--text3);margin-left:5px">${m.email}</span></div>`;}).join('');
  if(q&&q.includes('@')&&!ccEmails.includes(q))html+=`<div class="cc-sug-item" onclick="addCC('${q}','${cid}')"><i class="ti ti-mail" style="font-size:15px;color:var(--text3)"></i>Add "${q}"</div>`;
  el.innerHTML=html;el.style.display=html?'':'none';
}
function addCC(email,cid){if(!ccEmails.includes(email))ccEmails.push(email);renderCCWidget(cid);const el=document.getElementById(cid+'-sugs');if(el)el.style.display='none';}
function rmCC(i,cid){ccEmails.splice(i,1);renderCCWidget(cid);}
function ccKD(e,cid){const inp=document.getElementById(cid+'-inp');if(!inp)return;if((e.key===','||e.key==='Enter'||e.key==='Tab')&&inp.value.trim()){e.preventDefault();addCC(inp.value.trim(),cid);}}
function getCCEmails(){return[...ccEmails];}

function buildRCList(exId,q,sel){

    const selObj=Array.isArray(sel)&&sel.length&&typeof sel[0]==='object'?sel.find(s=>s&&s.id===rc.id):null;
    const checked=Array.isArray(sel)?(typeof sel[0]==='string'?sel.includes(rc.id):!!selObj):false;
    const relVal=selObj?selObj.rel||'':'';
    return`<label class="cb-item">
      <input type="checkbox" value="${rc.id}" ${checked?'checked':''}>
      <div style="flex:1;font-size:13.5px;font-weight:500">${rc.name}</div>

        ${REL_TYPES.map(r=>`<option value="${r}"${relVal===r?' selected':''}>${r}</option>`).join('')}

/* ══════════════════════════════════════════
   RECURRING SPAWN
══════════════════════════════════════════ */
function spawnRecurring(){
  // Tasks
  tasks.forEach(t=>{
    if(!t.recur||!t.done)return;
    const due=new Date(t.due);let next=new Date(due);
    if(t.recur==='daily')next.setDate(due.getDate()+1);
    else if(t.recur==='weekly')next.setDate(due.getDate()+7);
    else if(t.recur==='monthly')next.setMonth(due.getMonth()+1);
    else if(t.recur==='quarterly')next.setMonth(due.getMonth()+3);
    else if(t.recur==='semimonthly')next.setDate(due.getDate()+15);
    else if(t.recur==='annual'||t.recur==='yearly')next.setFullYear(due.getFullYear()+1);
    if(next<=new Date(TODAY)){
      tasks.unshift({id:++nid,name:t.name,project:t.project,client:t.client,assignee:t.assignee,due:next.toISOString().slice(0,10),done:false,recur:t.recur,notes:t.notes,subtasks:(t.subtasks||[]).map(s=>({...s,id:++nid,done:false}))});
      t.done=false;addLog('Auto-generated task',t.name+' ('+t.recur+')','task',t.id);
    }
  });
  // To-dos
  todos.forEach(td=>{
    if(!td.recur||!td.done)return;
    const due=new Date(td.due);let next=new Date(due);
    if(td.recur==='daily')next.setDate(due.getDate()+1);
    else if(td.recur==='weekly')next.setDate(due.getDate()+7);
    else if(td.recur==='monthly')next.setMonth(due.getMonth()+1);
    else if(td.recur==='quarterly')next.setMonth(due.getMonth()+3);
    else if(td.recur==='semimonthly')next.setDate(due.getDate()+15);
    else if(td.recur==='annual'||td.recur==='yearly')next.setFullYear(due.getFullYear()+1);
    if(next<=new Date(TODAY)){
      todos.unshift({...td,id:++nid,due:next.toISOString().slice(0,10),done:false});
      td.done=false;addLog('Auto-generated to-do',td.name+' ('+td.recur+')','todo',td.id);
    }
  });
  // Projects (spawn new project copy)
  projects.forEach(p=>{
    if(!p.recur||!p.due)return;
    const due=new Date(p.due);let next=new Date(due);
    if(p.recur==='weekly')next.setDate(due.getDate()+7);
    else if(p.recur==='monthly')next.setMonth(due.getMonth()+1);
    else if(p.recur==='quarterly')next.setMonth(due.getMonth()+3);
    else if(p.recur==='annual'||p.recur==='yearly')next.setFullYear(due.getFullYear()+1);
    if(next<=new Date(TODAY)&&!projects.some(x=>x.name===p.name&&x.due===next.toISOString().slice(0,10))){
      const newId='p'+Date.now();
      projects.push({...p,id:newId,due:next.toISOString().slice(0,10)});
      addLog('Auto-generated project',p.name+' ('+p.recur+')','project',newId);
    }
  });
}

async function dbLoad(){

  if(!client){ console.warn('Supabase not ready'); return false; }
  try {
    const [mRes, cRes, pRes, tRes, tdRes, logRes, setRes] = await Promise.all([
      client.from('members').select('*'),
      client.from('clients').select('*'),
      client.from('projects').select('*'),
      client.from('tasks').select('*').order('created_at',{ascending:false}),
      client.from('todos').select('*').order('created_at',{ascending:false}),
      client.from('audit_log').select('*').order('created_at',{ascending:false}).limit(200),
      client.from('app_settings').select('*'),
    ]);
    if(mRes.data && mRes.data.length > 0){
      members = mRes.data.map(memberFromRow);
    }
    if(cRes.data) clients = cRes.data.map(c=>({id:c.id,name:c.name,contact:c.contact||'',email:c.email||'',phone:c.phone||'',type:c.type||'Business',notes:c.notes||'',contacts:c.contacts||[],relatedClients:c.related_clients||[]}));

    if(tRes.data) tasks = tRes.data.map(t=>{
      const st=t.subtasks;
      const items=Array.isArray(st)?st:(st&&Array.isArray(st.items)?st.items:[]);
      const period=(st&&typeof st==='object'&&!Array.isArray(st))?st.period||'':'';
      return {id:t.id,name:t.name,project:t.project_id||'',assignee:t.assignee_id||'',client:t.client_id||'',due:t.due_date||'',done:t.done||false,recur:t.recur||'',notes:t.notes||'',subtasks:items,period,sortOrder:(t.sort_order!=null?t.sort_order:null)};
    });
    if(tdRes.data) todos = tdRes.data.map(t=>{
      const rawNotes=t.notes||'';
      const periodMatch=rawNotes.match(/\[\[p:([^\]]*)\]\]/);
      const period=periodMatch?periodMatch[1]:'';
      const notes=rawNotes.replace(/\s*\[\[p:[^\]]*\]\]/g,'');
      return {id:t.id,name:t.name,assignee:t.assignee_id||'',client:t.client_id||'',due:t.due_date||'',done:t.done||false,priority:t.priority||'normal',recur:t.recur||'',notes,period};
    });
